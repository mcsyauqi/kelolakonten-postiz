# Proposed Coolify compose for the Kelola Konten Postiz fork.
# This file is a proposal only. The source repository must carry the final copy before deployment.
# Coolify injects every `${...:?}` variable from the application environment.
services:
  postiz:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-v1.47.0}
    expose:
      - "5000"
    restart: always
    environment:
      MAIN_URL: ${MAIN_URL:?set https://app.kelolakonten.com}
      FRONTEND_URL: ${FRONTEND_URL:?set https://app.kelolakonten.com}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?set https://app.kelolakonten.com/api}
      BACKEND_INTERNAL_URL: http://localhost:3000
      PORT: "3000"
      ORCHESTRATOR_PORT: "3002"
      JWT_SECRET: ${JWT_SECRET:?generate a unique secret}
      DATABASE_URL: postgresql://postiz_user:${POSTIZ_DB_PASSWORD:?set a unique password}@kelolakonten-postgres:5432/postiz_db
      REDIS_URL: redis://kelolakonten-redis:6379
      TEMPORAL_ADDRESS: kelolakonten-temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: "false"
      API_LIMIT: "30"
      # Leave Stripe unset: billing is WA-first during staging.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Kelola Konten}
    volumes:
      - kelolakonten-config:/config
      - kelolakonten-uploads:/uploads
    networks:
      - kelolakonten-private
      - kelolakonten-temporal
    depends_on:
      kelolakonten-postgres:
        condition: service_healthy
      kelolakonten-redis:
        condition: service_healthy
      kelolakonten-temporal:
        condition: service_started

  kelolakonten-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD:?set a unique password}
      POSTGRES_USER: postiz_user
      POSTGRES_DB: postiz_db
    volumes:
      - kelolakonten-pg:/var/lib/postgresql/data
    networks: [kelolakonten-private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postiz_user -d postiz_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kelolakonten-redis:
    image: redis:7.2
    restart: always
    command: [redis-server, --appendonly, yes]
    volumes:
      - kelolakonten-redis:/data
    networks: [kelolakonten-private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  kelolakonten-temporal-es:
    image: elasticsearch:7.17.27
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
      cluster.routing.allocation.disk.threshold_enabled: "true"
      cluster.routing.allocation.disk.watermark.low: 512mb
      cluster.routing.allocation.disk.watermark.high: 256mb
      cluster.routing.allocation.disk.watermark.flood_stage: 128mb
    volumes:
      - kelolakonten-temporal-es:/usr/share/elasticsearch/data
    networks: [kelolakonten-temporal]

  kelolakonten-temporal-pg:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set a unique password}
      POSTGRES_USER: temporal
    volumes:
      - kelolakonten-temporal-pg:/var/lib/postgresql/data
    networks: [kelolakonten-temporal]

  kelolakonten-temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always
    depends_on:
      - kelolakonten-temporal-pg
      - kelolakonten-temporal-es
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set a unique password}
      POSTGRES_SEEDS: kelolakonten-temporal-pg
      ENABLE_ES: "true"
      ES_SEEDS: kelolakonten-temporal-es
      ES_VERSION: v7
      TEMPORAL_NAMESPACE: default
    volumes:
    networks: [kelolakonten-temporal]

volumes:
  kelolakonten-config:
  kelolakonten-uploads:
  kelolakonten-pg:
  kelolakonten-redis:
  kelolakonten-temporal-pg:
  kelolakonten-temporal-es:

networks:
  kelolakonten-private:
    internal: true
  kelolakonten-temporal:
    internal: true






