# Proposed Coolify compose for the Kelola Konten Postiz fork.
# This file is a proposal only. The source repository must carry the final copy before deployment.
# Coolify injects every `${...:?}` variable from the application environment.
services:
  postiz:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-v1.47.0}
    expose:
      - "5000"
    restart: always
    # nginx + pm2-runtime + three node apps in one container: an init reaps orphaned children.
    init: true
    # Normal use is about 1.3 GB (backend ~630 MB, orchestrator ~500 MB, frontend ~150 MB, pm2,
    # nginx). The per-app restart thresholds in var/docker/ecosystem.config.js add up to 2.15 GB,
    # so pm2 restarts a growing app before this cgroup limit is reached.
    # memswap_limit = mem_limit: no swap, so a runaway app is restarted instead of dragging the host.
    mem_limit: 2560m
    memswap_limit: 2560m
    environment:
      MAIN_URL: ${MAIN_URL:?set https://app.kelolakonten.com}
      FRONTEND_URL: ${FRONTEND_URL:?set https://app.kelolakonten.com}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?set https://app.kelolakonten.com/api}
      BACKEND_INTERNAL_URL: http://localhost:3000
      PORT: "3000"
      ORCHESTRATOR_PORT: "3002"
      JWT_SECRET: ${JWT_SECRET:?generate a unique secret}
      DATABASE_URL: postgresql://postiz_user:${POSTIZ_DB_PASSWORD:?set a unique password}@kelolakonten-postgres:5432/postiz_db
      REDIS_URL: redis://kelolakonten-redis:6379
      TEMPORAL_ADDRESS: kelolakonten-temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: "false"
      API_LIMIT: "30"
      # Leave Stripe unset: billing is WA-first during staging.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      # Comma-separated provider identifiers hidden from the add-channel screen.
      HIDDEN_PROVIDERS: ${HIDDEN_PROVIDERS:-}
      # Comma-separated OAuth scopes not requested yet (pending platform app review).
      DISABLED_SCOPES: ${DISABLED_SCOPES:-}
      # Status page linked from the platform data deletion callback response.
      DATA_DELETION_STATUS_URL: ${DATA_DELETION_STATUS_URL:-https://kelolakonten.com/privacy}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-hello@kelolakonten.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # EMAIL_PROVIDER=nodemailer: ForwardEmail SMTP (smtp.forwardemail.net:465, alias noreply@kelolakonten.com).
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Kelola Konten}
    volumes:
      - kelolakonten-config:/config
      - kelolakonten-uploads:/uploads
    networks:
      - kelolakonten-private
      - kelolakonten-temporal
    depends_on:
      kelolakonten-postgres:
        condition: service_healthy
      kelolakonten-redis:
        condition: service_healthy
      kelolakonten-temporal:
        condition: service_started

  kelolakonten-postgres:
    image: postgres:17-alpine
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD:?set a unique password}
      POSTGRES_USER: postiz_user
      POSTGRES_DB: postiz_db
    volumes:
      - kelolakonten-pg:/var/lib/postgresql/data
    networks: [kelolakonten-private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postiz_user -d postiz_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kelolakonten-redis:
    image: redis:7.2
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    command: [redis-server, --appendonly, yes]
    volumes:
      - kelolakonten-redis:/data
    networks: [kelolakonten-private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  kelolakonten-temporal-pg:
    image: postgres:16
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set a unique password}
      POSTGRES_USER: temporal
    volumes:
      - kelolakonten-temporal-pg:/var/lib/postgresql/data
    networks: [kelolakonten-temporal]

  kelolakonten-temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      - kelolakonten-temporal-pg
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set a unique password}
      POSTGRES_SEEDS: kelolakonten-temporal-pg
      # Visibility (workflow search by postId) lives in PostgreSQL (advanced visibility, postgres12
      # plugin, database temporal_visibility) instead of an Elasticsearch container (~700 MB RSS).
      # auto-setup creates that database on boot; the backend re-registers the postId and
      # organizationId search attributes on start (temporal.register.ts).
      ENABLE_ES: "false"
      # PostgreSQL visibility has only 3 Text search-attribute slots per namespace and the app
      # needs 2 (postId, organizationId). auto-setup otherwise adds sample attributes
      # (CustomTextField, CustomStringField: 2 more Text) and the app registration then fails.
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: "true"
      TEMPORAL_NAMESPACE: default
      # Coolify also attaches this container to its own network, so `hostname -i` (the auto-setup
      # default bind IP) can pick the wrong interface and postiz gets ECONNREFUSED on :7233
      # (seen 2026-11-25). Listen on every interface; single node, so loopback broadcast is fine.
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
    networks: [kelolakonten-temporal]

volumes:
  kelolakonten-config:
  kelolakonten-uploads:
  kelolakonten-pg:
  kelolakonten-redis:
  kelolakonten-temporal-pg:
  # No longer mounted (Elasticsearch visibility was replaced by PostgreSQL). Kept declared so the
  # volume and its data stay in place for a rollback.
  kelolakonten-temporal-es:

networks:
  kelolakonten-private:
    internal: true
  kelolakonten-temporal:
    internal: true
