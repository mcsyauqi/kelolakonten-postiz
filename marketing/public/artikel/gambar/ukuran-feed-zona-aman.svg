<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="640" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Zona aman konten vertikal 9:16 (1080 x 1920 px)</text>
<rect x="120" y="110" width="270" height="480" rx="22" fill="#ffffff" stroke="#13235a" stroke-width="4"/>
<rect x="120" y="110" width="270" height="67" rx="22" fill="#c2581e" opacity=".8"/>
<rect x="120" y="422" width="270" height="168" rx="22" fill="#c2581e" opacity=".8"/>
<rect x="120" y="177" width="16" height="245" fill="#c2581e" opacity=".55"/>
<rect x="374" y="177" width="16" height="245" fill="#c2581e" opacity=".55"/>
<rect x="136" y="177" width="238" height="245" fill="#1f8a7a"/>
<text x="255" y="292" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">zona aman</text>
<text x="255" y="320" font-size="16" fill="#e8fff8" text-anchor="middle">teks, wajah, produk</text>
<text x="255" y="150" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">atas 14%</text>
<text x="255" y="512" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">bawah 35%</text>
<g font-size="20" fill="#13235a">
<text x="470" y="170" font-weight="700">Atas sekitar 14%</text><text x="470" y="198" font-size="17" fill="#3b4a7a">bisa tertutup nama akun, foto profil, dan bilah progres</text>
<text x="470" y="270" font-weight="700">Samping sekitar 6% di tiap sisi</text><text x="470" y="298" font-size="17" fill="#3b4a7a">layar ponsel yang lebih tinggi dari 9:16 bisa memotong tepi</text>
<text x="470" y="370" font-weight="700">Bawah sekitar 35%</text><text x="470" y="398" font-size="17" fill="#3b4a7a">bisa tertutup caption, tombol, kolom balas, dan ajakan bertindak</text>
<text x="470" y="470" font-weight="700" fill="#1f8a7a">Tengah: tempat pesan utama</text><text x="470" y="498" font-size="17" fill="#3b4a7a">harga, judul, dan logo tetap terbaca di semua perangkat</text>
</g>
<text x="60" y="618" font-size="16" fill="#3b4a7a">Persentase mengikuti rekomendasi Meta Ads Guide untuk Instagram Stories. Untuk konten organik dipakai sebagai patokan aman.</text>
</svg>
