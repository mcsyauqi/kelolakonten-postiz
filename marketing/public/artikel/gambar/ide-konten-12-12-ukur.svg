<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 346" width="1200" height="346" role="img" aria-labelledby="t d">
<title id="t">Yang dicatat sebelum, saat, dan sesudah 12.12</title>
<desc id="d">Tiga kolom pencatatan: sebelum 12.12 catat simpan dan klik tautan, saat 12.12 catat chat dan pesanan per jam, sesudah 12.12 catat pesanan per kanal dan pertanyaan yang belum terjawab.</desc>
<rect width="1200" height="346" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Yang dicatat sebelum, saat, dan sesudah 12.12</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Cukup satu lembar sederhana per kanal</text>
<rect x="40" y="116" width="357" height="172" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="58" y="152" font-size="19" fill="#2457d6" font-weight="700">Sebelum</text><circle cx="64" cy="179" r="4" fill="#2457d6"/><text x="78" y="184" font-size="16" fill="#13235a">Jumlah simpan pada teaser</text><circle cx="64" cy="211" r="4" fill="#2457d6"/><text x="78" y="216" font-size="16" fill="#13235a">Klik tautan di bio atau Stories</text><circle cx="64" cy="243" r="4" fill="#2457d6"/><text x="78" y="248" font-size="16" fill="#13235a">Jawaban polling produk incaran</text><rect x="421" y="116" width="357" height="172" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="439" y="152" font-size="19" fill="#2457d6" font-weight="700">Saat hari H</text><circle cx="445" cy="179" r="4" fill="#2457d6"/><text x="459" y="184" font-size="16" fill="#13235a">Chat masuk per jam</text><circle cx="445" cy="211" r="4" fill="#2457d6"/><text x="459" y="216" font-size="16" fill="#13235a">Pesanan per jam</text><circle cx="445" cy="243" r="4" fill="#2457d6"/><text x="459" y="248" font-size="16" fill="#13235a">Produk yang cepat habis</text><rect x="802" y="116" width="357" height="172" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="820" y="152" font-size="19" fill="#2457d6" font-weight="700">Sesudah</text><circle cx="826" cy="179" r="4" fill="#2457d6"/><text x="840" y="184" font-size="16" fill="#13235a">Pesanan per kanal atau kode promo</text><circle cx="826" cy="211" r="4" fill="#2457d6"/><text x="840" y="216" font-size="16" fill="#13235a">Pertanyaan yang berulang</text><circle cx="826" cy="243" r="4" fill="#2457d6"/><text x="840" y="248" font-size="16" fill="#13235a">Konten dengan respons terbaik</text><text x="40" y="326" font-size="16" fill="#4a5680">Data ini dipakai lagi untuk merencanakan promo akhir tahun dan kampanye berikutnya.</text>
</g>
</svg>
