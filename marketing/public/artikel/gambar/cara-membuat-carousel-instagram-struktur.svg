<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d">
<title id="t">Struktur carousel edukasi tujuh slide</title>
<desc id="d">Tujuh kartu berurutan: hook, konteks, tiga slide isi, ringkasan, dan ajakan.</desc>
<rect width="1200" height="370" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Struktur carousel edukasi tujuh slide</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep; jumlah slide isi bisa ditambah atau dikurangi</text>
<rect x="40" y="120" width="146" height="182" rx="12" fill="#ffffff" stroke="#c9d4f2"/><rect x="40" y="120" width="146" height="10" rx="5" fill="#c2581e"/><text x="113" y="175" font-size="34" fill="#c2581e" font-weight="700" text-anchor="middle">1</text><text x="113" y="222" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Hook</text><text x="113" y="250" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Janji atau masalah</text><line x1="186" y1="211" x2="200" y2="211" stroke="#4a5680" stroke-width="2"/><polygon points="200,211 191.0,215.3 191.0,206.7" fill="#4a5680"/><rect x="202" y="120" width="146" height="182" rx="12" fill="#ffffff" stroke="#c9d4f2"/><rect x="202" y="120" width="146" height="10" rx="5" fill="#2457d6"/><text x="275" y="175" font-size="34" fill="#2457d6" font-weight="700" text-anchor="middle">2</text><text x="275" y="222" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Konteks</text><text x="275" y="250" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Kenapa penting</text><line x1="348" y1="211" x2="362" y2="211" stroke="#4a5680" stroke-width="2"/><polygon points="362,211 353.0,215.3 353.0,206.7" fill="#4a5680"/><rect x="364" y="120" width="146" height="182" rx="12" fill="#ffffff" stroke="#c9d4f2"/><rect x="364" y="120" width="146" height="10" rx="5" fill="#1f8a7a"/><text x="437" y="175" font-size="34" fill="#1f8a7a" font-weight="700" text-anchor="middle">3</text><text x="437" y="222" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Isi 1</text><text x="437" y="250" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Langkah pertama</text><line x1="510" y1="211" x2="524" y2="211" stroke="#4a5680" stroke-width="2"/><polygon points="524,211 515.0,215.3 515.0,206.7" fill="#4a5680"/><rect x="526" y="120" width="146" height="182" rx="12" fill="#ffffff" stroke="#c9d4f2"/><rect x="526" y="120" width="146" height="10" rx="5" fill="#1f8a7a"/><text x="599" y="175" font-size="34" fill="#1f8a7a" font-weight="700" text-anchor="middle">4</text><text x="599" y="222" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Isi 2</text><text x="599" y="250" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Langkah kedua</text><line x1="672" y1="211" x2="686" y2="211" stroke="#4a5680" stroke-width="2"/><polygon points="686,211 677.0,215.3 677.0,206.7" fill="#4a5680"/><rect x="688" y="120" width="146" height="182" rx="12" fill="#ffffff" stroke="#c9d4f2"/><rect x="688" y="120" width="146" height="10" rx="5" fill="#1f8a7a"/><text x="761" y="175" font-size="34" fill="#1f8a7a" font-weight="700" text-anchor="middle">5</text><text x="761" y="222" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Isi 3</text><text x="761" y="250" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Langkah ketiga</text><line x1="834" y1="211" x2="848" y2="211" stroke="#4a5680" stroke-width="2"/><polygon points="848,211 839.0,215.3 839.0,206.7" fill="#4a5680"/><rect x="850" y="120" width="146" height="182" rx="12" fill="#ffffff" stroke="#c9d4f2"/><rect x="850" y="120" width="146" height="10" rx="5" fill="#6a4fd1"/><text x="923" y="175" font-size="34" fill="#6a4fd1" font-weight="700" text-anchor="middle">6</text><text x="923" y="222" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Ringkas</text><text x="923" y="250" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Satu kalimat</text><line x1="996" y1="211" x2="1010" y2="211" stroke="#4a5680" stroke-width="2"/><polygon points="1010,211 1001.0,215.3 1001.0,206.7" fill="#4a5680"/><rect x="1012" y="120" width="146" height="182" rx="12" fill="#ffffff" stroke="#c9d4f2"/><rect x="1012" y="120" width="146" height="10" rx="5" fill="#c2581e"/><text x="1085" y="175" font-size="34" fill="#c2581e" font-weight="700" text-anchor="middle">7</text><text x="1085" y="222" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Ajakan</text><text x="1085" y="250" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Simpan atau DM</text><text x="40" y="345" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Slide 1 menentukan apakah orang mau menggeser. Slide terakhir menentukan apa yang mereka lakukan sesudahnya.</text>
</g>
</svg>
