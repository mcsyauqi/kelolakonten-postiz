<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="640" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Sepuluh bagian brief konten yang jelas</text>
<text x="60" y="96" font-size="18" fill="#4a5578">Isi dari kiri atas ke kanan bawah. Kalau satu kotak kosong, brief belum siap dikirim.</text>
<g font-size="20" font-weight="700" fill="#fff" text-anchor="middle">
<rect x="60" y="140" width="196" height="170" rx="16" fill="#2457d6"/><text x="158" y="186">1. Tujuan</text>
<rect x="281" y="140" width="196" height="170" rx="16" fill="#2457d6"/><text x="379" y="186">2. Audiens</text>
<rect x="502" y="140" width="196" height="170" rx="16" fill="#2457d6"/><text x="600" y="186">3. Pesan kunci</text>
<rect x="723" y="140" width="196" height="170" rx="16" fill="#1f8a7a"/><text x="821" y="186">4. Format, kanal</text>
<rect x="944" y="140" width="196" height="170" rx="16" fill="#1f8a7a"/><text x="1042" y="186">5. CTA</text>
<rect x="60" y="340" width="196" height="170" rx="16" fill="#1f8a7a"/><text x="158" y="386">6. Referensi</text>
<rect x="281" y="340" width="196" height="170" rx="16" fill="#1f8a7a"/><text x="379" y="386">7. Aset</text>
<rect x="502" y="340" width="196" height="170" rx="16" fill="#6a4fd1"/><text x="600" y="386">8. Tenggat</text>
<rect x="723" y="340" width="196" height="170" rx="16" fill="#6a4fd1"/><text x="821" y="386">9. Penyetuju</text>
<rect x="944" y="340" width="196" height="170" rx="16" fill="#c2581e"/><text x="1042" y="386">10. Metrik</text>
</g>
<g font-size="16" fill="#eef2ff" text-anchor="middle">
<text x="158" y="232">hasil yang ingin</text><text x="158" y="256">dicapai konten</text>
<text x="379" y="232">siapa pembacanya</text><text x="379" y="256">dan apa masalahnya</text>
<text x="600" y="232">satu kalimat yang</text><text x="600" y="256">harus diingat</text>
<text x="821" y="232">bentuk konten dan</text><text x="821" y="256">tempat tayangnya</text>
<text x="1042" y="232">satu tindakan</text><text x="1042" y="256">untuk audiens</text>
<text x="158" y="432">contoh gaya yang</text><text x="158" y="456">disukai dan dihindari</text>
<text x="379" y="432">foto, logo, harga,</text><text x="379" y="456">data yang tersedia</text>
<text x="600" y="432">draft, revisi,</text><text x="600" y="456">dan tanggal tayang</text>
<text x="821" y="432">satu nama yang</text><text x="821" y="456">berhak menyetujui</text>
<text x="1042" y="432">angka penanda</text><text x="1042" y="456">konten berhasil</text>
</g>
<g font-size="17" fill="#13235a">
<rect x="60" y="560" width="22" height="22" rx="5" fill="#2457d6"/><text x="92" y="577">Arah</text>
<rect x="190" y="560" width="22" height="22" rx="5" fill="#1f8a7a"/><text x="222" y="577">Bentuk</text>
<rect x="338" y="560" width="22" height="22" rx="5" fill="#6a4fd1"/><text x="370" y="577">Kendali</text>
<rect x="490" y="560" width="22" height="22" rx="5" fill="#c2581e"/><text x="522" y="577">Ukuran keberhasilan</text>
</g>
</svg>
