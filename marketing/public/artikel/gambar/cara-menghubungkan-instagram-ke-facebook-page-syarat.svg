<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d"><title id="t">Tiga syarat sebelum menghubungkan Instagram ke Facebook Page</title><desc id="d">Papan klip berisi tiga syarat dari Meta: akun Instagram profesional, kendali penuh atas Facebook Page, dan keduanya berada di portofolio bisnis yang sama; di kiri dan kanan ada akun Instagram dan Facebook Page yang akan disambungkan</desc><rect width="1200" height="440" fill="#f4f7ff"/><rect x="60" y="70" width="190" height="300" rx="18" fill="#fff" stroke="#13235a" stroke-width="3"/><rect x="137" y="78" width="36" height="6" rx="3" fill="#c9d4f2"/><rect x="72" y="96" width="166" height="256" rx="8" fill="#2457d6" opacity="0.12"/><circle cx="155" cy="150" r="34" fill="#2457d6" opacity="0.85"/><rect x="95" y="200" width="120" height="10" rx="5" fill="#13235a"/><rect x="110" y="220" width="90" height="8" rx="4" fill="#c9d4f2"/><rect x="86" y="248" width="40" height="32" rx="4" fill="#2457d6" opacity="0.5"/><rect x="132" y="248" width="40" height="32" rx="4" fill="#1f8a7a" opacity="0.5"/><rect x="178" y="248" width="40" height="32" rx="4" fill="#6a4fd1" opacity="0.5"/><rect x="86" y="286" width="40" height="32" rx="4" fill="#1f8a7a" opacity="0.5"/><rect x="132" y="286" width="40" height="32" rx="4" fill="#6a4fd1" opacity="0.5"/><rect x="178" y="286" width="40" height="32" rx="4" fill="#2457d6" opacity="0.5"/><rect x="86" y="324" width="40" height="32" rx="4" fill="#6a4fd1" opacity="0.5"/><rect x="132" y="324" width="40" height="32" rx="4" fill="#2457d6" opacity="0.5"/><rect x="178" y="324" width="40" height="32" rx="4" fill="#1f8a7a" opacity="0.5"/><text x="155" y="400" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Akun Instagram</text><rect x="950" y="90" width="210" height="260" rx="12" fill="#fff" stroke="#13235a" stroke-width="3"/><rect x="950" y="90" width="210" height="34" rx="12" fill="#13235a"/><circle cx="972" cy="107" r="5" fill="#fff"/><circle cx="988" cy="107" r="5" fill="#fff"/><rect x="966" y="138" width="178" height="64" rx="6" fill="#1f8a7a" opacity="0.35"/><circle cx="1000" cy="206" r="26" fill="#1f8a7a" stroke="#fff" stroke-width="4"/><rect x="1034" y="214" width="96" height="10" rx="5" fill="#13235a"/><rect x="970" y="246" width="170" height="9" rx="4" fill="#c9d4f2"/><rect x="970" y="268" width="144" height="9" rx="4" fill="#c9d4f2"/><rect x="970" y="290" width="118" height="9" rx="4" fill="#c9d4f2"/><rect x="970" y="312" width="92" height="9" rx="4" fill="#c9d4f2"/><text x="1055" y="400" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Facebook Page</text><rect x="350" y="60" width="500" height="340" rx="16" fill="#fff" stroke="#c9d4f2" stroke-width="3"/><rect x="530" y="44" width="140" height="34" rx="10" fill="#13235a"/><circle cx="390" cy="130" r="13" fill="#1f8a7a"/><path d="M384 130l4 5 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="128" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="700" text-anchor="start">Akun Instagram profesional</text><text x="418" y="156" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#4a5680" font-weight="400" text-anchor="start">akun bisnis atau kreator</text><circle cx="390" cy="222" r="13" fill="#1f8a7a"/><path d="M384 222l4 5 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="220" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="700" text-anchor="start">Kendali penuh atas Page</text><text x="418" y="248" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#4a5680" font-weight="400" text-anchor="start">paling aman: akses penuh (full control)</text><circle cx="390" cy="314" r="13"