<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d">
<title id="t">Susunan carousel recap akhir tahun</title>
<desc id="d">Lima slide carousel recap: judul, angka, favorit, balik layar, terima kasih</desc>
<rect width="1200" height="430" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Susunan carousel recap akhir tahun</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Contoh urutan lima slide yang bisa langsung dipakai</text>
<rect x="40" y="120" width="200" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="152" font-size="18" font-weight="700" fill="#2457d6">Slide 1</text><text x="58" y="180" font-size="15" fill="#13235a">Judul: setahun</text><text x="58" y="202" font-size="15" fill="#13235a">bersama Anda</text><line x1="242" y1="220" x2="266" y2="220" stroke="#4a5680" stroke-width="2"/><polygon points="266,220 257.0,224.3 257.0,215.7" fill="#4a5680"/><rect x="268" y="120" width="200" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="286" y="152" font-size="18" font-weight="700" fill="#1f8a7a">Slide 2</text><text x="286" y="180" font-size="15" fill="#13235a">Angka nyata</text><text x="286" y="202" font-size="15" fill="#13235a">tahun ini</text><line x1="470" y1="220" x2="494" y2="220" stroke="#4a5680" stroke-width="2"/><polygon points="494,220 485.0,224.3 485.0,215.7" fill="#4a5680"/><rect x="496" y="120" width="200" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="514" y="152" font-size="18" font-weight="700" fill="#6a4fd1">Slide 3</text><text x="514" y="180" font-size="15" fill="#13235a">Produk atau</text><text x="514" y="202" font-size="15" fill="#13235a">momen favorit</text><line x1="698" y1="220" x2="722" y2="220" stroke="#4a5680" stroke-width="2"/><polygon points="722,220 713.0,224.3 713.0,215.7" fill="#4a5680"/><rect x="724" y="120" width="200" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="742" y="152" font-size="18" font-weight="700" fill="#c2581e">Slide 4</text><text x="742" y="180" font-size="15" fill="#13235a">Cerita di</text><text x="742" y="202" font-size="15" fill="#13235a">balik layar</text><line x1="926" y1="220" x2="950" y2="220" stroke="#4a5680" stroke-width="2"/><polygon points="950,220 941.0,224.3 941.0,215.7" fill="#4a5680"/><rect x="952" y="120" width="200" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="970" y="152" font-size="18" font-weight="700" fill="#2457d6">Slide 5</text><text x="970" y="180" font-size="15" fill="#13235a">Terima kasih</text><text x="970" y="202" font-size="15" fill="#13235a">dan teaser</text><text x="40" y="370" font-size="17" fill="#13235a" font-weight="700" text-anchor="start">Satu pesan per slide. Angka hanya dari data akun atau toko sendiri.</text><text x="40" y="400" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Slide terakhir selalu berisi ajakan: simpan, bagikan, atau pesan untuk Januari.</text>
</g>
</svg>
