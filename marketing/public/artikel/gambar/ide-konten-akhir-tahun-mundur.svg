<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Produksi mundur dari tanggal tayang</title>
<desc id="d">Empat minggu November untuk menyiapkan konten akhir tahun sebelum Desember</desc>
<rect width="1200" height="420" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Produksi mundur dari tanggal tayang</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Mulai November supaya Desember tidak keteteran</text>
<rect x="50" y="130" width="245" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="68" y="162" font-size="18" font-weight="700" fill="#2457d6">Minggu 1 Nov</text><text x="68" y="190" font-size="15" fill="#13235a">Kumpulkan data</text><text x="68" y="212" font-size="15" fill="#13235a">dan foto setahun</text><line x1="298" y1="195" x2="332" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="332,195 323.0,199.3 323.0,190.7" fill="#4a5680"/><rect x="335" y="130" width="245" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="353" y="162" font-size="18" font-weight="700" fill="#1f8a7a">Minggu 2 Nov</text><text x="353" y="190" font-size="15" fill="#13235a">Tulis naskah</text><text x="353" y="212" font-size="15" fill="#13235a">dan caption</text><line x1="583" y1="195" x2="617" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="617,195 608.0,199.3 608.0,190.7" fill="#4a5680"/><rect x="620" y="130" width="245" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="638" y="162" font-size="18" font-weight="700" fill="#6a4fd1">Minggu 3 Nov</text><text x="638" y="190" font-size="15" fill="#13235a">Desain dan</text><text x="638" y="212" font-size="15" fill="#13235a">rekam video</text><line x1="868" y1="195" x2="902" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="902,195 893.0,199.3 893.0,190.7" fill="#4a5680"/><rect x="905" y="130" width="245" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="923" y="162" font-size="18" font-weight="700" fill="#c2581e">Minggu 4 Nov</text><text x="923" y="190" font-size="15" fill="#13235a">Jadwalkan semua</text><text x="923" y="212" font-size="15" fill="#13235a">di kalender</text><rect x="50" y="300" width="1100" height="90" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="68" y="332" font-size="18" font-weight="700" fill="#13235a">Desember: tinggal pantau dan balas</text><text x="68" y="360" font-size="15" fill="#13235a">Konten sudah terjadwal, tim fokus melayani chat, komentar, dan pesanan yang naik menjelang libur.</text>
</g>
</svg>
