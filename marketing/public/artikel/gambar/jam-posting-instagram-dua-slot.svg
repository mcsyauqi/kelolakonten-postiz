<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Figtree,Segoe UI,Arial,sans-serif">
<rect width="1200" height="600" fill="#f4f7ff"/>
<text x="60" y="64" font-size="28" font-weight="700" fill="#13235a">16 posting dalam 4 minggu: dua slot atau tiga slot?</text>
<text x="60" y="100" font-size="19" fill="#4a5578">Satu kotak = satu posting. Jadwalnya sama, yang berbeda hanya cara membagi slot.</text>
<text x="60" y="168" font-size="22" font-weight="700" fill="#13235a">Dua slot</text>
<g>
<rect x="60" y="186" width="48" height="48" rx="8" fill="#2457d6"/><rect x="116" y="186" width="48" height="48" rx="8" fill="#2457d6"/><rect x="172" y="186" width="48" height="48" rx="8" fill="#2457d6"/><rect x="228" y="186" width="48" height="48" rx="8" fill="#2457d6"/>
<rect x="284" y="186" width="48" height="48" rx="8" fill="#2457d6"/><rect x="340" y="186" width="48" height="48" rx="8" fill="#2457d6"/><rect x="396" y="186" width="48" height="48" rx="8" fill="#2457d6"/><rect x="452" y="186" width="48" height="48" rx="8" fill="#2457d6"/>
<rect x="540" y="186" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="596" y="186" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="652" y="186" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="708" y="186" width="48" height="48" rx="8" fill="#1f8a7a"/>
<rect x="764" y="186" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="820" y="186" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="876" y="186" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="932" y="186" width="48" height="48" rx="8" fill="#1f8a7a"/>
</g>
<g font-size="18" font-weight="700"><text x="60" y="262" fill="#2457d6">Slot A: 8 posting</text><text x="540" y="262" fill="#1f8a7a">Slot B: 8 posting</text></g>
<rect x="1010" y="186" width="150" height="48" rx="24" fill="#13235a"/><text x="1085" y="217" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">8 per slot</text>
<text x="60" y="350" font-size="22" font-weight="700" fill="#13235a">Tiga slot</text>
<g>
<rect x="60" y="368" width="48" height="48" rx="8" fill="#2457d6"/><rect x="116" y="368" width="48" height="48" rx="8" fill="#2457d6"/><rect x="172" y="368" width="48" height="48" rx="8" fill="#2457d6"/><rect x="228" y="368" width="48" height="48" rx="8" fill="#2457d6"/><rect x="284" y="368" width="48" height="48" rx="8" fill="#2457d6"/><rect x="340" y="368" width="48" height="48" rx="8" fill="#2457d6"/>
<rect x="420" y="368" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="476" y="368" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="532" y="368" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="588" y="368" width="48" height="48" rx="8" fill="#1f8a7a"/><rect x="644" y="368" width="48" height="48" rx="8" fill="#1f8a7a"/>
<rect x="724" y="368" width="48" height="48" rx="8" fill="#6a4fd1"/><rect x="780" y="368" width="48" height="48" rx="8" fill="#6a4fd1"/><rect x="836" y="368" width="48" height="48" rx="8" fill="#6a4fd1"/><rect x="892" y="368" width="48" height="48" rx="8" fill="#6a4fd1"/><rect x="948" y="368" width="48" height="48" rx="8" fill="#6a4fd1"/>
</g>
<g font-size="18" font-weight="700"><text x="60" y="444" fill="#2457d6">Slot A: 6</text><text x="420" y="444" fill="#1f8a7a">Slot B: 5</text><text x="724" y="444" fill="#6a4fd1">Slot C: 5</text></g>
<rect x="1010" y="368" width="150" height="48" rx="24" fill="#c2581e"/><text x="1085" y="399" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5 sampai 6</text>
<text x="60" y="520" font-size="20" fill="#4a5578">Makin banyak posting per slot, makin kecil pengaruh satu posting yang kebetulan ramai pada median.</text>
<text x="60" y="556" font-size="18" fill="#7a849e">Contoh ritme 4 posting per minggu. Sesuaikan dengan jumlah posting akun Anda.</text>
</svg>
