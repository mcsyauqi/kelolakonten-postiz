<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="520" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Tiga gaya cover highlight untuk satu set yang sama</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Contoh desain buatan Kelola Konten: Katalog, Testimoni, Cara order, Promo, FAQ</text>
<defs>
<g id="bag"><path d="M-16 -8 h32 l-3 26 h-26 z" fill="none" stroke-width="4" stroke-linejoin="round"/><path d="M-8 -8 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke-width="4"/></g>
<g id="star"><polygon points="0,-20 6,-6 21,-6 9,3 13,18 0,9 -13,18 -9,3 -21,-6 -6,-6" fill="none" stroke-width="4" stroke-linejoin="round"/></g>
<g id="chat"><path d="M-20 -14 h40 v24 h-22 l-10 9 v-9 h-8 z" fill="none" stroke-width="4" stroke-linejoin="round"/></g>
<g id="tag"><path d="M-18 -4 l14 -14 h16 v16 l-14 14 z" fill="none" stroke-width="4" stroke-linejoin="round"/><circle cx="6" cy="-10" r="3"/></g>
<g id="q"><circle r="19" fill="none" stroke-width="4"/><path d="M-6 -6 a6 6 0 1 1 8 6 c-2 1 -2 3 -2 6" fill="none" stroke-width="4" stroke-linecap="round"/><circle cx="0" cy="12" r="2.5"/></g>
</defs>
<g font-size="17" fill="#13235a">
<text x="60" y="150" font-weight="700">Garis tipis</text><text x="60" y="174" fill="#3b4a7a" font-size="15">ikon garis di latar terang</text>
<g transform="translate(360,160)" stroke="#13235a" fill="#13235a">
<circle r="44" fill="#ffffff" stroke="#c9d4f5" stroke-width="3"/><use href="#bag"/>
<g transform="translate(130,0)"><circle r="44" fill="#ffffff" stroke="#c9d4f5" stroke-width="3"/><use href="#star"/></g>
<g transform="translate(260,0)"><circle r="44" fill="#ffffff" stroke="#c9d4f5" stroke-width="3"/><use href="#chat"/></g>
<g transform="translate(390,0)"><circle r="44" fill="#ffffff" stroke="#c9d4f5" stroke-width="3"/><use href="#tag"/></g>
<g transform="translate(520,0)"><circle r="44" fill="#ffffff" stroke="#c9d4f5" stroke-width="3"/><use href="#q"/></g>
</g>
<text x="60" y="290" font-weight="700">Isi warna</text><text x="60" y="314" fill="#3b4a7a" font-size="15">ikon putih di latar warna merek</text>
<g transform="translate(360,300)" stroke="#ffffff" fill="#ffffff">
<circle r="44" fill="#2457d6" stroke="none"/><use href="#bag"/>
<g transform="translate(130,0)"><circle r="44" fill="#2457d6" stroke="none"/><use href="#star"/></g>
<g transform="translate(260,0)"><circle r="44" fill="#2457d6" stroke="none"/><use href="#chat"/></g>
<g transform="translate(390,0)"><circle r="44" fill="#2457d6" stroke="none"/><use href="#tag"/></g>
<g transform="translate(520,0)"><circle r="44" fill="#2457d6" stroke="none"/><use href="#q"/></g>
</g>
<text x="60" y="430" font-weight="700">Warna per kategori</text><text x="60" y="454" fill="#3b4a7a" font-size="15">satu warna untuk tiap topik</text>
<g transform="translate(360,440)" stroke="#ffffff" fill="#ffffff">
<circle r="44" fill="#13235a" stroke="none"/><use href="#bag"/>
<g transform="translate(130,0)"><circle r="44" fill="#1f8a7a" stroke="none"/><use href="#star"/></g>
<g transform="translate(260,0)"><circle r="44" fill="#6a4fd1" stroke="none"/><use href="#chat"/></g>
<g transform="translate(390,0)"><circle r="44" fill="#c2581e" stroke="none"/><use href="#tag"/></g>
<g transform="translate(520,0)"><circle r="44" fill="#2457d6" stroke="none"/><use href="#q"/></g>
</g>
<g font-size="15" fill="#3b4a7a" text-anchor="middle"><text x="360" y="232">Katalog</text><text x="490" y="232">Testimoni</text><text x="620" y="232">Cara order</text><text x="750" y="232">Promo</text><text x="880" y="232">FAQ</text></g>
</g>
<rect x="960" y="130" width="190" height="350" rx="14" fill="#fff" stroke="#c9d4f5" stroke-width="2"/>
<g font-size="15" fill="#13235a"><text x="978" y="164" font-weight="700">Aturan set</text><text x="978" y="196">Satu gaya untuk</text><text x="978" y="218">semua cover</text><text x="978" y="256">Ikon sederhana,</text><text x="978" y="278">terbaca kecil</text><text x="978" y="316">Nama highlight</text><text x="978" y="338">ditulis di aplikasi,</text><text x="978" y="360">bukan di gambar</text><text x="978" y="398">Warna sesuai</text><text x="978" y="420">identitas merek</text></g>
