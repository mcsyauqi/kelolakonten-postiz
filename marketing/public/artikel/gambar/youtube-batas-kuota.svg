<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="486" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Empat angka yang menentukan antrean upload YouTube</text>
<rect x="60" y="100" width="526" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="100" width="10" height="145" rx="5" fill="#2457d6"/>
<text font-size="20" font-weight="700" fill="#2457d6"><tspan x="88" y="140">256 GB</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="179">Ukuran file maksimal untuk videos.insert. Tipe media</tspan><tspan x="88" y="202">video/* atau application/octet-stream.</tspan></text>
<rect x="614" y="100" width="526" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="614" y="100" width="10" height="145" rx="5" fill="#c2581e"/>
<text font-size="20" font-weight="700" fill="#c2581e"><tspan x="642" y="140">100 panggilan per hari</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="642" y="179">Jatah default videos.insert per project. Antrean harus</tspan><tspan x="642" y="202">berhenti rapi saat jatah habis.</tspan></text>
<rect x="60" y="273" width="526" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="273" width="10" height="145" rx="5" fill="#1f8a7a"/>
<text font-size="20" font-weight="700" fill="#1f8a7a"><tspan x="88" y="313">10.000 unit per hari</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="352">Jatah default untuk endpoint lain, termasuk pengecekan</tspan><tspan x="88" y="375">status lewat videos.list.</tspan></text>
<rect x="614" y="273" width="526" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="614" y="273" width="10" height="145" rx="5" fill="#6a4fd1"/>
<text font-size="20" font-weight="700" fill="#6a4fd1"><tspan x="642" y="313">Publik bila kosong</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="642" y="352">privacyStatus bernilai publik bila tidak diisi. Selalu</tspan><tspan x="642" y="375">kirim status secara eksplisit.</tspan></text>
<text x="60" y="462" font-size="17" fill="#4a5578">Sumber: dokumentasi YouTube Data API, diakses 10 Oktober 2026. Nilai default dapat berubah.</text>
</svg>
