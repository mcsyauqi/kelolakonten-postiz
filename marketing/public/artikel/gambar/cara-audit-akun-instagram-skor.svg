<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">Pembagian 20 poin checklist audit Instagram</title>
<desc id="d">Checklist 20 poin: profil 5, kesehatan akun 3, konten 7, insight 5. Skor 17 sampai 20 sehat, 11 sampai 16 perlu perbaikan, 0 sampai 10 benahi dasar dulu</desc>
<rect width="1200" height="400" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Checklist 20 poin dan cara membaca skornya</text><text x="40" y="82" font-size="17" fill="#4a5680">Satu poin untuk setiap butir yang sudah beres</text>
<text x="40" y="144" font-size="17" fill="#13235a" font-weight="600">Profil</text><rect x="230" y="124" width="300" height="28" rx="6" fill="#2457d6"/><text x="540" y="144" font-size="16" fill="#4a5680">5 poin</text><text x="40" y="196" font-size="17" fill="#13235a" font-weight="600">Kesehatan akun</text><rect x="230" y="176" width="180" height="28" rx="6" fill="#1f8a7a"/><text x="420" y="196" font-size="16" fill="#4a5680">3 poin</text><text x="40" y="248" font-size="17" fill="#13235a" font-weight="600">Konten</text><rect x="230" y="228" width="420" height="28" rx="6" fill="#6a4fd1"/><text x="660" y="248" font-size="16" fill="#4a5680">7 poin</text><text x="40" y="300" font-size="17" fill="#13235a" font-weight="600">Insight</text><rect x="230" y="280" width="300" height="28" rx="6" fill="#c2581e"/><text x="540" y="300" font-size="16" fill="#4a5680">5 poin</text>
<text x="760" y="112" font-size="17" fill="#13235a" font-weight="700">Arti skor total</text>
<rect x="760" y="130" width="400" height="50" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="760" y="130" width="10" height="50" rx="4" fill="#1f8a7a"/><text x="786" y="161" font-size="17" fill="#1f8a7a" font-weight="700">17 sampai 20</text><text x="925" y="161" font-size="16" fill="#13235a">Sehat, rawat rutin</text><rect x="760" y="192" width="400" height="50" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="760" y="192" width="10" height="50" rx="4" fill="#c2581e"/><text x="786" y="223" font-size="17" fill="#c2581e" font-weight="700">11 sampai 16</text><text x="925" y="223" font-size="16" fill="#13235a">Perlu perbaikan terarah</text><rect x="760" y="254" width="400" height="50" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="760" y="254" width="10" height="50" rx="4" fill="#b3261e"/><text x="786" y="285" font-size="17" fill="#b3261e" font-weight="700">0 sampai 10</text><text x="925" y="285" font-size="16" fill="#13235a">Benahi dasar dulu</text>
<text x="40" y="370" font-size="15" fill="#4a5680">Rentang skor adalah patokan internal Kelola Konten untuk memilih prioritas, bukan penilaian resmi Instagram.</text>
