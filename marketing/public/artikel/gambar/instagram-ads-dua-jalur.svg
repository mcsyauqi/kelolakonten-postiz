<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d"><title id="t">Dua jalur membuat iklan Instagram</title><desc id="d">Kiri: Promosikan postingan dari aplikasi Instagram dengan tiga pilihan tujuan (kunjungan profil, kunjungan situs web, pesan), audiens, anggaran per hari, dan durasi. Kanan: Pengelola Iklan Meta dengan enam tujuan (Awareness, Traffic, Interaksi, Prospek, Promosi aplikasi, Penjualan), pilihan penempatan, dan strategi tawaran.</desc><rect width="1200" height="500" fill="#f4f7ff"/><rect x="70" y="70" width="190" height="360" rx="26" fill="#fff" stroke="#c2581e" stroke-width="5"/><rect x="137" y="80" width="56" height="10" rx="5" fill="#c2581e"/><rect x="92" y="120" width="146" height="146" rx="10" fill="#fde6d9"/><circle cx="165" cy="193" r="38" fill="#c2581e" opacity=".85"/><rect x="92" y="282" width="146" height="34" rx="10" fill="#c2581e"/><text x="165" y="305" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">Promosikan</text><text x="165" y="470" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#13235a" font-weight="800" text-anchor="middle">Dari aplikasi Instagram</text><rect x="320" y="70" width="300" height="360" rx="14" fill="#fff" stroke="#c2581e" stroke-width="3"/><text x="345" y="110" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#c2581e" font-weight="800" text-anchor="start">Promosikan postingan</text><text x="345" y="152" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="700" text-anchor="start">Pilih postingan atau cerita</text><text x="345" y="190" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="700" text-anchor="start">Tujuan: kunjungan profil,</text><text x="345" y="228" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="600" text-anchor="start">kunjungan situs web, pesan</text><text x="345" y="266" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="700" text-anchor="start">Audiens</text><text x="345" y="304" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="700" text-anchor="start">Anggaran per hari</text><text x="345" y="342" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="700" text-anchor="start">Durasi</text><text x="345" y="380" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="700" text-anchor="start">Ditinjau, lalu tayang</text><rect x="660" y="70" width="470" height="360" rx="14" fill="#fff" stroke="#2457d6" stroke-width="3"/><text x="685" y="110" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#2457d6" font-weight="800" text-anchor="start">Pengelola Iklan Meta</text><rect x="685" y="130" width="200" height="40" rx="20" fill="#e8eefc"/><text x="785" y="156" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#2457d6" font-weight="700" text-anchor="middle">Awareness</text><rect x="900" y="130" width="200" height="40" rx="20" fill="#e8eefc"/><text x="1000" y="156" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#2457d6" font-weight="700" text-anchor="middle">Traffic</text><rect x="685" y="182" width="200" height="40" rx="20" fill="#e8eefc"/><text x="785" y="208" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#2457d6" font-weight="700" text-anchor="middle">Interaksi</text><rect x="900" y="182" width="200" height="40" rx="20" fill="#e8eefc"/><text x="1000" y="208" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#2457d6" font-weight="700" text-anchor="middle">Prospek</text><rect x="685" y="234" width="200" height="40" rx="20" fill="#e8eefc"/><text x="785" y="260" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#2457d6" font-weight="700" text-anchor="middle">Promosi aplikasi</text><rect x="900" y="234" width="200" height="40" rx="20" fill="#e8eefc"/><text x="1000" y="260" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#2457d6" font-weight="700" text-anchor="middle">Penjualan</text><text x="685" y="315" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">Penempatan: otomatis (Advantage+) atau pilih sendiri</text><text x="685" y="351" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">Strategi tawaran dan jadwal per set iklan</text><text x="685" y="387" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">Satu iklan bisa tayang di Facebook dan Instagram</text><text x="895" y="470" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#13235a" font-weight="800" text-anchor="middle">Dari komputer, untuk kampanye lebih lengkap</text></svg>
