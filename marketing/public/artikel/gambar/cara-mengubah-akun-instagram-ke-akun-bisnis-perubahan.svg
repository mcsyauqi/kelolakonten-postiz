<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d"><title id="t">Yang berubah saat beralih jenis akun Instagram</title><desc id="d">Akun pribadi yang privat menjadi publik saat beralih ke akun profesional dan permintaan mengikuti yang menunggu diterima otomatis; sebaliknya, kembali ke akun pribadi menghilangkan akses iklan dan memutus Halaman Facebook yang terhubung</desc><rect width="1200" height="500" fill="#f4f7ff"/><rect x="40" y="150" width="250" height="200" rx="18" fill="#fff" stroke="#13235a" stroke-width="3"/><rect x="153" y="198" width="24" height="20" rx="4" fill="#4a5680"/><path d="M158 198v-6a7 7 0 0 1 14 0v6" stroke="#4a5680" stroke-width="3" fill="none"/><text x="165" y="262" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#13235a" font-weight="800" text-anchor="middle">Akun pribadi</text><text x="165" y="290" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="middle">disetel privat</text><path d="M290 220 C 370 220, 380 110, 470 110" stroke="#1f8a7a" stroke-width="4" fill="none"/><path d="M458 101L472 110L458 119" stroke="#1f8a7a" stroke-width="4" fill="none"/><text x="380" y="90" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#1f8a7a" font-weight="700" text-anchor="middle">Beralih ke profesional</text><rect x="480" y="40" width="660" height="160" rx="18" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><circle cx="520" cy="86" r="13" fill="none" stroke="#1f8a7a" stroke-width="3"/><path d="M507 86h26M520 73c-7 8-7 18 0 26M520 73c7 8 7 18 0 26" stroke="#1f8a7a" stroke-width="2" fill="none"/><text x="555" y="92" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#13235a" font-weight="800" text-anchor="start">Profil menjadi publik</text><rect x="520" y="120" width="34" height="34" rx="17" fill="#6a4fd1" opacity=".7"/><rect x="560" y="120" width="34" height="34" rx="17" fill="#2457d6" opacity=".7"/><rect x="600" y="120" width="34" height="34" rx="17" fill="#c2581e" opacity=".7"/><circle cx="650" cy="137" r="13" fill="#1f8a7a"/><path d="M644 137l4 5 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="675" y="145" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="600" text-anchor="start">Permintaan mengikuti yang menunggu diterima otomatis</text><path d="M290 280 C 370 280, 380 390, 470 390" stroke="#c2581e" stroke-width="4" fill="none" stroke-dasharray="10 7"/><path d="M458 381L472 390L458 399" stroke="#c2581e" stroke-width="4" fill="none"/><text x="380" y="430" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#c2581e" font-weight="700" text-anchor="middle">Nanti kembali ke pribadi</text><rect x="480" y="300" width="660" height="160" rx="18" fill="#fff" stroke="#c2581e" stroke-width="3"/><circle cx="525" cy="352" r="13" fill="#c2581e"/><path d="M520 347l10 10M530 347l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="552" y="359" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="start">Akses iklan hilang, sebagian fitur bisa ikut hilang</text><circle cx="525" cy="410" r="13" fill="#c2581e"/><path d="M520 405l10 10M530 405l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="552" y="417" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="start">Halaman Facebook yang terhubung diputus</text><text x="40" y="488" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="400" text-anchor="start">Sumber: Pusat Bantuan Instagram, artikel menyiapkan akun profesional, dicek November 2026.</text></svg>
