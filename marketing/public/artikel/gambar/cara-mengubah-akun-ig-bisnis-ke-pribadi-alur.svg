<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="520" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Alur menu di aplikasi Instagram (Android dan iPhone)</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Nama menu sesuai Instagram Help Center versi bahasa Inggris</text>
<g font-size="17" fill="#13235a">
<rect x="60" y="140" width="330" height="120" rx="16" fill="#fff" stroke="#2457d6" stroke-width="3"/>
<circle cx="100" cy="180" r="22" fill="#2457d6"/><text x="100" y="187" text-anchor="middle" fill="#fff" font-weight="700" font-size="20">1</text>
<text x="136" y="176" font-weight="700">Profile</text><text x="136" y="202">Buka profil (ikon orang</text><text x="136" y="226">atau foto profil)</text>
<rect x="435" y="140" width="330" height="120" rx="16" fill="#fff" stroke="#2457d6" stroke-width="3"/>
<circle cx="475" cy="180" r="22" fill="#2457d6"/><text x="475" y="187" text-anchor="middle" fill="#fff" font-weight="700" font-size="20">2</text>
<text x="511" y="176" font-weight="700">Menu</text><text x="511" y="202">Garis tiga di kanan atas,</text><text x="511" y="226">kadang lanjut ke Settings</text>
<rect x="810" y="140" width="330" height="120" rx="16" fill="#fff" stroke="#2457d6" stroke-width="3"/>
<circle cx="850" cy="180" r="22" fill="#2457d6"/><text x="850" y="187" text-anchor="middle" fill="#fff" font-weight="700" font-size="20">3</text>
<text x="886" y="176" font-weight="700">Account type and tools</text><text x="886" y="202">Bagian alat untuk</text><text x="886" y="226">akun profesional</text>
<rect x="60" y="310" width="330" height="120" rx="16" fill="#fff" stroke="#1f8a7a" stroke-width="3"/>
<circle cx="100" cy="350" r="22" fill="#1f8a7a"/><text x="100" y="357" text-anchor="middle" fill="#fff" font-weight="700" font-size="20">4</text>
<text x="136" y="346" font-weight="700">Account type</text><text x="136" y="372">Lihat jenis akun</text><text x="136" y="396">yang sedang aktif</text>
<rect x="435" y="310" width="330" height="120" rx="16" fill="#fff" stroke="#1f8a7a" stroke-width="3"/>
<circle cx="475" cy="350" r="22" fill="#1f8a7a"/><text x="475" y="357" text-anchor="middle" fill="#fff" font-weight="700" font-size="20">5</text>
<text x="511" y="346" font-weight="700">Switch account type</text><text x="511" y="372">Pilihan untuk mengganti</text><text x="511" y="396">jenis akun</text>
<rect x="810" y="310" width="330" height="120" rx="16" fill="#fff" stroke="#c2581e" stroke-width="3"/>
<circle cx="850" cy="350" r="22" fill="#c2581e"/><text x="850" y="357" text-anchor="middle" fill="#fff" font-weight="700" font-size="20">6</text>
<text x="886" y="346" font-weight="700">Switch to personal</text><text x="886" y="370" font-weight="700">account</text><text x="886" y="396">lalu konfirmasi Switch</text><text x="886" y="418">to personal</text>
</g>
<g stroke="#6a4fd1" stroke-width="3" fill="none"><path d="M392 200 h38"/><path d="M767 200 h38"/><path d="M975 262 v22 h-750 v20"/><path d="M392 370 h38"/><path d="M767 370 h38"/></g>
<g fill="#6a4fd1"><path d="M432 200 l-10 -6 v12 z"/><path d="M807 200 l-10 -6 v12 z"/><path d="M225 309 l-6 -10 h12 z"/><path d="M432 370 l-10 -6 v12 z"/><path d="M807 370 l-10 -6 v12 z"/></g>
<text x="60" y="482" font-size="16" fill="#3b4a7a">Jika aplikasi Anda berbahasa Indonesia, nama menu tampil dalam terjemahan. Cari padanannya di urutan yang sama.</text>
</svg>
