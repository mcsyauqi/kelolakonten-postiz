<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">Siklus mengukur klik link bio</title>
<desc id="d">Empat langkah berulang: pasang tautan ber-UTM, catat klik per minggu, bandingkan tautan, lalu rapikan urutan tautan.</desc>
<rect width="1200" height="400" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Siklus mengukur klik link bio</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep alur kerja bulanan</text>
<rect x="40" y="120" width="250" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="152" font-size="18" font-weight="700" fill="#1f8a7a">Pasang</text><text x="58" y="180" font-size="15" fill="#13235a">Tautan ber-UTM</text><text x="58" y="202" font-size="15" fill="#13235a">di bio</text><line x1="290" y1="175" x2="320" y2="175" stroke="#4a5680" stroke-width="2"/><polygon points="320,175 311.0,179.3 311.0,170.7" fill="#4a5680"/><rect x="324" y="120" width="250" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="342" y="152" font-size="18" font-weight="700" fill="#2457d6">Catat</text><text x="342" y="180" font-size="15" fill="#13235a">Klik dan sesi</text><text x="342" y="202" font-size="15" fill="#13235a">per minggu</text><line x1="574" y1="175" x2="604" y2="175" stroke="#4a5680" stroke-width="2"/><polygon points="604,175 595.0,179.3 595.0,170.7" fill="#4a5680"/><rect x="608" y="120" width="250" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="626" y="152" font-size="18" font-weight="700" fill="#6a4fd1">Bandingkan</text><text x="626" y="180" font-size="15" fill="#13235a">Tautan mana yang</text><text x="626" y="202" font-size="15" fill="#13235a">menghasilkan chat</text><line x1="858" y1="175" x2="888" y2="175" stroke="#4a5680" stroke-width="2"/><polygon points="888,175 879.0,179.3 879.0,170.7" fill="#4a5680"/><rect x="892" y="120" width="250" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="910" y="152" font-size="18" font-weight="700" fill="#c2581e">Rapikan</text><text x="910" y="180" font-size="15" fill="#13235a">Buang tautan sepi,</text><text x="910" y="202" font-size="15" fill="#13235a">naikkan yang ramai</text><path d="M 1035 232 C 1035 320, 165 320, 165 236" fill="none" stroke="#4a5680" stroke-width="2" stroke-dasharray="6 6"/><text x="600" y="332" font-size="15" fill="#4a5680" font-weight="400" text-anchor="middle">ulangi setiap bulan</text><text x="40" y="370" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Satu siklus terasa ringan kalau datanya dicatat di tabel yang sama setiap minggu.</text>
</g>
</svg>
