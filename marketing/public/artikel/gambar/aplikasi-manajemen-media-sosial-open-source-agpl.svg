<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d"><title id="t">Lisensi AGPL dalam empat situasi</title><desc id="d">Empat situasi memakai aplikasi berlisensi AGPL seperti Postiz. Memakai apa adanya untuk tim sendiri: boleh tanpa biaya lisensi, pemberitahuan lisensi dipertahankan. Membuka versi apa adanya untuk klien lewat web: boleh, pemberitahuan hak cipta dan lisensi dipertahankan. Mengubah kode lalu dipakai orang lewat jaringan: boleh, tetapi wajib menawarkan kode sumber versi ubahan kepada penggunanya sesuai Pasal 13. Menutup kode dan menjualnya sebagai produk tertutup: tidak boleh, turunan wajib tetap AGPL.</desc><rect width="1200" height="520" fill="#f4f7ff"/><text x="60" y="60" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="800" text-anchor="start">Situasi</text><text x="640" y="60" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="800" text-anchor="start">Boleh?</text><text x="830" y="60" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="800" text-anchor="start">Kewajiban</text><rect x="40" y="85" width="1120" height="90" rx="16" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><rect x="40" y="85" width="14" height="90" rx="7" fill="#1f8a7a"/><text x="72" y="125" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Memakai Postiz apa adanya untuk</text><text x="72" y="151" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">tim sendiri</text><circle cx="655" cy="130" r="15" fill="#1f8a7a"/><path d="M648 130l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="137" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#1f8a7a" font-weight="700" text-anchor="start">Boleh</text><text x="830" y="125" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">Tanpa biaya lisensi;</text><text x="830" y="149" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">pertahankan pemberitahuan lisensi</text><rect x="40" y="190" width="1120" height="90" rx="16" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><rect x="40" y="190" width="14" height="90" rx="7" fill="#1f8a7a"/><text x="72" y="230" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Membuka versi apa adanya untuk</text><text x="72" y="256" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">klien lewat web</text><circle cx="655" cy="235" r="15" fill="#1f8a7a"/><path d="M648 235l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="242" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#1f8a7a" font-weight="700" text-anchor="start">Boleh</text><text x="830" y="230" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">Pertahankan pemberitahuan</text><text x="830" y="254" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">hak cipta dan lisensi</text><rect x="40" y="295" width="1120" height="90" rx="16" fill="#fff" stroke="#6a4fd1" stroke-width="3"/><rect x="40" y="295" width="14" height="90" rx="7" fill="#6a4fd1"/><text x="72" y="335" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Mengubah kode lalu dipakai orang</text><text x="72" y="361" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">lewat jaringan</text><circle cx="655" cy="340" r="15" fill="#6a4fd1"/><path d="M648 340l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="347" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#6a4fd1" font-weight="700" text-anchor="start">Boleh</text><text x="830" y="335" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">Tawarkan kode versi ubahan</text><text x="830" y="359" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">ke penggunanya (Pasal 13)</text><rect x="40" y="400" width="1120" height="90" rx="16" fill="#fff" stroke="#c2581e" stroke-width="3"/><rect x="40" y="400" width="14" height="90" rx="7" fill="#c2581e"/><text x="72" y="440" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Menutup kode lalu menjualnya</text><text x="72" y="466" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">sebagai produk tertutup</text><circle cx="655" cy="445" r="15" fill="#c2581e"/><path d="M649 439l12 12M661 439l-12 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="680" y="452" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#c2581e" font-weight="700" text-anchor="start">Tidak boleh</text><text x="830" y="440" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">Turunan wajib tetap</text><text x="830" y="464" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">berlisensi AGPL</text></svg>
