<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="560" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Dua jalur siaran LIVE TikTok</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Sesuai Pusat Bantuan TikTok: aplikasi di HP, atau browser dengan LIVE Studio (Windows) atau OBS Studio</text>
<g font-size="18" fill="#13235a">
<rect x="60" y="130" width="520" height="380" rx="18" fill="#fff" stroke="#2457d6" stroke-width="3"/>
<rect x="60" y="130" width="520" height="64" rx="18" fill="#2457d6"/><rect x="60" y="170" width="520" height="24" fill="#2457d6"/>
<text x="88" y="172" font-size="22" font-weight="700" fill="#fff">Jalur HP (aplikasi TikTok)</text>
<text x="88" y="236" font-weight="700">Alur:</text>
<text x="88" y="264">Tambah postingan + lalu LIVE,</text>
<text x="88" y="290">isi judul, lalu Siarkan LIVE</text>
<text x="88" y="334" font-weight="700">Cocok untuk:</text>
<text x="88" y="362">Penjual sendirian, demo produk</text>
<text x="88" y="388">di tangan, LIVE dari lokasi</text>
<text x="88" y="432" font-weight="700">Perlu disiapkan:</text>
<text x="88" y="460">Tripod, cahaya depan, baterai,</text>
<text x="88" y="486">koneksi internet yang stabil</text>
<rect x="620" y="130" width="520" height="380" rx="18" fill="#fff" stroke="#1f8a7a" stroke-width="3"/>
<rect x="620" y="130" width="520" height="64" rx="18" fill="#1f8a7a"/><rect x="620" y="170" width="520" height="24" fill="#1f8a7a"/>
<text x="648" y="172" font-size="22" font-weight="700" fill="#fff">Jalur komputer (browser)</text>
<text x="648" y="236" font-weight="700">Alat wajib:</text>
<text x="648" y="264">LIVE Studio (Windows) atau</text>
<text x="648" y="290">OBS Studio (Linux, macOS, Windows)</text>
<text x="648" y="334" font-weight="700">Cocok untuk:</text>
<text x="648" y="362">Tutorial layar, banyak kamera,</text>
<text x="648" y="388">tampilan katalog atau slide</text>
<text x="648" y="432" font-weight="700">Catatan:</text>
<text x="648" y="460">Moderator tidak perlu LIVE Studio</text>
<text x="648" y="486">atau OBS, cukup lewat browser</text>
</g>
</svg>
