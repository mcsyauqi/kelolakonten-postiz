<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d">
<title id="t">Empat bagian balasan komentar negatif</title>
<desc id="d">Empat kotak berurutan: sapa dan akui, minta maaf, langkah nyata, pindah kanal, lalu satu contoh balasan lengkap.</desc>
<rect width="1200" height="450" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Empat bagian balasan komentar negatif</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep susunan balasan yang tenang dan bisa ditindaklanjuti</text>
<rect x="40" y="120" width="260" height="120" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="152" font-size="18" font-weight="700" fill="#2457d6">1. Sapa dan akui</text><text x="58" y="180" font-size="15" fill="#13235a">Sebut nama, ulang</text><text x="58" y="202" font-size="15" fill="#13235a">masalahnya singkat</text><line x1="300" y1="180" x2="322" y2="180" stroke="#4a5680" stroke-width="2"/><polygon points="322,180 313.0,184.3 313.0,175.7" fill="#4a5680"/><rect x="324" y="120" width="260" height="120" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="342" y="152" font-size="18" font-weight="700" fill="#6a4fd1">2. Minta maaf</text><text x="342" y="180" font-size="15" fill="#13235a">Untuk pengalamannya,</text><text x="342" y="202" font-size="15" fill="#13235a">tanpa membela diri</text><line x1="584" y1="180" x2="606" y2="180" stroke="#4a5680" stroke-width="2"/><polygon points="606,180 597.0,184.3 597.0,175.7" fill="#4a5680"/><rect x="608" y="120" width="260" height="120" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="626" y="152" font-size="18" font-weight="700" fill="#1f8a7a">3. Langkah nyata</text><text x="626" y="180" font-size="15" fill="#13235a">Apa yang Anda lakukan</text><text x="626" y="202" font-size="15" fill="#13235a">dan kapan</text><line x1="868" y1="180" x2="890" y2="180" stroke="#4a5680" stroke-width="2"/><polygon points="890,180 881.0,184.3 881.0,175.7" fill="#4a5680"/><rect x="892" y="120" width="260" height="120" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="910" y="152" font-size="18" font-weight="700" fill="#c2581e">4. Pindah kanal</text><text x="910" y="180" font-size="15" fill="#13235a">Ajak ke DM atau WA</text><text x="910" y="202" font-size="15" fill="#13235a">untuk data pribadi</text><rect x="40" y="270" width="1120" height="120" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="60" y="305" font-size="16" fill="#13235a" font-weight="400" text-anchor="start">Contoh: "Halo Kak Rina, maaf pesanannya belum sampai padahal sudah lewat 4 hari. Kami cek</text><text x="60" y="333" font-size="16" fill="#13235a" font-weight="400" text-anchor="start">nomor resinya ke kurir hari ini dan kabari sebelum jam 5 sore. Boleh kirim nomor pesanan lewat</text><text x="60" y="361" font-size="16" fill="#13235a" font-weight="400" text-anchor="start">DM supaya datanya tidak tampil di sini? Terima kasih sudah mengabari kami."</text><text x="40" y="425" font-size="15" fill="#4a5680" font-weight="400" text-anchor="start">Nama pelanggan dan angka di atas hanya contoh.</text>
</g>
</svg>
