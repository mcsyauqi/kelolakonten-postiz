<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Figtree,Segoe UI,Arial,sans-serif">
<rect width="1200" height="600" fill="#f4f7ff"/>
<text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#13235a">Siklus evaluasi pilar (bulanan)</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2457d6"/></marker></defs>
<g stroke="#2457d6" stroke-width="4" fill="none" marker-end="url(#a)">
<path d="M455 160 H735"/><path d="M930 225 V365"/><path d="M735 440 H455"/><path d="M265 365 V225"/></g>
<g text-anchor="middle">
<rect x="90" y="100" width="360" height="120" rx="18" fill="#2457d6"/><text x="270" y="150" font-size="24" font-weight="700" fill="#fff">1. Kumpulkan data</text><text x="270" y="185" font-size="18" fill="#dbe6ff">per pilar, periode sama</text>
<rect x="750" y="100" width="360" height="120" rx="18" fill="#13235a"/><text x="930" y="150" font-size="24" font-weight="700" fill="#fff">2. Bandingkan</text><text x="930" y="185" font-size="18" fill="#dbe6ff">dengan tujuan tiap pilar</text>
<rect x="750" y="375" width="360" height="140" rx="18" fill="#fff" stroke="#2457d6" stroke-width="3"/><text x="930" y="418" font-size="24" font-weight="700" fill="#13235a">3. Putuskan</text><text x="930" y="450" font-size="18" fill="#4a5578">pertahankan, ganti format,</text><text x="930" y="476" font-size="18" fill="#4a5578">atau hentikan pilar</text>
<rect x="90" y="375" width="360" height="140" rx="18" fill="#1f8a7a"/><text x="270" y="430" font-size="24" font-weight="700" fill="#fff">4. Perbarui kalender</text><text x="270" y="464" font-size="18" fill="#e0f5f1">slot dan warna pilar</text>
</g>
<text x="600" y="300" text-anchor="middle" font-size="18" fill="#4a5578">Grafik kosong di minggu pertama</text>
<text x="600" y="326" text-anchor="middle" font-size="18" fill="#4a5578">bukan bukti pilar gagal.</text>
</svg>
