<text font-size="16" fill="#eef2ff" text-anchor="middle"><tspan x="692.5" y="256">dicek terhadap</tspan><tspan x="692.5" y="277">brief</tspan></text>
<line x1="773" y1="247" x2="795" y2="247" stroke="#13235a" stroke-width="3" marker-end="url(#a)"/>
