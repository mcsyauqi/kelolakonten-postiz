<text font-size="16" fill="#eef2ff" text-anchor="middle"><tspan x="877.5" y="256">tanggal dan jam</tspan><tspan x="877.5" y="277">WIB</tspan></text>
<line x1="958" y1="247" x2="980" y2="247" stroke="#13235a" stroke-width="3" marker-end="url(#a)"/>
