<rect x="60" y="180" width="155" height="134" rx="18" fill="#7a849e"/>
<text font-size="20" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="137.5" y="220">Ide</tspan></text>
<text font-size="16" fill="#eef2ff" text-anchor="middle"><tspan x="137.5" y="256">satu kalimat,</tspan><tspan x="137.5" y="277">pilar dipilih</tspan></text>
