<text font-size="20" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="322.5" y="220">Brief</tspan></text>
<text font-size="16" fill="#eef2ff" text-anchor="middle"><tspan x="322.5" y="256">tujuan, CTA,</tspan><tspan x="322.5" y="277">tenggat</tspan></text>
<line x1="403" y1="247" x2="425" y2="247" stroke="#13235a" stroke-width="3" marker-end="url(#a)"/>
