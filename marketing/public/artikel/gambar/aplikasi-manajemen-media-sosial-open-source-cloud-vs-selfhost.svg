<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d"><title id="t">Cloud atau self-host: siapa mengurus apa</title><desc id="d">Perbandingan dua cara memakai aplikasi manajemen media sosial open source. Versi cloud: server, pembaruan, cadangan, dan aplikasi developer platform diurus penyedia, tetapi biaya per bulan naik per kanal dan data ada di server penyedia. Self-host: server dan aplikasi developer tiap platform Anda urus sendiri, biaya berupa sewa VPS yang tidak dihitung per kanal, dan data ada di server Anda.</desc><rect width="1200" height="540" fill="#f4f7ff"/><rect x="50" y="40" width="520" height="430" rx="14" fill="#fff" stroke="#2457d6" stroke-width="3"/><path d="M84 138a30 30 0 0 1 8-58a42 42 0 0 1 80-6a32 32 0 0 1 36 34a26 26 0 0 1-6 30z" fill="#fff" stroke="#2457d6" stroke-width="4"/><text x="240" y="100" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#2457d6" font-weight="800" text-anchor="start">Versi cloud</text><text x="240" y="130" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">bayar langganan, langsung pakai</text><circle cx="90" cy="185" r="15" fill="#1f8a7a"/><path d="M83 185l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="183" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="start">Server, pembaruan, cadangan</text><text x="120" y="207" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">diurus penyedia</text><circle cx="90" cy="255" r="15" fill="#1f8a7a"/><path d="M83 255l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="253" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="start">Aplikasi developer Meta, TikTok, X</text><text x="120" y="277" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">diurus penyedia</text><circle cx="90" cy="325" r="15" fill="#6a4fd1"/><path d="M84 319l12 12M96 319l-12 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="120" y="323" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="start">Biaya</text><text x="120" y="347" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">per bulan, naik sesuai jumlah kanal</text><circle cx="90" cy="395" r="15" fill="#6a4fd1"/><path d="M84 389l12 12M96 389l-12 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="120" y="393" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="start">Data konten</text><text x="120" y="417" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">di server penyedia</text><rect x="630" y="40" width="520" height="430" rx="14" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><rect x="660" y="58" width="120" height="28" rx="6" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><circle cx="676" cy="72" r="5" fill="#1f8a7a"/><rect x="692" y="69" width="60" height="6" rx="3" fill="#c9d4f2"/><rect x="660" y="92" width="120" height="28" rx="6" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><circle cx="676" cy="106" r="5" fill="#1f8a7a"/><rect x="692" y="103" width="60" height="6" rx="3" fill="#c9d4f2"/><rect x="660" y="126" width="120" height="28" rx="6" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><circle cx="676" cy="140" r="5" fill="#1f8a7a"/><rect x="692" y="137" width="60" height="6" rx="3" fill="#c9d4f2"/><text x="810" y="100" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#1f8a7a" font-weight="800" text-anchor="start">Self-host</text><text x="810" y="130" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">kode gratis, server milik sendiri</text><circle cx="670" cy="185" r="15" fill="#c2581e"/><path d="M664 179l12 12M676 179l-12 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="700" y="183" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="start">Server, pembaruan, cadangan</text><text x="700" y="207" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">Anda yang urus</text><circle cx="670" cy="255" r="15" fill="#c2581e"/><path d="M664 249l12 12M676 249l-12 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="700" y="253" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="start">Aplikasi developer tiap platform</text><text x="700" y="277" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">Anda daftarkan sendiri</text><circle cx="670" cy="325" r="15" fill="#1f8a7a"/><path d="M663 325l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="323" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="start">Biaya</text><text x="700" y="347" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">sewa VPS, tidak per kanal</text><circle cx="670" cy="395" r="15" fill="#1f8a7a"/><path d="M663 395l5 5 9-10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="393" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="start">Data konten</text><text x="700" y="417" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">di server Anda</text><text x="600" y="510" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="700" text-anchor="middle">Lisensinya sama-sama open source; bedanya siapa yang memikul pekerjaan teknis.</text></svg>
