<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d"><title id="t">Cakupan Meta Business Suite</title><desc id="d">Satu portofolio bisnis di tengah yang memuat Halaman Facebook, akun Instagram, dan akun iklan; di sekelilingnya kalender konten, kotak masuk, insight, dan iklan. TikTok dan YouTube berada di luar lingkaran karena bukan teknologi Meta</desc><rect width="1200" height="520" fill="#f4f7ff"/><circle cx="560" cy="250" r="215" fill="#fff" stroke="#c9d4f2" stroke-width="3"/><path d="M560 250L560 70" stroke="#1f8a7a" stroke-width="3" stroke-dasharray="6 6" opacity=".5"/><path d="M560 250L790 250" stroke="#2457d6" stroke-width="3" stroke-dasharray="6 6" opacity=".5"/><path d="M560 250L560 430" stroke="#6a4fd1" stroke-width="3" stroke-dasharray="6 6" opacity=".5"/><path d="M560 250L330 250" stroke="#c2581e" stroke-width="3" stroke-dasharray="6 6" opacity=".5"/><rect x="455" y="190" width="210" height="120" rx="16" fill="#13235a"/><text x="560" y="230" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">Portofolio bisnis</text><rect x="475" y="248" width="52" height="40" rx="8" fill="#2457d6"/><rect x="535" y="248" width="52" height="40" rx="8" fill="#6a4fd1"/><rect x="595" y="248" width="52" height="40" rx="8" fill="#c2581e"/><text x="501" y="275" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Page</text><text x="561" y="275" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">IG</text><text x="621" y="275" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Iklan</text><rect x="465" y="42" width="190" height="56" rx="28" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><text x="560" y="77" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#1f8a7a" font-weight="800" text-anchor="middle">Kalender konten</text><rect x="695" y="222" width="190" height="56" rx="28" fill="#fff" stroke="#2457d6" stroke-width="3"/><text x="790" y="257" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#2457d6" font-weight="800" text-anchor="middle">Insight</text><rect x="465" y="402" width="190" height="56" rx="28" fill="#fff" stroke="#6a4fd1" stroke-width="3"/><text x="560" y="437" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#6a4fd1" font-weight="800" text-anchor="middle">Kotak masuk</text><rect x="235" y="222" width="190" height="56" rx="28" fill="#fff" stroke="#c2581e" stroke-width="3"/><text x="330" y="257" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#c2581e" font-weight="800" text-anchor="middle">Iklan</text><rect x="900" y="60" width="250" height="150" rx="16" fill="#fff" stroke="#c2581e" stroke-width="3" stroke-dasharray="9 7"/><text x="1025" y="100" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#c2581e" font-weight="800" text-anchor="middle">Di luar Meta</text><text x="1025" y="140" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">TikTok</text><text x="1025" y="175" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">YouTube</text><text x="40" y="505" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="400" text-anchor="start">Disusun dari Pusat Bantuan Bisnis Meta (Cara kerja Meta Business Suite), dicek November 2026.</text></svg>
