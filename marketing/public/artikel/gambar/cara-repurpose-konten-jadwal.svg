<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 346" width="1200" height="346" role="img" aria-labelledby="t d">
<title id="t">Contoh jadwal turunan selama satu minggu</title>
<desc id="d">Jadwal satu minggu: Senin Reels, Rabu carousel, Jumat Stories polling, Minggu rekap komentar.</desc>
<rect width="1200" height="346" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Contoh jadwal turunan selama satu minggu</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Satu konten induk disebar supaya tidak terasa berulang</text>
<rect x="40" y="116" width="357" height="172" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="58" y="152" font-size="19" fill="#2457d6" font-weight="700">Senin dan Selasa</text><circle cx="64" cy="179" r="4" fill="#2457d6"/><text x="78" y="184" font-size="16" fill="#13235a">Senin: Reels konten induk</text><circle cx="64" cy="211" r="4" fill="#2457d6"/><text x="78" y="216" font-size="16" fill="#13235a">Selasa: versi TikTok dengan hook</text><text x="78" y="237.12" font-size="16" fill="#13235a">baru</text><rect x="421" y="116" width="357" height="172" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="439" y="152" font-size="19" fill="#2457d6" font-weight="700">Rabu dan Kamis</text><circle cx="445" cy="179" r="4" fill="#2457d6"/><text x="459" y="184" font-size="16" fill="#13235a">Rabu: carousel langkah demi langkah</text><circle cx="445" cy="211" r="4" fill="#2457d6"/><text x="459" y="216" font-size="16" fill="#13235a">Kamis: unggahan Facebook berisi</text><text x="459" y="237.12" font-size="16" fill="#13235a">cerita</text><rect x="802" y="116" width="357" height="172" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="820" y="152" font-size="19" fill="#2457d6" font-weight="700">Jumat sampai Minggu</text><circle cx="826" cy="179" r="4" fill="#2457d6"/><text x="840" y="184" font-size="16" fill="#13235a">Jumat: Stories polling</text><circle cx="826" cy="211" r="4" fill="#2457d6"/><text x="840" y="216" font-size="16" fill="#13235a">Sabtu: balasan komentar terbaik</text><circle cx="826" cy="243" r="4" fill="#2457d6"/><text x="840" y="248" font-size="16" fill="#13235a">Minggu: catat hasil per format</text><text x="40" y="326" font-size="16" fill="#4a5680">Hari boleh digeser mengikuti jam aktif pengikut Anda. Ini contoh saran, bukan aturan platform.</text>
