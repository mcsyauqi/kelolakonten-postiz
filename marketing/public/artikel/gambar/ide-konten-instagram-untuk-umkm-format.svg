<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="440" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Empat format Instagram, empat tugas berbeda</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Pilih format sesuai tugas ide, bukan sesuai kebiasaan</text>
<rect x="60" y="130" width="255" height="230" rx="16" fill="#13235a"/>
<text x="82" y="172" font-size="24" font-weight="700" fill="#fff">Reels</text>
<text x="82" y="204" font-size="17" font-weight="700" fill="#fff">Menjangkau orang baru</text>
<text x="82" y="240" font-size="15" fill="#fff">Sebagian besar Reels yang</text>
<text x="82" y="262" font-size="15" fill="#fff">ditonton orang berasal dari</text>
<text x="82" y="284" font-size="15" fill="#fff">akun yang belum diikuti</text>
<text x="82" y="306" font-size="15" fill="#fff">(About Instagram, 2023)</text>
<rect x="335" y="130" width="255" height="230" rx="16" fill="#2457d6"/>
<text x="357" y="172" font-size="24" font-weight="700" fill="#fff">Carousel</text>
<text x="357" y="204" font-size="17" font-weight="700" fill="#fff">Materi untuk disimpan</text>
<text x="357" y="240" font-size="15" fill="#fff">Panduan bertahap, daftar,</text>
<text x="357" y="262" font-size="15" fill="#fff">dan perbandingan yang</text>
<text x="357" y="284" font-size="15" fill="#fff">ingin dibuka lagi</text>
<rect x="610" y="130" width="255" height="230" rx="16" fill="#1f8a7a"/>
<text x="632" y="172" font-size="24" font-weight="700" fill="#fff">Foto</text>
<text x="632" y="204" font-size="17" font-weight="700" fill="#fff">Info cepat dan detail</text>
<text x="632" y="240" font-size="15" fill="#fff">Pengumuman, detail bahan,</text>
<text x="632" y="262" font-size="15" fill="#fff">dan suasana kerja dalam</text>
<text x="632" y="284" font-size="15" fill="#fff">satu gambar</text>
<rect x="885" y="130" width="255" height="230" rx="16" fill="#6a4fd1"/>
<text x="907" y="172" font-size="24" font-weight="700" fill="#fff">Stories</text>
<text x="907" y="204" font-size="17" font-weight="700" fill="#fff">Merawat pengikut</text>
<text x="907" y="240" font-size="15" fill="#fff">Hilang setelah 24 jam, bisa</text>
<text x="907" y="262" font-size="15" fill="#fff">disimpan di Sorotan, punya</text>
<text x="907" y="284" font-size="15" fill="#fff">stiker polling dan pertanyaan</text>
<text x="60" y="404" font-size="17" fill="#3b4a7a">Tugas carousel, foto, dan Stories adalah saran editorial Kelola Konten, bukan aturan Instagram.</text>
</svg>
