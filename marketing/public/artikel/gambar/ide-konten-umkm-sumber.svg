<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 322" width="1200" height="322" role="img" aria-labelledby="t d">
<title id="t">Enam sumber ide dalam tiga kelompok</title>
<desc id="d">Enam sumber ide: chat dan DM, komentar, ulasan marketplace dari pelanggan; proses kerja harian dari usaha; kalender musiman serta pencarian dan tren dari luar.</desc>
<rect width="1200" height="322" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
