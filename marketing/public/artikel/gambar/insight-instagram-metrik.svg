<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="620" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Empat metrik inti Insight Instagram</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Dua menghitung kejadian, dua menghitung akun unik</text>
<text x="330" y="150" font-size="20" font-weight="700" fill="#13235a" text-anchor="middle">Menghitung kejadian</text>
<text x="870" y="150" font-size="20" font-weight="700" fill="#13235a" text-anchor="middle">Menghitung akun unik</text>
<line x1="600" y1="130" x2="600" y2="540" stroke="#c9d3f0" stroke-width="2" stroke-dasharray="6 6"/>
<g>
<rect x="80" y="180" width="500" height="160" rx="18" fill="#2457d6"/>
<text x="110" y="226" font-size="26" font-weight="700" fill="#fff">Views (tayangan)</text>
<text x="110" y="262" font-size="17" fill="#eef2ff">berapa kali konten diputar atau ditampilkan</text>
<text x="110" y="290" font-size="17" fill="#eef2ff">satu orang melihat 3 kali = 3 views</text>
<rect x="80" y="370" width="500" height="160" rx="18" fill="#c2581e"/>
<text x="110" y="416" font-size="26" font-weight="700" fill="#fff">Interactions (interaksi)</text>
<text x="110" y="452" font-size="17" fill="#fff4ec">jumlah tindakan: suka, komentar,</text>
<text x="110" y="480" font-size="17" fill="#fff4ec">simpan, dan bagikan</text>
<rect x="620" y="180" width="500" height="160" rx="18" fill="#1f8a7a"/>
<text x="650" y="226" font-size="26" font-weight="700" fill="#fff">Viewers (penonton)</text>
<text x="650" y="262" font-size="17" fill="#e8fff8">akun unik yang melihat konten di layar</text>
<text x="650" y="290" font-size="17" fill="#e8fff8">minimal sekali, plus data demografinya</text>
<rect x="620" y="370" width="500" height="160" rx="18" fill="#6a4fd1"/>
<text x="650" y="416" font-size="26" font-weight="700" fill="#fff">Accounts engaged</text>
<text x="650" y="452" font-size="17" fill="#f1edff">akun unik yang berinteraksi, bisa dipilah</text>
<text x="650" y="480" font-size="17" fill="#f1edff">pengikut dan bukan pengikut</text>
</g>
<text x="60" y="584" font-size="17" fill="#13235a">Definisi mengikuti Pusat Bantuan Instagram. Metrik ini diestimasi, jadi bandingkan tren, bukan selisih kecil.</text>
</svg>
