<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 506" width="1200" height="506" role="img" aria-labelledby="t d">
<title id="t">Komponen biaya yang sering terlupa</title>
<desc id="d">Enam komponen biaya media sosial: iklan, kreator dan agensi, alat, gaji dan jam kerja, produksi konten, pelatihan</desc>
<rect width="1200" height="506" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Komponen biaya yang sering terlupa</text><text x="40" y="82" font-size="17" fill="#4a5680">Masukkan semua biaya sebulan, bukan hanya iklan</text>
<rect x="30" y="110" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="60" cy="142" r="14" fill="#2457d6"/><text x="60" y="148" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="84" y="148" font-size="18" fill="#13235a" font-weight="700">Iklan berbayar</text><text x="50" y="184" font-size="15" fill="#33405f">Saldo iklan Meta, TikTok,</text><text x="50" y="208" font-size="15" fill="#33405f">atau boost postingan</text>
<rect x="416" y="110" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="446" cy="142" r="14" fill="#1f8a7a"/><text x="446" y="148" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="470" y="148" font-size="18" fill="#13235a" font-weight="700">Kreator dan agensi</text><text x="436" y="184" font-size="15" fill="#33405f">Fee KOL, freelancer,</text><text x="436" y="208" font-size="15" fill="#33405f">atau agensi</text>
<rect x="802" y="110" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="832" cy="142" r="14" fill="#6a4fd1"/><text x="832" y="148" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="856" y="148" font-size="18" fill="#13235a" font-weight="700">Alat dan langganan</text><text x="822" y="184" font-size="15" fill="#33405f">Penjadwal, desain,</text><text x="822" y="208" font-size="15" fill="#33405f">edit video</text>
<rect x="30" y="278" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="60" cy="310" r="14" fill="#c2581e"/><text x="60" y="316" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="84" y="316" font-size="18" fill="#13235a" font-weight="700">Gaji dan jam kerja</text><text x="50" y="352" font-size="15" fill="#33405f">Jam admin dikali</text><text x="50" y="376" font-size="15" fill="#33405f">tarif per jam</text>
<rect x="416" y="278" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="446" cy="310" r="14" fill="#13235a"/><text x="446" y="316" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="470" y="316" font-size="18" fill="#13235a" font-weight="700">Produksi konten</text><text x="436" y="352" font-size="15" fill="#33405f">Foto, video, properti,</text><text x="436" y="376" font-size="15" fill="#33405f">desain</text>
<rect x="802" y="278" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="832" cy="310" r="14" fill="#2457d6"/><text x="832" y="316" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="856" y="316" font-size="18" fill="#13235a" font-weight="700">Pelatihan</text><text x="822" y="352" font-size="15" fill="#33405f">Kursus atau workshop</text><text x="822" y="376" font-size="15" fill="#33405f">untuk tim</text>
<text x="40" y="484" font-size="15" fill="#4a5680">Daftar biaya mengikuti Hootsuite. Dibuat oleh Kelola Konten.</text>
</g></svg>
