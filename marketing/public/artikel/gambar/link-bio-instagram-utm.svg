<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">Anatomi tautan bio yang diberi UTM</title>
<desc id="d">Satu contoh URL dipecah menjadi empat bagian: alamat tujuan, utm_source, utm_medium, dan utm_campaign, masing-masing dengan penjelasan.</desc>
<rect width="1200" height="440" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Anatomi tautan bio yang diberi UTM</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Parameter UTM membuat klik dari bio terbaca terpisah di Google Analytics</text>
<rect x="40" y="120" width="1120" height="70" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="60" y="163" font-size="19" fill="#13235a" font-weight="700" text-anchor="start">https://tokoanda.id/katalog?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=bio_promo_nov</text><rect x="60" y="250" width="240" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="78" y="282" font-size="18" font-weight="700" fill="#13235a">Alamat tujuan</text><text x="78" y="310" font-size="15" fill="#13235a">Halaman yang</text><text x="78" y="332" font-size="15" fill="#13235a">dibuka pengunjung</text><line x1="180" y1="192" x2="180" y2="246" stroke="#4a5680" stroke-width="2"/><polygon points="180,246 175.7,237.0 184.3,237.0" fill="#4a5680"/><rect x="340" y="250" width="240" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="358" y="282" font-size="18" font-weight="700" fill="#1f8a7a">utm_source</text><text x="358" y="310" font-size="15" fill="#13235a">Dari mana:</text><text x="358" y="332" font-size="15" fill="#13235a">instagram</text><line x1="460" y1="192" x2="460" y2="246" stroke="#4a5680" stroke-width="2"/><polygon points="460,246 455.7,237.0 464.3,237.0" fill="#4a5680"/><rect x="620" y="250" width="240" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="638" y="282" font-size="18" font-weight="700" fill="#2457d6">utm_medium</text><text x="638" y="310" font-size="15" fill="#13235a">Jenis media:</text><text x="638" y="332" font-size="15" fill="#13235a">social</text><line x1="740" y1="192" x2="740" y2="246" stroke="#4a5680" stroke-width="2"/><polygon points="740,246 735.7,237.0 744.3,237.0" fill="#4a5680"/><rect x="900" y="250" width="240" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="918" y="282" font-size="18" font-weight="700" fill="#c2581e">utm_campaign</text><text x="918" y="310" font-size="15" fill="#13235a">Nama kampanye:</text><text x="918" y="332" font-size="15" fill="#13235a">bio_promo_nov</text><line x1="1020" y1="192" x2="1020" y2="246" stroke="#4a5680" stroke-width="2"/><polygon points="1020,246 1015.7,237.0 1024.3,237.0" fill="#4a5680"/><text x="40" y="410" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Alamat toko dan nama kampanye di atas hanya contoh. Pakai huruf kecil dan garis bawah yang sama di setiap tautan.</text>
</g>
</svg>
