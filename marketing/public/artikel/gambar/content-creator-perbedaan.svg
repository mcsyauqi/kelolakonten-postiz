<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="480" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Content creator, influencer, dan social media specialist</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Perannya bisa beririsan, tetapi titik beratnya berbeda</text>
<g>
<rect x="60" y="130" width="340" height="310" rx="18" fill="#fff" stroke="#2457d6" stroke-width="3"/>
<rect x="60" y="130" width="340" height="62" rx="18" fill="#2457d6"/><rect x="60" y="170" width="340" height="22" fill="#2457d6"/>
<text x="230" y="170" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Content creator</text>
<g font-size="17" fill="#13235a"><text x="84" y="232">Inti kerja: membuat konten</text><text x="84" y="268">Ukuran: konten tayang rutin,</text><text x="84" y="292">ditonton, disimpan, dibagikan</text><text x="84" y="328">Bisa mulai tanpa audiens besar</text><text x="84" y="364">Contoh: pemilik kedai kopi yang</text><text x="84" y="388">rutin membuat video menyeduh</text></g>
</g>
<g>
<rect x="430" y="130" width="340" height="310" rx="18" fill="#fff" stroke="#6a4fd1" stroke-width="3"/>
<rect x="430" y="130" width="340" height="62" rx="18" fill="#6a4fd1"/><rect x="430" y="170" width="340" height="22" fill="#6a4fd1"/>
<text x="600" y="170" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Influencer</text>
<g font-size="17" fill="#13235a"><text x="454" y="232">Inti kerja: memengaruhi audiens</text><text x="454" y="268">Ukuran: kepercayaan pengikut</text><text x="454" y="292">dan seberapa jauh rekomendasi</text><text x="454" y="316">diikuti</text><text x="454" y="352">Butuh audiens yang setia</text><text x="454" y="388">Contoh: akun kuliner yang</text><text x="454" y="412">rekomendasinya dicari orang</text></g>
</g>
<g>
<rect x="800" y="130" width="340" height="310" rx="18" fill="#fff" stroke="#1f8a7a" stroke-width="3"/>
<rect x="800" y="130" width="340" height="62" rx="18" fill="#1f8a7a"/><rect x="800" y="170" width="340" height="22" fill="#1f8a7a"/>
<text x="970" y="170" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Social media specialist</text>
<g font-size="17" fill="#13235a"><text x="824" y="232">Inti kerja: mengelola akun merek</text><text x="824" y="268">Ukuran: target pemasaran</text><text x="824" y="292">perusahaan atau klien</text><text x="824" y="328">Biasanya karyawan atau</text><text x="824" y="352">pekerja lepas sebuah merek</text><text x="824" y="388">Contoh: admin media sosial</text><text x="824" y="412">brand skincare lokal</text></g>
</g>
</svg>
