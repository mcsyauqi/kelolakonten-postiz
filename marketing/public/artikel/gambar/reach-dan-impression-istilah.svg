<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="500" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Nama metriknya berbeda di tiap platform</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Kolom tengah menghitung akun atau penonton unik, kolom kanan menghitung berapa kali tampil</text>
<text x="330" y="146" font-size="18" font-weight="700" fill="#1f8a7a">Setara reach (unik)</text>
<text x="770" y="146" font-size="18" font-weight="700" fill="#c2581e">Setara impression (berulang)</text>
<g font-size="17">
<rect x="60" y="166" width="240" height="64" rx="12" fill="#2457d6"/><text x="80" y="205" fill="#fff" font-weight="700">Instagram Insights</text>
<rect x="320" y="166" width="420" height="64" rx="12" fill="#fff" stroke="#c9d3f2"/><text x="340" y="205" fill="#13235a">Viewers (akun unik yang melihat)</text>
<rect x="760" y="166" width="380" height="64" rx="12" fill="#fff" stroke="#c9d3f2"/><text x="780" y="205" fill="#13235a">Views (tayangan, bisa berulang)</text>
<rect x="60" y="246" width="240" height="64" rx="12" fill="#6a4fd1"/><text x="80" y="285" fill="#fff" font-weight="700">Iklan Meta</text>
<rect x="320" y="246" width="420" height="64" rx="12" fill="#fff" stroke="#c9d3f2"/><text x="340" y="285" fill="#13235a">Reach (akun yang melihat iklan)</text>
<rect x="760" y="246" width="380" height="64" rx="12" fill="#fff" stroke="#c9d3f2"/><text x="780" y="285" fill="#13235a">Impressions (iklan di layar)</text>
<rect x="60" y="326" width="240" height="64" rx="12" fill="#1f8a7a"/><text x="80" y="365" fill="#fff" font-weight="700">TikTok Analytics</text>
<rect x="320" y="326" width="420" height="64" rx="12" fill="#fff" stroke="#c9d3f2"/><text x="340" y="365" fill="#13235a">Unique viewers (penonton unik)</text>
<rect x="760" y="326" width="380" height="64" rx="12" fill="#fff" stroke="#c9d3f2"/><text x="780" y="365" fill="#13235a">Views (tayangan video)</text>
