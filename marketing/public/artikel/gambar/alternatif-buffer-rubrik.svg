<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">Rubrik memilih alternatif Buffer</title><desc id="d">Rubrik lima kriteria untuk memilih alternatif Buffer dengan bobot yang disarankan: platform klien didukung 30%, cara hitung harga 25%, kolaborasi dan approval 20%, analitik dan laporan 15%, data dan dukungan 10%. Setiap alat diberi skor 1 sampai 5 per kriteria, dikalikan bobot, lalu dijumlahkan; contoh skor satu alat: 4, 3, 5, 2, dan 3.</desc><rect width="1200" height="560" fill="#f4f7ff"/><rect x="40" y="50" width="1120" height="78" rx="14" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><circle cx="92" cy="89" r="28" fill="#2457d6"/><text x="92" y="97" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">30%</text><text x="140" y="84" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Platform klien didukung</text><text x="140" y="110" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">Instagram, TikTok, Facebook, YouTube, LinkedIn: cek satu per satu</text><rect x="920" y="75" width="34" height="28" rx="6" fill="#2457d6"/><rect x="964" y="75" width="34" height="28" rx="6" fill="#2457d6"/><rect x="1008" y="75" width="34" height="28" rx="6" fill="#2457d6"/><rect x="1052" y="75" width="34" height="28" rx="6" fill="#2457d6"/><rect x="1096" y="75" width="34" height="28" rx="6" fill="#e3e9fb"/><rect x="40" y="142" width="1120" height="78" rx="14" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><circle cx="92" cy="181" r="28" fill="#1f8a7a"/><text x="92" y="189" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">25%</text><text x="140" y="176" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Cara hitung harga</text><text x="140" y="202" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">Per kanal, per brand, atau per pengguna? Hitung di jumlah akun Anda</text><rect x="920" y="167" width="34" height="28" rx="6" fill="#1f8a7a"/><rect x="964" y="167" width="34" height="28" rx="6" fill="#1f8a7a"/><rect x="1008" y="167" width="34" height="28" rx="6" fill="#1f8a7a"/><rect x="1052" y="167" width="34" height="28" rx="6" fill="#e3e9fb"/><rect x="1096" y="167" width="34" height="28" rx="6" fill="#e3e9fb"/><rect x="40" y="234" width="1120" height="78" rx="14" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><circle cx="92" cy="273" r="28" fill="#6a4fd1"/><text x="92" y="281" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">20%</text><text x="140" y="268" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Kolaborasi dan approval</text><text x="140" y="294" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">Anggota tim, hak akses, persetujuan klien sebelum tayang</text><rect x="920" y="259" width="34" height="28" rx="6" fill="#6a4fd1"/><rect x="964" y="259" width="34" height="28" rx="6" fill="#6a4fd1"/><rect x="1008" y="259" width="34" height="28" rx="6" fill="#6a4fd1"/><rect x="1052" y="259" width="34" height="28" rx="6" fill="#6a4fd1"/><rect x="1096" y="259" width="34" height="28" rx="6" fill="#6a4fd1"/><rect x="40" y="326" width="1120" height="78" rx="14" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><circle cx="92" cy="365" r="28" fill="#c2581e"/><text x="92" y="373" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">15%</text><text x="140" y="360" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Analitik dan laporan</text><text x="140" y="386" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">Riwayat data, ekspor laporan untuk klien</text><rect x="920" y="351" width="34" height="28" rx="6" fill="#c2581e"/><rect x="964" y="351" width="34" height="28" rx="6" fill="#c2581e"/><rect x="1008" y="351" width="34" height="28" rx="6" fill="#e3e9fb"/><rect x="1052" y="351" width="34" height="28" rx="6" fill="#e3e9fb"/><rect x="1096" y="351" width="34" height="28" rx="6" fill="#e3e9fb"/><rect x="40" y="418" width="1120" height="78" rx="14" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><circle cx="92" cy="457" r="28" fill="#13235a"/><text x="92" y="465" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#fff" font-weight="800" text-anchor="middle">10%</text><text x="140" y="452" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Data dan dukungan</text><text x="140" y="478" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">Lokasi data, bahasa dukungan, cara keluar dari layanan</text><rect x="920" y="443" width="34" height="28" rx="6" fill="#13235a"/><rect x="964" y="443" width="34" height="28" rx="6" fill="#13235a"/><rect x="1008" y="443" width="34" height="28" rx="6" fill="#13235a"/><rect x="1052" y="443" width="34" height="28" rx="6" fill="#e3e9fb"/><rect x="1096" y="443" width="34" height="28" rx="6" fill="#e3e9fb"/><text x="920" y="36" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="700" text-anchor="start">Contoh skor satu alat (1 sampai 5)</text><text x="40" y="536" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="start">Kalikan skor tiap alat dengan bobotnya, lalu jumlahkan. Bobot ini titik awal, ubah sesuai prioritas tim.</text></svg>
