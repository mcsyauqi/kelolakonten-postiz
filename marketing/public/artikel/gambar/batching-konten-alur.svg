<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Alur batching konten media sosial</title><desc id="d">Lima tahap batching konten: rencana tema, produksi sekaligus, edit dan caption, review, lalu jadwalkan ke kalender satu minggu.</desc>
<rect width="1200" height="630" fill="#FBFCFE"/>
<g stroke="#E1E5EC" stroke-width="1"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/></g>
<text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#172338">Batching konten: kerjakan sekaligus, terbitkan bertahap</text>
<text x="60" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#454C5C">Satu sesi produksi mengisi antrean draft untuk satu minggu</text>
<g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
<rect x="60" y="190" width="190" height="150" rx="16" fill="#fff" stroke="#1E5BD8" stroke-width="2"/><text x="155" y="255" font-size="22" font-weight="700" fill="#172338">Rencana</text><text x="155" y="285" font-size="18" fill="#454C5C">tema dan brief</text>
<rect x="285" y="190" width="190" height="150" rx="16" fill="#fff" stroke="#1E5BD8" stroke-width="2"/><text x="380" y="255" font-size="22" font-weight="700" fill="#172338">Produksi</text><text x="380" y="285" font-size="18" fill="#454C5C">foto dan video</text>
<rect x="510" y="190" width="190" height="150" rx="16" fill="#fff" stroke="#1E5BD8" stroke-width="2"/><text x="605" y="255" font-size="22" font-weight="700" fill="#172338">Edit</text><text x="605" y="285" font-size="18" fill="#454C5C">dan caption</text>
<rect x="735" y="190" width="190" height="150" rx="16" fill="#fff" stroke="#1E5BD8" stroke-width="2"/><text x="830" y="255" font-size="22" font-weight="700" fill="#172338">Review</text><text x="830" y="285" font-size="18" fill="#454C5C">fakta, izin, CTA</text>
<rect x="960" y="190" width="190" height="150" rx="16" fill="#1E5BD8"/><text x="1055" y="255" font-size="22" font-weight="700" fill="#fff">Jadwalkan</text><text x="1055" y="285" font-size="18" fill="#DCE6FB">draft ke kalender</text>
</g>
