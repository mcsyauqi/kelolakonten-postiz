<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t d">
<title id="t">Memilah komentar negatif sebelum membalas</title>
<desc id="d">Diagram satu kotak komentar negatif bercabang ke empat jenis: keluhan sah, salah paham, spam, dan hinaan, masing-masing dengan tindakannya, serta kotak eskalasi untuk komentar yang ramai.</desc>
<rect width="1200" height="590" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Memilah komentar negatif sebelum membalas</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep; nama jenis bisa disesuaikan dengan akun Anda</text>
<rect x="40" y="120" width="250" height="120" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="152" font-size="18" font-weight="700" fill="#13235a">Komentar negatif</text><text x="58" y="180" font-size="15" fill="#13235a">Baca utuh dulu,</text><text x="58" y="202" font-size="15" fill="#13235a">jangan langsung dibalas</text><rect x="470" y="100" width="340" height="96" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="488" y="132" font-size="18" font-weight="700" fill="#1f8a7a">Kritik atau keluhan sah</text><text x="488" y="160" font-size="15" fill="#13235a">Balas publik, akui, beri</text><text x="488" y="182" font-size="15" fill="#13235a">langkah, lanjut di DM</text><line x1="290" y1="180" x2="466" y2="148" stroke="#4a5680" stroke-width="2"/><polygon points="466,148 457.9,153.9 456.4,145.3" fill="#4a5680"/><rect x="470" y="212" width="340" height="96" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="488" y="244" font-size="18" font-weight="700" fill="#2457d6">Salah paham atau info keliru</text><text x="488" y="272" font-size="15" fill="#13235a">Luruskan dengan sopan</text><text x="488" y="294" font-size="15" fill="#13235a">dan sertakan fakta</text><line x1="290" y1="180" x2="466" y2="260" stroke="#4a5680" stroke-width="2"/><polygon points="466,260 456.0,260.2 459.6,252.3" fill="#4a5680"/><rect x="470" y="324" width="340" height="96" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="488" y="356" font-size="18" font-weight="700" fill="#6a4fd1">Spam atau penipuan</text><text x="488" y="384" font-size="15" fill="#13235a">Sembunyikan atau hapus,</text><text x="488" y="406" font-size="15" fill="#13235a">laporkan akunnya</text><line x1="290" y1="180" x2="466" y2="372" stroke="#4a5680" stroke-width="2"/><polygon points="466,372 456.7,368.3 463.1,362.4" fill="#4a5680"/><rect x="470" y="436" width="340" height="96" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="488" y="468" font-size="18" font-weight="700" fill="#c2581e">Hinaan atau serangan pribadi</text><text x="488" y="496" font-size="15" fill="#13235a">Sembunyikan, batasi,</text><text x="488" y="518" font-size="15" fill="#13235a">blokir bila berulang</text><line x1="290" y1="180" x2="466" y2="484" stroke="#4a5680" stroke-width="2"/><polygon points="466,484 457.7,478.4 465.3,474.0" fill="#4a5680"/><rect x="880" y="210" width="280" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="898" y="242" font-size="18" font-weight="700" fill="#c2581e">Ramai dan menyebar</text><text x="898" y="270" font-size="15" fill="#13235a">Komentar serupa bertambah</text><text x="898" y="292" font-size="15" fill="#13235a">cepat: jeda promosi,</text><text x="898" y="314" font-size="15" fill="#13235a">eskalasi ke pemilik</text><line x1="810" y1="148" x2="876" y2="250" stroke="#4a5680" stroke-width="2"/><polygon points="876,250 867.5,244.8 874.8,240.1" fill="#4a5680"/><line x1="810" y1="484" x2="876" y2="330" stroke="#4a5680" stroke-width="2"/><polygon points="876,330 876.5,340.0 868.5,336.6" fill="#4a5680"/><text x="40" y="560" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Kunci: bedakan pengirim yang punya masalah nyata dari akun yang memang ingin merusak.</text>
</g>
</svg>
