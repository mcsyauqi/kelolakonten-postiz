<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 484" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="484" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Satu posting, 199 interaksi, tiga penyebut berbeda</text>
<text font-size="18" font-weight="700" fill="#13235a"><tspan x="60" y="156">Per reach (2.400)</tspan></text>
<rect x="390" y="134" width="580.3" height="38" rx="8" fill="#2457d6"/><text x="984.3" y="161" font-size="20" font-weight="700" fill="#13235a">8,29%</text>
<text x="390" y="196" font-size="16" fill="#3a466b">199 / 2.400 x 100</text>
<text font-size="18" font-weight="700" fill="#13235a"><tspan x="60" y="256">Per pengikut (5.000)</tspan></text>
<rect x="390" y="234" width="278.6" height="38" rx="8" fill="#6a4fd1"/><text x="682.6" y="261" font-size="20" font-weight="700" fill="#13235a">3,98%</text>
<text x="390" y="296" font-size="16" fill="#3a466b">199 / 5.000 x 100</text>
<text font-size="18" font-weight="700" fill="#13235a"><tspan x="60" y="356">Per views (6.000)</tspan></text>
<rect x="390" y="334" width="232.4" height="38" rx="8" fill="#1f8a7a"/><text x="636.4" y="361" font-size="20" font-weight="700" fill="#13235a">3,32%</text>
<text x="390" y="396" font-size="16" fill="#3a466b">199 / 6.000 x 100</text>
<text font-size="18" fill="#13235a"><tspan x="60" y="440">Angka rekaan. Perbedaan hasil berasal dari penyebut, bukan dari kualitas posting.</tspan></text>
</svg>
