<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="600" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Bukan satu algoritma: tiap bagian Instagram diurutkan sendiri</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Ringkasan dari Instagram Ranking Explained (diperbarui 31 Mei 2023)</text>
<g font-size="22" font-weight="700" fill="#fff">
<rect x="60" y="130" width="200" height="190" rx="18" fill="#2457d6"/><text x="84" y="178">Feed</text>
<rect x="282" y="130" width="200" height="190" rx="18" fill="#1f8a7a"/><text x="306" y="178">Stories</text>
<rect x="504" y="130" width="200" height="190" rx="18" fill="#6a4fd1"/><text x="528" y="178">Explore</text>
<rect x="726" y="130" width="200" height="190" rx="18" fill="#c2581e"/><text x="750" y="178">Reels</text>
<rect x="948" y="130" width="192" height="190" rx="18" fill="#13235a"/><text x="972" y="178">Search</text>
</g>
<g font-size="16" fill="#fff">
<text x="84" y="216">teman, keluarga,</text><text x="84" y="240">dan minat</text><text x="84" y="290" font-weight="700">diikuti + rekomendasi</text>
<text x="306" y="216">orang terdekat</text><text x="306" y="240">yang tidak ingin</text><text x="306" y="264">dilewatkan</text><text x="306" y="300" font-weight="700">hanya akun diikuti</text>
<text x="528" y="216">menemukan konten</text><text x="528" y="240">dan kreator baru</text><text x="528" y="290" font-weight="700">akun belum diikuti</text>
<text x="750" y="216">hiburan dan</text><text x="750" y="240">penemuan</text><text x="750" y="290" font-weight="700">mayoritas akun lain</text>
<text x="972" y="216">mencari akun</text><text x="972" y="240">dan topik</text>
</g>
<text x="60" y="380" font-size="20" font-weight="700" fill="#13235a">Pola kerja yang sama di semua bagian</text>
<g font-size="18" font-weight="700" fill="#13235a">
<rect x="60" y="404" width="240" height="84" rx="14" fill="#fff" stroke="#2457d6" stroke-width="2"/><text x="180" y="440" text-anchor="middle">1. Kandidat</text><text x="180" y="468" text-anchor="middle" font-size="15" font-weight="400">konten yang akan diurutkan</text>
<rect x="340" y="404" width="240" height="84" rx="14" fill="#fff" stroke="#2457d6" stroke-width="2"/><text x="460" y="440" text-anchor="middle">2. Sinyal</text><text x="460" y="468" text-anchor="middle" font-size="15" font-weight="400">ribuan, tentang konten dan Anda</text>
<rect x="620" y="404" width="240" height="84" rx="14" fill="#fff" stroke="#2457d6" stroke-width="2"/><text x="740" y="440" text-anchor="middle">3. Prediksi</text><text x="740" y="468" text-anchor="middle" font-size="15" font-weight="400">kemungkinan Anda berinteraksi</text>
<rect x="900" y="404" width="240" height="84" rx="14" fill="#2457d6"/><text x="1020" y="440" text-anchor="middle" fill="#fff">4. Urutan</text><text x="1020" y="468" text-anchor="middle" font-size="15" font-weight="400" fill="#eef2ff">per orang, bukan global</text>
</g>
<g stroke="#2457d6" stroke-width="3" fill="#2457d6"><line x1="300" y1="446" x2="334" y2="446"/><polygon points="334,440 340,446 334,452"/><line x1="580" y1="446" x2="614" y2="446"/><polygon points="614,440 620,446 614,452"/><line x1="860" y1="446" x2="894" y2="446"/><polygon points="894,440 900,446 894,452"/></g>
<text x="60" y="548" font-size="17" fill="#13235a">Konten yang sama bisa berada di posisi berbeda untuk dua pengikut, karena sinyal tiap orang berbeda.</text>
</svg>
