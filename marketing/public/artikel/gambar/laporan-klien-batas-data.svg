<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="500" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Batas data Instagram yang memengaruhi laporan</text>
<g font-size="18" font-weight="700" fill="#13235a"><text x="60" y="120">Batas menurut dokumentasi Meta</text><text x="600" y="120">Dampak ke laporan</text></g>
<line x1="60" y1="136" x2="1140" y2="136" stroke="#13235a" stroke-width="2"/>
<text font-size="17" font-weight="700" fill="#13235a"><tspan x="60" y="170">Data metrik bisa tertunda sampai 48 jam</tspan></text>
<text font-size="17"  fill="#3a466b"><tspan x="600" y="170">Tarik data minimal dua hari setelah periode ditutup</tspan></text>
<line x1="60" y1="185" x2="1140" y2="185" stroke="#d7def0" stroke-width="1"/>
<text font-size="17" font-weight="700" fill="#13235a"><tspan x="60" y="219">Data metrik media disimpan sampai 2 tahun</tspan></text>
<text font-size="17"  fill="#3a466b"><tspan x="600" y="219">Perbandingan tahun ke tahun masih bisa ditarik ulang</tspan></text>
<line x1="60" y1="234" x2="1140" y2="234" stroke="#d7def0" stroke-width="1"/>
<text font-size="17" font-weight="700" fill="#13235a"><tspan x="60" y="268">Data metrik pengguna disimpan sampai 90 hari</tspan></text>
<text font-size="17"  fill="#3a466b"><tspan x="600" y="268">Simpan snapshot akun setiap bulan</tspan></text>
<line x1="60" y1="283" x2="1140" y2="283" stroke="#d7def0" stroke-width="1"/>
<text font-size="17" font-weight="700" fill="#13235a"><tspan x="60" y="317">Data tidak tersedia dikembalikan kosong, bukan 0</tspan></text>
<text font-size="17"  fill="#3a466b"><tspan x="600" y="317">Tulis kosong sebagai kosong, jangan diisi nol</tspan></text>
<line x1="60" y1="332" x2="1140" y2="332" stroke="#d7def0" stroke-width="1"/>
<text font-size="17" font-weight="700" fill="#13235a"><tspan x="60" y="366">Metrik organik tidak menghitung interaksi iklan</tspan></text>
<text font-size="17"  fill="#3a466b"><tspan x="600" y="366">Pisahkan posting yang dipromosikan</tspan></text>
<line x1="60" y1="381" x2="1140" y2="381" stroke="#d7def0" stroke-width="1"/>
<text font-size="17" font-weight="700" fill="#13235a"><tspan x="60" y="415">Impressions dihentikan untuk media setelah 2 Juli 2024</tspan></text>
<text font-size="17"  fill="#3a466b"><tspan x="600" y="415">Pakai reach atau views untuk posting baru</tspan></text>
<text x="60" y="474" font-size="17" fill="#4a5578">Sumber: dokumentasi Insight Media dan Insight Platform Instagram, diakses 10 Oktober 2026.</text>
</svg>
