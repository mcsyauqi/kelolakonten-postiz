<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d"><title id="t">Rentang waktu jadwal postingan Page di Meta Business Suite</title><desc id="d">Postingan bisa dijadwalkan paling cepat 20 menit dan paling lama 29 hari dari sekarang</desc><rect width="1200" height="340" fill="#f4f7ff"/><g font-family="Inter, Arial, sans-serif"><text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Rentang jadwal yang diizinkan</text><text x="40" y="82" font-size="17" fill="#4a5680">Menurut Facebook Help Centre untuk postingan Page lewat Meta Business Suite</text><rect x="80" y="170" width="1040" height="14" rx="7" fill="#c9d4f2"/><rect x="200" y="170" width="880" height="14" rx="7" fill="#1f8a7a"/><circle cx="80" cy="177" r="12" fill="#13235a"/><text x="52" y="225" font-size="16" fill="#13235a" font-weight="700">Sekarang</text><circle cx="200" cy="177" r="12" fill="#2457d6"/><text x="160" y="150" font-size="16" fill="#2457d6" font-weight="700">+20 menit</text><text x="155" y="225" font-size="15" fill="#13235a">paling cepat</text><circle cx="1080" cy="177" r="12" fill="#c2581e"/><text x="1040" y="150" font-size="16" fill="#c2581e" font-weight="700">+29 hari</text><text x="1035" y="225" font-size="15" fill="#13235a">paling lama</text><text x="540" y="150" font-size="17" fill="#1f8a7a" font-weight="700">Jadwal bisa dipasang</text><text x="40" y="280" font-size="15" fill="#4a5680">Lebih dari 29 hari? Simpan sebagai draf atau catat di kalender konten, lalu jadwalkan saat sudah masuk rentang.</text><text x="40" y="312" font-size="15" fill="#4a5680">Semua jam mengikuti zona waktu Anda saat ini. Dibuat oleh Kelola Konten.</text></g></svg>
