<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d">
<title id="t">Contoh ritme kerja mingguan</title>
<desc id="d">Lima kotak hari Senin sampai Jumat berisi tugas utama, dengan satu pita di bawahnya untuk balasan komentar dan DM setiap hari.</desc>
<rect width="1200" height="450" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Contoh ritme kerja mingguan</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Contoh untuk tim kecil; balasan komentar dan DM berjalan setiap hari</text>
<rect x="40" y="120" width="212" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="152" font-size="18" font-weight="700" fill="#2457d6">Senin</text><text x="58" y="180" font-size="15" fill="#13235a">Baca angka minggu lalu</text><text x="58" y="204" font-size="15" fill="#13235a">Tetapkan satu fokus</text><rect x="266" y="120" width="212" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="284" y="152" font-size="18" font-weight="700" fill="#1f8a7a">Selasa</text><text x="284" y="180" font-size="15" fill="#13235a">Tulis caption dan brief</text><text x="284" y="204" font-size="15" fill="#13235a">Kirim bahan ke desainer</text><rect x="492" y="120" width="212" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="510" y="152" font-size="18" font-weight="700" fill="#2457d6">Rabu</text><text x="510" y="180" font-size="15" fill="#13235a">Review draf</text><text x="510" y="204" font-size="15" fill="#13235a">Kirim untuk disetujui</text><rect x="718" y="120" width="212" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="736" y="152" font-size="18" font-weight="700" fill="#1f8a7a">Kamis</text><text x="736" y="180" font-size="15" fill="#13235a">Jadwalkan konten</text><text x="736" y="204" font-size="15" fill="#13235a">Cek tren dan pesaing</text><rect x="944" y="120" width="212" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="962" y="152" font-size="18" font-weight="700" fill="#2457d6">Jumat</text><text x="962" y="180" font-size="15" fill="#13235a">Rapikan arsip</text><text x="962" y="204" font-size="15" fill="#13235a">Catat pelajaran</text><line x1="252" y1="195" x2="258" y2="195" stroke="#4a5680" stroke-width="2"/><path d="M256 189 L266 195 L256 201 Z" fill="#4a5680"/><line x1="478" y1="195" x2="484" y2="195" stroke="#4a5680" stroke-width="2"/><path d="M482 189 L492 195 L482 201 Z" fill="#4a5680"/><line x1="704" y1="195" x2="710" y2="195" stroke="#4a5680" stroke-width="2"/><path d="M708 189 L718 195 L708 201 Z" fill="#4a5680"/><line x1="930" y1="195" x2="936" y2="195" stroke="#4a5680" stroke-width="2"/><path d="M934 189 L944 195 L934 201 Z" fill="#4a5680"/><rect x="40" y="300" width="1120" height="66" rx="10" fill="#e5ecff" stroke="#c9d4f2"/><text x="600" y="341" font-size="18" font-weight="700" fill="#13235a" text-anchor="middle">Setiap hari: balas komentar dan DM, teruskan keluhan yang perlu tindak lanjut</text>
<text x="40" y="412" font-size="16" fill="#4a5680">Urutan bisa disesuaikan. Yang penting ada waktu khusus untuk membaca data dan waktu khusus untuk produksi.</text>
</g>
</svg>
