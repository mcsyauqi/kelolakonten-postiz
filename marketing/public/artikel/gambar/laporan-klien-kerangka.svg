<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 509" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="509" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Lima bagian laporan bulanan untuk klien</text>
<rect x="60" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="100" width="10" height="145" rx="5" fill="#2457d6"/>
<text font-size="20" font-weight="700" fill="#2457d6"><tspan x="88" y="140">1. Ringkasan</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="179">Tiga temuan dan satu keputusan</tspan><tspan x="88" y="202">yang diminta dari klien.</tspan></text>
<rect x="429.3333333333333" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="429.3333333333333" y="100" width="10" height="145" rx="5" fill="#1f8a7a"/>
<text font-size="20" font-weight="700" fill="#1f8a7a"><tspan x="457.3333333333333" y="140">2. Angka utama</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="457.3333333333333" y="179">Metrik sesuai tujuan, periode,</tspan><tspan x="457.3333333333333" y="202">dan tanggal penarikan data.</tspan></text>
<rect x="798.6666666666666" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="798.6666666666666" y="100" width="10" height="145" rx="5" fill="#6a4fd1"/>
<text font-size="20" font-weight="700" fill="#6a4fd1"><tspan x="826.6666666666666" y="140">3. Konten menonjol</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="826.6666666666666" y="179">Posting terbaik dan terlemah,</tspan><tspan x="826.6666666666666" y="202">lengkap dengan alasannya.</tspan></text>
<rect x="60" y="273" width="341.3333333333333" height="168" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="273" width="10" height="168" rx="5" fill="#c2581e"/>
<text font-size="20" font-weight="700" fill="#c2581e"><tspan x="88" y="313">4. Catatan data</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="352">Angka kosong, metrik yang</tspan><tspan x="88" y="375">berubah, dan data yang tertunda.</tspan></text>
<rect x="429.3333333333333" y="273" width="341.3333333333333" height="168" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="429.3333333333333" y="273" width="10" height="168" rx="5" fill="#13235a"/>
<text font-size="20" font-weight="700" fill="#13235a"><tspan x="457.3333333333333" y="313">5. Rencana</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="457.3333333333333" y="352">Satu sampai tiga perubahan,</tspan><tspan x="457.3333333333333" y="375">masing-masing dengan pemilik dan</tspan><tspan x="457.3333333333333" y="398">tanggal.</tspan></text>
<text x="60" y="485" font-size="17" fill="#4a5578">Halaman pertama memuat bagian 1 dan 2. Bagian lain menjadi bukti yang bisa diperiksa.</text>
</svg>
