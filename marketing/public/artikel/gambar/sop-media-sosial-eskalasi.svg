<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="t d">
<title id="t">Tiga tingkat eskalasi komentar dan DM</title>
<desc id="d">Tiga kotak: rutin, keluhan, krisis, dengan contoh kasus dan siapa yang menangani.</desc>
<rect width="1200" height="350" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Tiga tingkat eskalasi komentar dan DM</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep; batas tiap tingkat ditentukan pemilik usaha</text>
<rect x="40" y="130" width="350" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="162" font-size="18" font-weight="700" fill="#1f8a7a">Tingkat 1: rutin</text><text x="58" y="190" font-size="15" fill="#13235a">Pertanyaan harga, stok, jam buka</text><text x="58" y="212" font-size="15" fill="#13235a">Admin membalas pakai templat</text><text x="58" y="234" font-size="15" fill="#13235a">Target: hari yang sama</text><line x1="390" y1="205" x2="418" y2="205" stroke="#4a5680" stroke-width="2"/><polygon points="418,205 409.0,209.3 409.0,200.7" fill="#4a5680"/><rect x="420" y="130" width="350" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="438" y="162" font-size="18" font-weight="700" fill="#c2581e">Tingkat 2: keluhan</text><text x="438" y="190" font-size="15" fill="#13235a">Pesanan telat, barang rusak</text><text x="438" y="212" font-size="15" fill="#13235a">Admin minta detail lewat DM</text><text x="438" y="234" font-size="15" fill="#13235a">Teruskan ke penanggung jawab</text><line x1="770" y1="205" x2="798" y2="205" stroke="#4a5680" stroke-width="2"/><polygon points="798,205 789.0,209.3 789.0,200.7" fill="#4a5680"/><rect x="800" y="130" width="350" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="818" y="162" font-size="18" font-weight="700" fill="#6a4fd1">Tingkat 3: krisis</text><text x="818" y="190" font-size="15" fill="#13235a">Keluhan ramai, isu keamanan</text><text x="818" y="212" font-size="15" fill="#13235a">Jeda jadwal promosi</text><text x="818" y="234" font-size="15" fill="#13235a">Pemilik memutuskan pernyataan</text><text x="40" y="320" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Naikkan tingkat bila balasan pertama tidak menyelesaikan masalah atau komentar serupa bertambah.</text>
</g>
</svg>
