dth="146" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="706" y="162" font-size="18" font-weight="700" fill="#2457d6">Setujui</text><text x="706" y="190" font-size="15" fill="#13235a">Satu penyetuju</text><line x1="834" y1="185" x2="848" y2="185" stroke="#4a5680" stroke-width="2"/><polygon points="848,185 839.0,189.3 839.0,180.7" fill="#4a5680"/><text x="761" y="280" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Langkah 5</text><rect x="850" y="130" width="146" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="868" y="162" font-size="18" font-weight="700" fill="#6a4fd1">Jadwal</text><text x="868" y="190" font-size="15" fill="#13235a">Masuk antrean</text><line x1="996" y1="185" x2="1010" y2="185" stroke="#4a5680" stroke-width="2"/><polygon points="1010,185 1001.0,189.3 1001.0,180.7" fill="#4a5680"/><text x="923" y="280" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Langkah 6</text><rect x="1012" y="130" width="146" height="110" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="1030" y="162" font-size="18" font-weight="700" fill="#1f8a7a">Pantau</text><text x="1030" y="190" font-size="15" fill="#13235a">Balas dan catat</text><text x="1085" y="280" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Langkah 7</text><rect x="40" y="310" width="1120" height="64" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="60" y="348" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">Akhir bulan: laporan singkat, lalu pelajaran dibawa ke rencana bulan berikutnya.</text>
