<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">Alur SOP konten dari rencana sampai pantau</title>
<desc id="d">Tujuh kotak berurutan: rencana, brief, draf, tinjau, setujui, jadwal, pantau, ditutup laporan bulanan.</desc>
<rect width="1200" height="400" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Alur SOP konten dari rencana sampai pantau</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep; nama tahap bisa disesuaikan dengan tim Anda</text>
