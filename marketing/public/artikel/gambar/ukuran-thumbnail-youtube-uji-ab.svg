<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d"><title id="t">Uji A/B thumbnail: sampai tiga varian, satu pemenang</title><desc id="d">Tiga varian thumbnail untuk satu video dibandingkan menurut waktu tonton; varian dengan waktu tonton tertinggi ditampilkan ke semua penonton setelah pengujian. Batang adalah ilustrasi.</desc><rect width="1200" height="650" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Uji A/B thumbnail: sampai tiga varian, satu pemenang</text><rect x="40" y="110" width="200" height="112" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="100" cy="145.84" r="8.96" fill="#2457d6" opacity="0.55"/><path d="M64 201.83999999999997 L124 163.76 L160 186.16000000000003 L184 172.72 L220 201.83999999999997 Z" fill="#2457d6" opacity="0.35"/><text x="140" y="214" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="start"></text><text x="270" y="158" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#2457d6" font-weight="800" text-anchor="start">Varian A</text><text x="270" y="186" font-family="Figtree, Inter, Arial, sans-serif" font-size="14.5" fill="#3b4a6b" font-weight="600" text-anchor="start">thumbnail berbeda, video sama</text><rect x="520" y="146" width="260.4" height="40" rx="8" fill="#2457d6"/><text x="790.4" y="174" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#1f8a7a" font-weight="800" text-anchor="start"></text><rect x="40" y="240" width="200" height="112" rx="10" fill="#ffffff" stroke="#1f8a7a" stroke-width="3"/><circle cx="100" cy="275.84000000000003" r="8.96" fill="#1f8a7a" opacity="0.55"/><path d="M64 331.84 L124 293.76 L160 316.16 L184 302.72 L220 331.84 Z" fill="#1f8a7a" opacity="0.35"/><text x="140" y="344" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="start"></text><text x="270" y="288" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#1f8a7a" font-weight="800" text-anchor="start">Varian B</text><text x="270" y="316" font-family="Figtree, Inter, Arial, sans-serif" font-size="14.5" fill="#3b4a6b" font-weight="600" text-anchor="start">thumbnail berbeda, video sama</text><rect x="520" y="276" width="420" height="40" rx="8" fill="#1f8a7a"/><text x="950" y="304" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#1f8a7a" font-weight="800" text-anchor="start">waktu tonton tertinggi</text><rect x="40" y="370" width="200" height="112" rx="10" fill="#ffffff" stroke="#6a4fd1" stroke-width="3"/><circle cx="100" cy="405.84000000000003" r="8.96" fill="#6a4fd1" opacity="0.55"/><path d="M64 461.84 L124 423.76 L160 446.16 L184 432.72 L220 461.84 Z" fill="#6a4fd1" opacity="0.35"/><text x="140" y="474" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="start"></text><text x="270" y="418" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#6a4fd1" font-weight="800" text-anchor="start">Varian C</text><text x="270" y="446" font-family="Figtree, Inter, Arial, sans-serif" font-size="14.5" fill="#3b4a6b" font-weight="600" text-anchor="start">thumbnail berbeda, video sama</text><rect x="520" y="406" width="189" height="40" rx="8" fill="#6a4fd1"/><text x="719" y="434" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#1f8a7a" font-weight="800" text-anchor="start"></text><text x="520" y="100" font-family="Figtree, Inter, Arial, sans-serif" font-size="14.5" fill="#3b4a6b" font-weight="600" text-anchor="start">waktu tonton selama pengujian (ilustrasi)</text><rect x="40" y="510" width="1120" height="70" rx="12" fill="#e3f4f1" stroke="#1f8a7a" stroke-width="2"/><text x="600" y="553" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#1f8a7a" font-weight="800" text-anchor="middle">Setelah pengujian selesai, YouTube menampilkan opsi dengan waktu tonton tertinggi ke semua penonton.</text><text x="600" y="620" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">Hanya di desktop, butuh fitur lanjutan, tidak berlaku untuk Shorts. Batang di atas ilustrasi, bukan data nyata.</text></svg>
