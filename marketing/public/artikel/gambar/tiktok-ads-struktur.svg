<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-labelledby="t d"><title id="t">Struktur iklan TikTok Ads Manager</title><desc id="d">Tiga tingkat: kampanye (tujuan dan anggaran, minimal harian di atas 50 dolar), grup iklan (penempatan, audiens, anggaran, jadwal, optimasi, minimal harian di atas 20 dolar), dan iklan (format, materi, teks, tombol ajakan, pelacakan).</desc><rect width="1200" height="510" fill="#f4f7ff"/><rect x="50" y="70" width="335" height="360" rx="14" fill="#fff" stroke="#13235a" stroke-width="3"/><rect x="50" y="70" width="335" height="70" rx="14" fill="#13235a"/><text x="217" y="115" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#fff" font-weight="800" text-anchor="middle">Kampanye</text><text x="78" y="185" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Pilih tujuan (misal Traffic)</text><text x="78" y="233" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Anggaran: harian, total, atau</text><text x="78" y="281" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">tanpa batas</text><text x="78" y="329" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Minimal di atas $50</text><path d="M390 250L430 250M417.7138441335348 256.71195754045885L430 250L417.7138441335348 243.28804245954115" stroke="#13235a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="435" y="70" width="335" height="360" rx="14" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><rect x="435" y="70" width="335" height="70" rx="14" fill="#1f8a7a"/><text x="602" y="115" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#fff" font-weight="800" text-anchor="middle">Grup iklan</text><text x="463" y="185" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Penempatan dan audiens</text><text x="463" y="233" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Anggaran dan jadwal</text><text x="463" y="281" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Tujuan optimasi dan tawaran</text><text x="463" y="329" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#1f8a7a" font-weight="800" text-anchor="start">Minimal harian di atas $20</text><path d="M775 250L815 250M802.7138441335347 256.71195754045885L815 250L802.7138441335347 243.28804245954115" stroke="#13235a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="820" y="70" width="335" height="360" rx="14" fill="#fff" stroke="#c2581e" stroke-width="3"/><rect x="820" y="70" width="335" height="70" rx="14" fill="#c2581e"/><text x="987" y="115" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#fff" font-weight="800" text-anchor="middle">Iklan</text><text x="848" y="185" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Format iklan</text><text x="848" y="233" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Video atau gambar</text><text x="848" y="281" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Teks dan tombol ajakan</text><text x="848" y="329" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="start">Pelacakan</text><text x="600" y="475" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="600" text-anchor="middle">Satu kampanye berisi beberapa grup iklan, satu grup iklan berisi satu atau lebih iklan.</text></svg>
