<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d"><title id="t">Dua jalur resmi menghubungkan Instagram dan Facebook Page</title><desc id="d">Jalur atas dari aplikasi Instagram di ponsel: Edit profil, Page, Connect or create, masuk Facebook, pilih Page. Jalur bawah dari Facebook di komputer: beralih ke Page, Settings, Linked accounts, Instagram, Connect account. Keduanya berakhir di akun yang terhubung</desc><rect width="1200" height="430" fill="#f4f7ff"/><rect x="30" y="70" width="190" height="80" rx="14" fill="#2457d6"/><text x="125" y="117" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">Aplikasi Instagram</text><path d="M228 110H246" stroke="#4a5680" stroke-width="3"/><path d="M236 103L246 110L236 117" stroke="#4a5680" stroke-width="3" fill="none"/><rect x="250" y="80" width="150" height="60" rx="30" fill="#fff" stroke="#2457d6" stroke-width="2.5"/><text x="325" y="116" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="middle">Edit profil</text><path d="M400 110H418" stroke="#4a5680" stroke-width="3"/><path d="M408 103L418 110L408 117" stroke="#4a5680" stroke-width="3" fill="none"/><rect x="422" y="80" width="150" height="60" rx="30" fill="#fff" stroke="#2457d6" stroke-width="2.5"/><text x="497" y="116" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="middle">Page</text><path d="M572 110H590" stroke="#4a5680" stroke-width="3"/><path d="M580 103L590 110L580 117" stroke="#4a5680" stroke-width="3" fill="none"/><rect x="594" y="80" width="150" height="60" rx="30" fill="#fff" stroke="#2457d6" stroke-width="2.5"/><text x="669" y="116" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="middle">Connect or create</text><path d="M744 110H762" stroke="#4a5680" str