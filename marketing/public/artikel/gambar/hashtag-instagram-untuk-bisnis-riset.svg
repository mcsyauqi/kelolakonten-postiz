<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Alur riset hashtag untuk bisnis</title>
<desc id="d">Lima langkah riset hashtag: daftar kata, cek halaman tagar, saring, kelompokkan, uji</desc>
<rect width="1200" height="340" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Alur riset hashtag untuk bisnis</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Lima langkah, cukup dengan aplikasi Instagram</text>
<rect x="30" y="130" width="205" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="48" y="162" font-size="18" font-weight="700" fill="#2457d6">1. Daftar kata</text><text x="48" y="190" font-size="15" fill="#13235a">Kata yang dipakai</text><text x="48" y="212" font-size="15" fill="#13235a">pembeli mencari</text><line x1="237" y1="195" x2="258" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="258,195 249.0,199.3 249.0,190.7" fill="#4a5680"/><rect x="260" y="130" width="205" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="278" y="162" font-size="18" font-weight="700" fill="#1f8a7a">2. Cek halaman</text><text x="278" y="190" font-size="15" fill="#13235a">Buka halaman tagar,</text><text x="278" y="212" font-size="15" fill="#13235a">lihat isinya</text><line x1="467" y1="195" x2="488" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="488,195 479.0,199.3 479.0,190.7" fill="#4a5680"/><rect x="490" y="130" width="205" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="508" y="162" font-size="18" font-weight="700" fill="#6a4fd1">3. Saring</text><text x="508" y="190" font-size="15" fill="#13235a">Buang yang umum,</text><text x="508" y="212" font-size="15" fill="#13235a">spam, tak relevan</text><line x1="697" y1="195" x2="718" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="718,195 709.0,199.3 709.0,190.7" fill="#4a5680"/><rect x="720" y="130" width="205" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="738" y="162" font-size="18" font-weight="700" fill="#c2581e">4. Kelompokkan</text><text x="738" y="190" font-size="15" fill="#13235a">Set per jenis</text><text x="738" y="212" font-size="15" fill="#13235a">konten</text><line x1="927" y1="195" x2="948" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="948,195 939.0,199.3 939.0,190.7" fill="#4a5680"/><rect x="950" y="130" width="205" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="968" y="162" font-size="18" font-weight="700" fill="#13235a">5. Uji</text><text x="968" y="190" font-size="15" fill="#13235a">Pakai 2 sampai 4</text><text x="968" y="212" font-size="15" fill="#13235a">minggu, bandingkan</text><text x="30" y="310" font-size="17" fill="#13235a" font-weight="700" text-anchor="start">Ulangi riset tiap tiga bulan atau saat meluncurkan produk baru.</text>
</g>
</svg>
