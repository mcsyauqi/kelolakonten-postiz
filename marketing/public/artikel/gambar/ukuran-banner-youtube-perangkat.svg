<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d"><title id="t">Satu banner, tampilan berbeda di tiap perangkat</title><desc id="d">Ilustrasi banner yang sama di TV (hampir utuh), komputer (pita lebar dengan atas dan bawah terpangkas), dan ponsel (pita sempit dengan sisi ikut terpangkas), dengan area aman yang tetap terlihat di ketiganya.</desc><rect width="1200" height="680" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Satu banner, tampilan berbeda di tiap perangkat</text><rect x="40" y="110" width="470" height="300" rx="14" fill="#13235a" stroke="#13235a" stroke-width="2"/><rect x="56" y="126" width="438" height="246" rx="4" fill="#e8edff" stroke="#2457d6" stroke-width="2"/><rect x="143.60000000000002" y="187.5" width="262.8" height="123" rx="4" fill="#ffffff" stroke="#c2581e" stroke-width="2" stroke-dasharray="6 5"/><rect x="235" y="410" width="80" height="22" fill="#13235a"/><rect x="190" y="430" width="170" height="12" rx="6" fill="#13235a"/><text x="275" y="480" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="middle">TV: banner tampil hampir utuh</text><text x="275" y="506" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">karena itu rekomendasi 2560 x 1440</text><rect x="560" y="130" width="360" height="240" rx="12" fill="#ffffff" stroke="#13235a" stroke-width="3"/><rect x="576" y="150" width="328" height="62" rx="4" fill="#e8edff" stroke="#2457d6" stroke-width="2"/><rect x="641.6" y="165.5" width="196.79999999999998" height="31" rx="4" fill="#ffffff" stroke="#c2581e" stroke-width="2" stroke-dasharray="6 5"/><circle cx="608" cy="250" r="26" fill="#6a4fd1" opacity="0.5"/><rect x="646" y="236" width="170" height="12" rx="6" fill="#cdd7ef"/><rect x="646" y="258" width="120" height="10" rx="5" fill="#cdd7ef"/><rect x="576" y="296" width="100" height="56" rx="6" fill="#e8edff"/><rect x="688" y="296" width="100" height="56" rx="6" fill="#e8edff"/><rect x="800" y="296" width="100" height="56" rx="6" fill="#e8edff"/><path d="M540 380 L940 380 L960 400 L520 400 Z" fill="#13235a"/><text x="740" y="480" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="middle">Komputer: pita lebar</text><text x="740" y="506" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">bagian atas dan bawah terpangkas</text><rect x="990" y="100" width="170" height="330" rx="24" fill="#ffffff" stroke="#13235a" stroke-width="3"/><rect x="1004" y="140" width="142" height="44" rx="4" fill="#e8edff" stroke="#2457d6" stroke-width="2"/><rect x="1032.4" y="151" width="85.2" height="22" rx="4" fill="#ffffff" stroke="#c2581e" stroke-width="2" stroke-dasharray="6 5"/><circle cx="1030" cy="215" r="18" fill="#6a4fd1" opacity="0.5"/><rect x="1056" y="206" width="80" height="10" rx="5" fill="#cdd7ef"/><rect x="1004" y="250" width="142" height="46" rx="6" fill="#e8edff"/><rect x="1004" y="306" width="142" height="46" rx="6" fill="#e8edff"/><rect x="1004" y="362" width="142" height="46" rx="6" fill="#e8edff"/><text x="1075" y="480" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="800" text-anchor="middle">Ponsel: pita sempit</text><text x="1075" y="506" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">sisi ikut terpangkas</text><rect x="40" y="545" width="1120" height="70" rx="12" fill="#fff3ec" stroke="#c2581e" stroke-width="2"/><text x="600" y="587" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#c2581e" font-weight="800" text-anchor="middle">Kotak putus-putus = area aman. Isi penting di luar kotak ini bisa hilang di sebagian perangkat.</text><text x="600" y="650" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">Ilustrasi proporsi, bukan ukuran tampilan resmi tiap perangkat.</text></svg>
