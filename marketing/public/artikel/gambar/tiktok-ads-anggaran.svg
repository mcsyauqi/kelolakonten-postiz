<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d"><title id="t">Aturan anggaran TikTok Ads</title><desc id="d">Kiri: anggaran total grup iklan selama 31 hari minimal 31 kali 20 dolar, yaitu 620 dolar. Kanan: saran TikTok menaikkan anggaran maksimal 40 persen saat masih fase belajar dan 30 persen setelah keluar fase belajar, dengan jeda minimal 2 hari; batang indeks 100, 140, dan 182 menggambarkan dua kenaikan berturut-turut.</desc><rect width="1200" height="540" fill="#f4f7ff"/><text x="60" y="70" font-family="Figtree, Inter, Arial, sans-serif" font-size="24" fill="#13235a" font-weight="800" text-anchor="start">Anggaran total grup iklan</text><rect x="60" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="74" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">1</text><rect x="94" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="108" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">2</text><rect x="128" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="142" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">3</text><rect x="162" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="176" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">4</text><rect x="196" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="210" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">5</text><rect x="230" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="244" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">6</text><rect x="264" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="278" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">7</text><rect x="298" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="312" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">8</text><rect x="332" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="346" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">9</text><rect x="366" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="380" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">10</text><rect x="400" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="414" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">11</text><rect x="434" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="448" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">12</text><rect x="468" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="482" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">13</text><rect x="502" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="516" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">14</text><rect x="536" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="550" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">15</text><rect x="570" y="100" width="28" height="36" rx="6" fill="#dff1ee"/><text x="584" y="124" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">16</text><rect x="60" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="74" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">17</text><rect x="94" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="108" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">18</text><rect x="128" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="142" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">19</text><rect x="162" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="176" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">20</text><rect x="196" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="210" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">21</text><rect x="230" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="244" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">22</text><rect x="264" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="278" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">23</text><rect x="298" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="312" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">24</text><rect x="332" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="346" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">25</text><rect x="366" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="380" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">26</text><rect x="400" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="414" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">27</text><rect x="434" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="448" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">28</text><rect x="468" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="482" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">29</text><rect x="502" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="516" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">30</text><rect x="536" y="144" width="28" height="36" rx="6" fill="#dff1ee"/><text x="550" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="13" fill="#1f8a7a" font-weight="700" text-anchor="middle">31</text><text x="60" y="230" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#1f8a7a" font-weight="800" text-anchor="start">31 hari x $20 = minimal $620</text><rect x="640" y="50" width="500" height="200" rx="14" fill="#fff" stroke="#c2581e" stroke-width="3"/><text x="665" y="92" font-family="Figtree, Inter, Arial, sans-serif" font-size="24" fill="#c2581e" font-weight="800" text-anchor="start">Menaikkan anggaran</text><text x="665" y="135" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="700" text-anchor="start">Masih fase belajar: naik maks 40%</text><text x="665" y="172" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="700" text-anchor="start">Sudah lewat fase belajar: maks 30%</text><text x="665" y="209" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#3b4a6b" font-weight="700" text-anchor="start">Jeda minimal 2 hari antar perubahan</text><rect x="700" y="395" width="90" height="85" rx="8" fill="#13235a"/><text x="745" y="508" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Awal</text><text x="745" y="387" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">100</text><rect x="840" y="361" width="90" height="119" rx="8" fill="#1f8a7a"/><text x="885" y="508" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">+40%</text><text x="885" y="353" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#1f8a7a" font-weight="700" text-anchor="middle">140</text><rect x="980" y="325.3" width="90" height="154.7" rx="8" fill="#2457d6"/><text x="1025" y="508" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">+30%</text><text x="1025" y="317.3" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#2457d6" font-weight="700" text-anchor="middle">182</text><text x="60" y="330" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="600" text-anchor="start">Catatan: halaman bantuan TikTok menulis angka minimal</text><text x="60" y="360" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="600" text-anchor="start">dalam dolar AS. Angka 100, 140, 182 di kanan hanya</text><text x="60" y="390" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="600" text-anchor="start">ilustrasi indeks, bukan rupiah.</text></svg>
