<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d"><title id="t">Garis waktu rutinitas analisis kompetitor Instagram dalam satu bulan</title><desc id="d">Minggu 1 pilih 3 sampai 5 kompetitor dan catat profil, minggu 2 isi template 12 posting terakhir, minggu 3 cek iklan aktif di Meta Ad Library, minggu 4 tarik kesimpulan dan uji satu ide di konten sendiri, lalu ulangi bulan berikutnya</desc><rect width="1200" height="400" fill="#f4f7ff"/><path d="M120 190H1080" stroke="#13235a" stroke-width="4"/><path d="M1080 190c60 0 60 120 0 120H140c-60 0-60-60-20-90" stroke="#4a5680" stroke-width="2.5" fill="none" stroke-dasharray="7 7"/><circle cx="170" cy="190" r="22" fill="#2457d6"/><circle cx="170" cy="190" r="8" fill="#fff"/><text x="170" y="140" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#2457d6" font-weight="800" text-anchor="middle">Minggu 1</text><rect x="60" y="226" width="220" height="72" rx="12" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><text x="170" y="256" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Pilih 3-5 akun</text><text x="170" y="282" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="middle">catat profil</text><circle cx="450" cy="190" r="22" fill="#1f8a7a"/><circle cx="450" cy="190" r="8" fill="#fff"/><text x="450" y="140" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#1f8a7a" font-weight="800" text-anchor="middle">Minggu 2</text><rect x="340" y="226" width="220" height="72" rx="12" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><text x="450" y="256" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Isi template</text><text x="450" y="282" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="middle">12 posting terakhir</text><circle cx="730" cy="190" r="22" fill="#6a4fd1"/><circle cx="730" cy="190" r="8" fill="#fff"/><text x="730" y="140" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#6a4fd1" font-weight="800" text-anchor="middle">Minggu 3</text><rect x="620" y="226" width="220" height="72" rx="12" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><text x="730" y="256" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Cek iklan aktif</text><text x="730" y="282" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="middle">Meta Ad Library</text><circle cx="1010" cy="190" r="22" fill="#c2581e"/><circle cx="1010" cy="190" r="8" fill="#fff"/><text x="1010" y="140" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#c2581e" font-weight="800" text-anchor="middle">Minggu 4</text><rect x="900" y="226" width="220" height="72" rx="12" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><text x="1010" y="256" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Simpulkan</text><text x="1010" y="282" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="middle">uji 1 ide sendiri</text><text x="600" y="340" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#4a5680" font-weight="600" text-anchor="middle">Ulangi tiap bulan, bandingkan dengan catatan bulan lalu</text><text x="40" y="380" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="400" text-anchor="start">Rutinitas yang disarankan Kelola Konten untuk UMKM dan agensi. Diagram Kelola Konten.</text></svg>
