<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">Momen konten akhir tahun 2026</title>
<desc id="d">Linimasa tanggal penting Desember 2026 sampai 1 Januari 2027 untuk kalender konten bisnis</desc>
<rect width="1200" height="440" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Momen konten akhir tahun 2026</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Tanggal libur dari SKB 3 Menteri 2026; Hari Ibu dan Harbolnas tanggal tetap</text>
<line x1="70" y1="230" x2="1130" y2="230" stroke="#c9d4f2" stroke-width="6" stroke-linecap="round"/><circle cx="90" cy="230" r="16" fill="#2457d6"/><text x="90" y="190" font-size="20" fill="#13235a" font-weight="700" text-anchor="middle">1 Des</text><text x="90" y="280" font-size="15" fill="#13235a" font-weight="400" text-anchor="middle">Mulai seri recap</text><circle cx="258" cy="230" r="16" fill="#c2581e"/><text x="258" y="190" font-size="20" fill="#13235a" font-weight="700" text-anchor="middle">12 Des</text><text x="258" y="280" font-size="15" fill="#13235a" font-weight="400" text-anchor="middle">Harbolnas 12.12</text><circle cx="426" cy="230" r="16" fill="#6a4fd1"/><text x="426" y="190" font-size="20" fill="#13235a" font-weight="700" text-anchor="middle">22 Des</text><text x="426" y="280" font-size="15" fill="#13235a" font-weight="400" text-anchor="middle">Hari Ibu</text><circle cx="594" cy="230" r="16" fill="#1f8a7a"/><text x="594" y="190" font-size="20" fill="#13235a" font-weight="700" text-anchor="middle">24 Des</text><text x="594" y="280" font-size="15" fill="#13235a" font-weight="400" text-anchor="middle">Cuti bersama</text><circle cx="762" cy="230" r="16" fill="#1f8a7a"/><text x="762" y="190" font-size="20" fill="#13235a" font-weight="700" text-anchor="middle">25 Des</text><text x="762" y="280" font-size="15" fill="#13235a" font-weight="400" text-anchor="middle">Natal</text><circle cx="930" cy="230" r="16" fill="#2457d6"/><text x="930" y="190" font-size="20" fill="#13235a" font-weight="700" text-anchor="middle">31 Des</text><text x="930" y="280" font-size="15" fill="#13235a" font-weight="400" text-anchor="middle">Malam tahun baru</text><circle cx="1098" cy="230" r="16" fill="#c2581e"/><text x="1098" y="190" font-size="20" fill="#13235a" font-weight="700" text-anchor="middle">1 Jan</text><text x="1098" y="280" font-size="15" fill="#13235a" font-weight="400" text-anchor="middle">Tahun Baru 2027</text><rect x="70" y="320" width="500" height="90" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="88" y="352" font-size="18" font-weight="700" fill="#2457d6">Fase 1: rekap dan promo</text><text x="88" y="380" font-size="15" fill="#13235a">1 sampai 15 Desember, konten recap dan 12.12</text><rect x="630" y="320" width="500" height="90" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="648" y="352" font-size="18" font-weight="700" fill="#c2581e">Fase 2: terima kasih dan teaser</text><text x="648" y="380" font-size="15" fill="#13235a">16 Desember sampai 2 Januari, sapaan dan rencana</text>
</g>
</svg>
