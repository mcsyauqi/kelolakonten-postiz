<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-labelledby="t d">
<title id="t">Tangga KPI: dari dilihat sampai terjual</title>
<desc id="d">Empat kotak berurutan: ditemukan dengan jangkauan, diperhatikan dengan engagement rate, dipertimbangkan dengan klik tautan dan chat, dibeli dengan penjualan dari media sosial.</desc>
<rect width="1200" height="512" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Tangga KPI: dari dilihat sampai terjual</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Setiap anak tangga dibaca dengan angka yang berbeda</text>
<rect x="40" y="130" width="262" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="162" font-size="18" font-weight="700" fill="#2457d6">Ditemukan</text><text x="58" y="190" font-size="15" fill="#13235a">Jangkauan</text><text x="58" y="214" font-size="15" fill="#13235a">Views</text><text x="58" y="238" font-size="15" fill="#13235a">Porsi non-pengikut</text><line x1="302" y1="230" x2="324" y2="230" stroke="#4a5680" stroke-width="2"/><path d="M322 224 L332 230 L322 236 Z" fill="#4a5680"/><rect x="332" y="130" width="262" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="350" y="162" font-size="18" font-weight="700" fill="#2457d6">Diperhatikan</text><text x="350" y="190" font-size="15" fill="#13235a">Engagement rate</text><text x="350" y="214" font-size="15" fill="#13235a">Simpan dan bagikan</text><text x="350" y="238" font-size="15" fill="#13235a">Pengikut bersih</text><line x1="594" y1="230" x2="616" y2="230" stroke="#4a5680" stroke-width="2"/><path d="M614 224 L624 230 L614 236 Z" fill="#4a5680"/><rect x="624" y="130" width="262" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="642" y="162" font-size="18" font-weight="700" fill="#2457d6">Dipertimbangkan</text><text x="642" y="190" font-size="15" fill="#13235a">Klik tautan</text><text x="642" y="214" font-size="15" fill="#13235a">Chat masuk</text><text x="642" y="238" font-size="15" fill="#13235a">Pertanyaan harga</text><line x1="886" y1="230" x2="908" y2="230" stroke="#4a5680" stroke-width="2"/><path d="M906 224 L916 230 L906 236 Z" fill="#4a5680"/><rect x="916" y="130" width="244" height="200" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="934" y="162" font-size="18" font-weight="700" fill="#c2581e">Dibeli</text><text x="934" y="190" font-size="15" fill="#13235a">Pesanan dari sosial</text><text x="934" y="214" font-size="15" fill="#13235a">Nilai penjualan</text><text x="934" y="238" font-size="15" fill="#13235a">Pelanggan baru</text><text x="40" y="400" font-size="17" fill="#13235a">Pilih satu KPI utama dari anak tangga yang paling dekat dengan tujuan bisnis saat ini.</text><text x="40" y="430" font-size="15" fill="#4a5680">Ilustrasi konsep Kelola Konten, bukan istilah resmi platform.</text>
</g>
</svg>
