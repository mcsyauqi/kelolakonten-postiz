<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
<title id="t">Ide konten akhir tahun menurut tujuan</title>
<desc id="d">Empat kolom tujuan konten: jualan, kedekatan, kepercayaan, tahun depan</desc>
<rect width="1200" height="380" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Ide konten akhir tahun menurut tujuan</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Empat tujuan, empat jenis konten</text>
<rect x="40" y="120" width="260" height="190" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="152" font-size="18" font-weight="700" fill="#c2581e">Jualan</text><text x="58" y="180" font-size="15" fill="#13235a">Promo 12.12 dan</text><text x="58" y="202" font-size="15" fill="#13235a">paket kado akhir</text><text x="58" y="224" font-size="15" fill="#13235a">tahun, batas order</text><text x="58" y="246" font-size="15" fill="#13235a">sebelum libur</text><rect x="325" y="120" width="260" height="190" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="343" y="152" font-size="18" font-weight="700" fill="#1f8a7a">Kedekatan</text><text x="343" y="180" font-size="15" fill="#13235a">Recap setahun,</text><text x="343" y="202" font-size="15" fill="#13235a">ucapan terima kasih,</text><text x="343" y="224" font-size="15" fill="#13235a">balik layar tim</text><rect x="610" y="120" width="260" height="190" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="628" y="152" font-size="18" font-weight="700" fill="#2457d6">Kepercayaan</text><text x="628" y="180" font-size="15" fill="#13235a">Testimoni terbaik,</text><text x="628" y="202" font-size="15" fill="#13235a">angka layanan,</text><text x="628" y="224" font-size="15" fill="#13235a">jadwal libur toko</text><rect x="895" y="120" width="260" height="190" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="913" y="152" font-size="18" font-weight="700" fill="#6a4fd1">Tahun depan</text><text x="913" y="180" font-size="15" fill="#13235a">Teaser produk,</text><text x="913" y="202" font-size="15" fill="#13235a">resolusi usaha,</text><text x="913" y="224" font-size="15" fill="#13235a">polling ide 2027</text><text x="40" y="350" font-size="17" fill="#13235a" font-weight="700" text-anchor="start">Pilih minimal satu ide dari tiap kolom supaya kalender Desember seimbang.</text>
</g>
</svg>
