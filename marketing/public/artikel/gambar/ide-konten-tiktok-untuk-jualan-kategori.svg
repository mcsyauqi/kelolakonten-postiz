<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 506" width="1200" height="506" role="img" aria-labelledby="t d">
<title id="t">Enam kelompok ide konten TikTok untuk jualan</title>
<desc id="d">Enam kelompok ide: pamer produk, edukasi, di balik layar, bukti pelanggan, promo, dan tren</desc>
<rect width="1200" height="506" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Enam kelompok ide konten TikTok untuk jualan</text><text x="40" y="82" font-size="17" fill="#4a5680">Pilih satu kelompok per hari supaya feed tidak monoton</text>
<rect x="30" y="110" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="60" cy="142" r="14" fill="#2457d6"/><text x="60" y="148" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="84" y="148" font-size="18" fill="#13235a" font-weight="700">Pamer produk</text><text x="50" y="184" font-size="15" fill="#33405f">Unboxing, close up detail,</text><text x="50" y="208" font-size="15" fill="#33405f">cara pakai 15 detik</text>
<rect x="416" y="110" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="446" cy="142" r="14" fill="#1f8a7a"/><text x="446" y="148" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="470" y="148" font-size="18" fill="#13235a" font-weight="700">Edukasi</text><text x="436" y="184" font-size="15" fill="#33405f">Tips, salah kaprah,</text><text x="436" y="208" font-size="15" fill="#33405f">perbandingan ukuran</text>
<rect x="802" y="110" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="832" cy="142" r="14" fill="#6a4fd1"/><text x="832" y="148" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="856" y="148" font-size="18" fill="#13235a" font-weight="700">Di balik layar</text><text x="822" y="184" font-size="15" fill="#33405f">Packing pesanan, produksi,</text><text x="822" y="208" font-size="15" fill="#33405f">hari sibuk toko</text>
<rect x="30" y="278" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="60" cy="310" r="14" fill="#c2581e"/><text x="60" y="316" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="84" y="316" font-size="18" fill="#13235a" font-weight="700">Bukti pelanggan</text><text x="50" y="352" font-size="15" fill="#33405f">Ulasan, video pembeli,</text><text x="50" y="376" font-size="15" fill="#33405f">jawab komentar</text>
<rect x="416" y="278" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="446" cy="310" r="14" fill="#13235a"/><text x="446" y="316" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="470" y="316" font-size="18" fill="#13235a" font-weight="700">Promo dan stok</text><text x="436" y="352" font-size="15" fill="#33405f">Restock, bundling,</text><text x="436" y="376" font-size="15" fill="#33405f">hitung mundur promo</text>
<rect x="802" y="278" width="366" height="150" rx="10" fill="#ffffff" stroke="#c9d4f2"/><circle cx="832" cy="310" r="14" fill="#2457d6"/><text x="832" y="316" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="856" y="316" font-size="18" fill="#13235a" font-weight="700">Tren dan hiburan</text><text x="822" y="352" font-size="15" fill="#33405f">Suara tren, POV,</text><text x="822" y="376" font-size="15" fill="#33405f">tantangan ringan</text>
<text x="40" y="484" font-size="15" fill="#4a5680">Ilustrasi konsep. Dibuat oleh Kelola Konten.</text>
