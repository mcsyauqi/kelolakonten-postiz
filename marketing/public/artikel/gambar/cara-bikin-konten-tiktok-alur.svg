<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="460" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Alur bikin konten TikTok dari ide sampai evaluasi</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Tujuh tahap yang bisa dikerjakan satu orang dengan satu HP</text>
<g font-size="16" fill="#13235a" text-anchor="middle">
<rect x="60" y="140" width="140" height="150" rx="16" fill="#fff" stroke="#13235a" stroke-width="3"/><text x="130" y="186" font-size="26" font-weight="700" fill="#13235a">1</text><text x="130" y="222" font-weight="700">Ide</text><text x="130" y="248">dari pertanyaan</text><text x="130" y="268">pelanggan</text>
<rect x="216" y="140" width="140" height="150" rx="16" fill="#fff" stroke="#2457d6" stroke-width="3"/><text x="286" y="186" font-size="26" font-weight="700" fill="#2457d6">2</text><text x="286" y="222" font-weight="700">Format</text><text x="286" y="248">tips, proses,</text><text x="286" y="268">ulasan, tren</text>
<rect x="372" y="140" width="140" height="150" rx="16" fill="#fff" stroke="#6a4fd1" stroke-width="3"/><text x="442" y="186" font-size="26" font-weight="700" fill="#6a4fd1">3</text><text x="442" y="222" font-weight="700">Naskah</text><text x="442" y="248">hook, isi,</text><text x="442" y="268">ajakan</text>
<rect x="528" y="140" width="140" height="150" rx="16" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><text x="598" y="186" font-size="26" font-weight="700" fill="#1f8a7a">4</text><text x="598" y="222" font-weight="700">Rekam</text><text x="598" y="248">vertikal, cahaya</text><text x="598" y="268">dan suara jelas</text>
<rect x="684" y="140" width="140" height="150" rx="16" fill="#fff" stroke="#c2581e" stroke-width="3"/><text x="754" y="186" font-size="26" font-weight="700" fill="#c2581e">5</text><text x="754" y="222" font-weight="700">Edit</text><text x="754" y="248">potong, teks,</text><text x="754" y="268">suara, efek</text>
<rect x="840" y="140" width="140" height="150" rx="16" fill="#fff" stroke="#2457d6" stroke-width="3"/><text x="910" y="186" font-size="26" font-weight="700" fill="#2457d6">6</text><text x="910" y="222" font-weight="700">Unggah</text><text x="910" y="248">deskripsi, tagar,</text><text x="910" y="268">atau jadwalkan</text>
<rect x="996" y="140" width="144" height="150" rx="16" fill="#fff" stroke="#13235a" stroke-width="3"/><text x="1068" y="186" font-size="26" font-weight="700" fill="#13235a">7</text><text x="1068" y="222" font-weight="700">Evaluasi</text><text x="1068" y="248">baca analitik,</text><text x="1068" y="268">ulangi yang jalan</text>
</g>
<path d="M1068 300 C1068 380 130 380 130 300" fill="none" stroke="#13235a" stroke-width="2.5" stroke-dasharray="7 7"/>
<polygon points="122,306 130,292 138,306" fill="#13235a"/>
<text x="600" y="420" font-size="17" fill="#3b4a7a" text-anchor="middle">Hasil evaluasi menjadi bahan ide berikutnya, jadi alur ini berputar setiap minggu.</text>
</svg>
