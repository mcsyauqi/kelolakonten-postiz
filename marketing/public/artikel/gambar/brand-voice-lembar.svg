<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
<title id="t">Panduan brand voice satu halaman</title>
<desc id="d">Lima kotak panduan: siapa kita, tiga sifat suara, kata yang dipakai dan dihindari, contoh sebelum dan sesudah, serta aturan per kanal.</desc>
<rect width="1200" height="460" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Panduan brand voice satu halaman</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Lima bagian yang cukup untuk tim kecil</text>
<rect x="40" y="116" width="360" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="148" font-size="18" font-weight="700" fill="#2457d6">Siapa kita</text><text x="58" y="176" font-size="15" fill="#13235a">Satu kalimat tentang merek</text><text x="58" y="200" font-size="15" fill="#13235a">dan pembacanya</text><rect x="420" y="116" width="360" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="438" y="148" font-size="18" font-weight="700" fill="#2457d6">Tiga sifat suara</text><text x="438" y="176" font-size="15" fill="#13235a">Kami X, tetapi tidak Y</text><text x="438" y="200" font-size="15" fill="#13235a">Ditulis berpasangan</text><rect x="800" y="116" width="360" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="818" y="148" font-size="18" font-weight="700" fill="#2457d6">Pilihan kata</text><text x="818" y="176" font-size="15" fill="#13235a">Sapaan yang dipakai</text><text x="818" y="200" font-size="15" fill="#13235a">Kata yang dihindari</text><rect x="40" y="276" width="550" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="308" font-size="18" font-weight="700" fill="#2457d6">Contoh sebelum dan sesudah</text><text x="58" y="336" font-size="15" fill="#13235a">Tiga kalimat nyata</text><text x="58" y="360" font-size="15" fill="#13235a">yang ditulis ulang</text><rect x="610" y="276" width="550" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="628" y="308" font-size="18" font-weight="700" fill="#2457d6">Aturan per kanal</text><text x="628" y="336" font-size="15" fill="#13235a">Instagram, TikTok, WhatsApp, email</text><text x="628" y="360" font-size="15" fill="#13235a">Nada dan batas emoji</text>
</g>
</svg>
