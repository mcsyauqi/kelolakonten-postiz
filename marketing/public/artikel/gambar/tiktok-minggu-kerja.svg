<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="486" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Contoh minggu kerja TikTok untuk kedai kopi fiktif</text>
<rect x="60" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="100" width="10" height="145" rx="5" fill="#2457d6"/>
<text font-size="20" font-weight="700" fill="#2457d6"><tspan x="88" y="140">Senin: brief</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="179">Pilih topik dari pertanyaan</tspan><tspan x="88" y="202">pelanggan, tulis brief per video.</tspan></text>
<rect x="429.3333333333333" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="429.3333333333333" y="100" width="10" height="145" rx="5" fill="#1f8a7a"/>
<text font-size="20" font-weight="700" fill="#1f8a7a"><tspan x="457.3333333333333" y="140">Selasa: rekam</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="457.3333333333333" y="179">Rekam semua video dalam satu sesi</tspan><tspan x="457.3333333333333" y="202">dan cahaya yang sama.</tspan></text>
<rect x="798.6666666666666" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="798.6666666666666" y="100" width="10" height="145" rx="5" fill="#6a4fd1"/>
<text font-size="20" font-weight="700" fill="#6a4fd1"><tspan x="826.6666666666666" y="140">Rabu: sunting</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="826.6666666666666" y="179">Tambah teks, cek durasi terhadap</tspan><tspan x="826.6666666666666" y="202">batas akun.</tspan></text>
<rect x="60" y="273" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="273" width="10" height="145" rx="5" fill="#13235a"/>
<text font-size="20" font-weight="700" fill="#13235a"><tspan x="88" y="313">Kamis: review</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="352">Pemilik usaha memeriksa isi,</tspan><tspan x="88" y="375">caption, dan privasi.</tspan></text>
<rect x="429.3333333333333" y="273" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="429.3333333333333" y="273" width="10" height="145" rx="5" fill="#c2581e"/>
<text font-size="20" font-weight="700" fill="#c2581e"><tspan x="457.3333333333333" y="313">Jumat: tayang</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="457.3333333333333" y="352">Tayangkan atau serahkan berkas</tspan><tspan x="457.3333333333333" y="375">untuk diposting manual.</tspan></text>
<rect x="798.6666666666666" y="273" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="798.6666666666666" y="273" width="10" height="145" rx="5" fill="#7a849e"/>
<text font-size="20" font-weight="700" fill="#7a849e"><tspan x="826.6666666666666" y="313">Sabtu: catat</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="826.6666666666666" y="352">Simpan link video dan pertanyaan</tspan><tspan x="826.6666666666666" y="375">dari komentar.</tspan></text>
<text x="60" y="462" font-size="17" fill="#4a5578">Contoh rekaan. Jumlah video per pekan menyesuaikan kapasitas tim, bukan angka wajib.</text>
</svg>
