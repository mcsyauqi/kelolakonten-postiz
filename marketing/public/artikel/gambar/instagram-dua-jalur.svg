<text font-size="17"  fill="#3a466b"><tspan x="360" y="170">Tidak perlu</tspan></text>
<text font-size="17"  fill="#3a466b"><tspan x="740" y="170">Akun tertaut ke Halaman, akses setara</tspan><tspan x="740" y="193">admin</tspan></text>
<line x1="60" y1="208" x2="1140" y2="208" stroke="#d7def0" stroke-width="1"/>
