<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Lima tahap audit akun Instagram dalam 30 menit</title>
<desc id="d">Urutan audit: profil 5 menit, kesehatan akun 5 menit, konten 10 menit, insight 7 menit, rencana perbaikan 3 menit</desc>
<rect width="1200" height="340" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Audit akun Instagram dalam 30 menit</text><text x="40" y="82" font-size="17" fill="#4a5680">Kerjakan berurutan, catat temuan di satu lembar</text>
<rect x="30" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="30" y="130" width="208" height="8" rx="4" fill="#2457d6"/><text x="46" y="172" font-size="18" fill="#2457d6" font-weight="700">1. Profil</text><text x="46" y="204" font-size="15" fill="#13235a">Nama, bio, foto,</text><text x="46" y="228" font-size="15" fill="#13235a">link: 5 menit</text><path d="M242 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/><rect x="263" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="263" y="130" width="208" height="8" rx="4" fill="#1f8a7a"/><text x="279" y="172" font-size="18" fill="#1f8a7a" font-weight="700">2. Kesehatan akun</text><text x="279" y="204" font-size="15" fill="#13235a">Account Status:</text><text x="279" y="228" font-size="15" fill="#13235a">5 menit</text><path d="M475 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/><rect x="496" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="496" y="130" width="208" height="8" rx="4" fill="#6a4fd1"/><text x="512" y="172" font-size="18" fill="#6a4fd1" font-weight="700">3. Konten</text><text x="512" y="204" font-size="15" fill="#13235a">12 posting terakhir:</text><text x="512" y="228" font-size="15" fill="#13235a">10 menit</text><path d="M708 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/><rect x="729" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="729" y="130" width="208" height="8" rx="4" fill="#c2581e"/><text x="745" y="172" font-size="18" fill="#c2581e" font-weight="700">4. Insight</text><text x="745" y="204" font-size="15" fill="#13235a">Jangkauan dan</text><text x="745" y="228" font-size="15" fill="#13235a">interaksi: 7 menit</text><path d="M941 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/><rect x="962" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="962" y="130" width="208" height="8" rx="4" fill="#13235a"/><text x="978" y="172" font-size="18" fill="#13235a" font-weight="700">5. Rencana</text><text x="978" y="204" font-size="15" fill="#13235a">Tiga perbaikan</text><text x="978" y="228" font-size="15" fill="#13235a">prioritas: 3 menit</text>
<text x="40" y="310" font-size="15" fill="#4a5680">Pembagian waktu adalah saran Kelola Konten, bukan aturan Instagram. Dibuat oleh Kelola Konten.</text>
</g></svg>