<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="580" fill="#f4f7ff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13235a"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a4fd1"/></marker></defs>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Dari brief ke jadwal: lima tahap, satu arah</text>
<g font-size="21" font-weight="700" fill="#fff" text-anchor="middle">
<rect x="60" y="170" width="192" height="150" rx="18" fill="#2457d6"/><text x="156" y="225">1. Brief</text>
<rect x="282" y="170" width="192" height="150" rx="18" fill="#1f8a7a"/><text x="378" y="225">2. Draft</text>
<rect x="504" y="170" width="192" height="150" rx="18" fill="#6a4fd1"/><text x="600" y="225">3. Approval</text>
<rect x="726" y="170" width="192" height="150" rx="18" fill="#13235a"/><text x="822" y="225">4. Jadwal</text>
<rect x="948" y="170" width="192" height="150" rx="18" fill="#c2581e"/><text x="1044" y="225">5. Evaluasi</text>
</g>
<g font-size="16" fill="#eef2ff" text-anchor="middle">
<text x="156" y="260">disetujui sebelum</text><text x="156" y="282">produksi dimulai</text>
<text x="378" y="260">dibuat sesuai</text><text x="378" y="282">isi brief</text>
<text x="600" y="260">dicek terhadap</text><text x="600" y="282">brief, bukan selera</text>
<text x="822" y="260">masuk kalender</text><text x="822" y="282">di slot yang tepat</text>
<text x="1044" y="260">metrik di brief</text><text x="1044" y="282">dibandingkan hasil</text>
</g>
<g stroke="#13235a" stroke-width="3" marker-end="url(#a)"><line x1="254" y1="245" x2="276" y2="245"/><line x1="476" y1="245" x2="498" y2="245"/><line x1="698" y1="245" x2="720" y2="245"/><line x1="920" y1="245" x2="942" y2="245"/></g>
<path d="M600 166 C600 112 378 112 378 162" stroke="#6a4fd1" stroke-width="3" fill="none" marker-end="url(#b)"/>
<text x="489" y="104" font-size="17" fill="#6a4fd1" text-anchor="middle">revisi kembali ke draft</text>
<path d="M1044 324 C1044 450 156 450 156 330" stroke="#13235a" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/>
<text x="600" y="476" font-size="19" fill="#13235a" text-anchor="middle">Hasil evaluasi menjadi bahan brief berikutnya</text>
<text x="60" y="540" font-size="18" fill="#4a5578">Brief yang berubah di tengah jalan diperbarui dulu dan disetujui ulang, baru draft dilanjutkan.</text>
</svg>
