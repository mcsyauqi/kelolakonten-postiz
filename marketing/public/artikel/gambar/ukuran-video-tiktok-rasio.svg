<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d"><title id="t">Tiga rasio video yang diterima TikTok</title><desc id="d">Bingkai 9:16 vertikal (disarankan, minimum 540x960 px), 1:1 persegi (minimum 640x640 px), dan 16:9 horizontal (minimum 960x540 px), dengan contoh ukuran ekspor 1080x1920, 1080x1080, dan 1920x1080.</desc><rect width="1200" height="720" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Tiga rasio video yang diterima TikTok</text><rect x="83.125" y="140" width="213.75" height="380" rx="14" fill="#ffffff" stroke="#1f8a7a" stroke-width="4"/><polygon points="174,310 174,350 210,330" fill="#1f8a7a"/><text x="190" y="560" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#1f8a7a" font-weight="800" text-anchor="middle">9:16 vertikal</text><text x="190" y="586" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">disarankan</text><text x="190" y="614" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="800" text-anchor="middle">min. 540 x 960 px</text><text x="190" y="640" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">contoh ekspor 1080 x 1920 px</text><rect x="442.2" y="284.4" width="235.6" height="235.6" rx="14" fill="#ffffff" stroke="#6a4fd1" stroke-width="4"/><polygon points="544,382.2 544,422.2 580,402.2" fill="#6a4fd1"/><text x="560" y="560" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#6a4fd1" font-weight="800" text-anchor="middle">1:1 persegi</text><text x="560" y="586" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">didukung</text><text x="560" y="614" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="800" text-anchor="middle">min. 640 x 640 px</text><text x="560" y="640" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">contoh ekspor 1080 x 1080 px</text><rect x="789" y="327.625" width="342" height="192.375" rx="14" fill="#ffffff" stroke="#c2581e" stroke-width="4"/><polygon points="944,403.8125 944,443.8125 980,423.8125" fill="#c2581e"/><text x="960" y="560" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#c2581e" font-weight="800" text-anchor="middle">16:9 horizontal</text><text x="960" y="586" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">didukung</text><text x="960" y="614" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="800" text-anchor="middle">min. 960 x 540 px</text><text x="960" y="640" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">contoh ekspor 1920 x 1080 px</text><text x="600" y="690" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">Batas minimum dari spesifikasi iklan In-Feed TikTok (Non-Spark). Ukuran ekspor contoh adalah praktik umum, bukan syarat.</text></svg>
