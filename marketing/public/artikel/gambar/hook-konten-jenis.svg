<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 504" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="504" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Delapan jenis hook untuk konten bisnis</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Pilih satu jenis per video, lalu uji jenis lain di video berikutnya</text>
<rect x="60" y="130" width="252" height="150" rx="16" fill="#13235a"/>
<text x="82" y="170" font-size="20" font-weight="700" fill="#fff">Pertanyaan</text>
<text x="82" y="202" font-size="15" fill="#fff">"Kenapa kopi susu Anda</text>
<text x="82" y="223" font-size="15" fill="#fff">cepat basi?"</text>
<rect x="336" y="130" width="252" height="150" rx="16" fill="#2457d6"/>
<text x="358" y="170" font-size="20" font-weight="700" fill="#fff">Masalah</text>
<text x="358" y="202" font-size="15" fill="#fff">Sebut masalah yang</text>
<text x="358" y="223" font-size="15" fill="#fff">dialami penonton</text>
<rect x="612" y="130" width="252" height="150" rx="16" fill="#1f8a7a"/>
<text x="634" y="170" font-size="20" font-weight="700" fill="#fff">Hasil dulu</text>
<text x="634" y="202" font-size="15" fill="#fff">Tunjukkan hasil akhir,</text>
<text x="634" y="223" font-size="15" fill="#fff">lalu mundur ke proses</text>
<rect x="888" y="130" width="252" height="150" rx="16" fill="#6a4fd1"/>
<text x="910" y="170" font-size="20" font-weight="700" fill="#fff">Kesalahan umum</text>
<text x="910" y="202" font-size="15" fill="#fff">"Tiga kesalahan saat</text>
<text x="910" y="223" font-size="15" fill="#fff">memotret produk"</text>
<rect x="60" y="304" width="252" height="150" rx="16" fill="#c2581e"/>
<text x="82" y="344" font-size="20" font-weight="700" fill="#fff">Angka konkret</text>
<text x="82" y="376" font-size="15" fill="#fff">Jumlah langkah, waktu,</text>
<text x="82" y="397" font-size="15" fill="#fff">atau biaya yang nyata</text>
<rect x="336" y="304" width="252" height="150" rx="16" fill="#13235a"/>
<text x="358" y="344" font-size="20" font-weight="700" fill="#fff">Sebelum sesudah</text>
<text x="358" y="376" font-size="15" fill="#fff">Perbedaan yang terlihat</text>
<text x="358" y="397" font-size="15" fill="#fff">dalam satu potongan</text>
<rect x="612" y="304" width="252" height="150" rx="16" fill="#2457d6"/>
<text x="634" y="344" font-size="20" font-weight="700" fill="#fff">Cerita singkat</text>
<text x="634" y="376" font-size="15" fill="#fff">"Minggu lalu pelanggan</text>
<text x="634" y="397" font-size="15" fill="#fff">kami bertanya..."</text>
<rect x="888" y="304" width="252" height="150" rx="16" fill="#1f8a7a"/>
<text x="910" y="344" font-size="20" font-weight="700" fill="#fff">Kontras</text>
<text x="910" y="376" font-size="15" fill="#fff">Membantah anggapan</text>
<text x="910" y="397" font-size="15" fill="#fff">yang umum dipercaya</text>
</svg>
