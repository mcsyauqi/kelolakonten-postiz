<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 479" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="479" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Empat pemeriksaan sebelum menekan tombol jadwal</text>
<rect x="60" y="100" width="526" height="168" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="100" width="10" height="168" rx="5" fill="#2457d6"/>
<text font-size="20" font-weight="700" fill="#2457d6"><tspan x="88" y="140">Format JPEG</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="179">Gambar sudah diekspor ke JPEG, bukan PNG atau format</tspan><tspan x="88" y="202">JPEG yang diperluas.</tspan></text>
<rect x="614" y="100" width="526" height="168" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="614" y="100" width="10" height="168" rx="5" fill="#1f8a7a"/>
<text font-size="20" font-weight="700" fill="#1f8a7a"><tspan x="642" y="140">Caption dan link</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="642" y="179">Ejaan, harga, dan link sudah dicek pemilik fakta.</tspan><tspan x="642" y="202">Tidak ada tag produk yang hanya bisa dipasang di</tspan><tspan x="642" y="225">aplikasi.</tspan></text>
<rect x="60" y="296" width="526" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="296" width="10" height="145" rx="5" fill="#6a4fd1"/>
<text font-size="20" font-weight="700" fill="#6a4fd1"><tspan x="88" y="336">Izin akun</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="375">Akun profesional terhubung, dan Otorisasi Penerbitan</tspan><tspan x="88" y="398">Halaman sudah selesai bila diwajibkan.</tspan></text>
<rect x="614" y="296" width="526" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="614" y="296" width="10" height="145" rx="5" fill="#c2581e"/>
<text font-size="20" font-weight="700" fill="#c2581e"><tspan x="642" y="336">Zona waktu</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="642" y="375">Jam tayang ditulis dalam WIB dan sama dengan yang</tspan><tspan x="642" y="398">tertulis di kalender tim.</tspan></text>
</svg>
