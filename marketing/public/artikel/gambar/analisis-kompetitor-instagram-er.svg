<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">Contoh membandingkan engagement rate tiga akun kompetitor dengan akun sendiri</title><desc id="d">Diagram batang contoh berlabel: akun sendiri 1,8 persen, kompetitor A 3,1 persen, kompetitor B 2,4 persen, kompetitor C 0,9 persen, dihitung dari rata-rata like dan komentar 12 posting terakhir dibagi jumlah pengikut</desc><rect width="1200" height="470" fill="#f4f7ff"/><path d="M220 70V370H1140" stroke="#4a5680" stroke-width="2" fill="none"/><path d="M220 370H1140" stroke="#c9d4f2" stroke-width="1.5" stroke-dasharray="5 6"/><text x="208" y="376" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="end">0%</text><path d="M220 284.2857142857143H1140" stroke="#c9d4f2" stroke-width="1.5" stroke-dasharray="5 6"/><text x="208" y="290.2857142857143" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="end">1%</text><path d="M220 198.57142857142858H1140" stroke="#c9d4f2" stroke-width="1.5" stroke-dasharray="5 6"/><text x="208" y="204.57142857142858" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="end">2%</text><path d="M220 112.85714285714289H1140" stroke="#c9d4f2" stroke-width="1.5" stroke-dasharray="5 6"/><text x="208" y="118.85714285714289" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#4a5680" font-weight="500" text-anchor="end">3%</text><rect x="280" y="215.7142857142857" width="150" height="154.2857142857143" rx="8" fill="#2457d6"/><text x="355" y="203.7142857142857" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="middle">1,8%</text><text x="355" y="400" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Akun Anda</text><rect x="505" y="104.28571428571428" width="150" height="265.7142857142857" rx="8" fill="#1f8a7a"/><text x="580" y="92.28571428571428" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="middle">3,1%</text><text x="580" y="400" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Kompetitor A</text><rect x="730" y="164.28571428571428" width="150" height="205.71428571428572" rx="8" fill="#6a4fd1"/><text x="805" y="152.28571428571428" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="middle">2,4%</text><text x="805" y="400" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Kompetitor B</text><rect x="955" y="292.85714285714283" width="150" height="77.14285714285715" rx="8" fill="#c2581e"/><text x="1030" y="280.85714285714283" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="middle">0,9%</text><text x="1030" y="400" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Kompetitor C</text><rect x="40" y="120" width="140" height="150" rx="12" fill="#fff" stroke="#c9d4f2" stroke-width="2"/><text x="110" y="150" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#c2581e" font-weight="800" text-anchor="middle">CONTOH</text><text x="110" y="180" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="middle">angka</text><text x="110" y="202" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="middle">rekaan untuk</text><text x="110" y="224" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="600" text-anchor="middle">latihan</text><text x="40" y="450" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="400" text-anchor="start">Rumus: (rata-rata like + komentar per posting) / pengikut x 100, dari 12 posting terakhir. Angka contoh, bukan data akun nyata. Diagram Kelola Konten.</text></svg>
