<text x="620" y="180" font-weight="700">1. Kotak tengah</text><text x="620" y="206">Bagian persegi di tengah kanvas adalah area</text><text x="620" y="230">yang paling mungkin terlihat saat dipotong.</text>
<text x="620" y="280" font-weight="700">2. Lingkaran</text><text x="620" y="306">Cover tampil bulat di profil, jadi sudut</text><text x="620" y="330">persegi ikut terpotong.</text>
<text x="620" y="380" font-weight="700">3. Ikon di lingkaran dalam</text><text x="620" y="406">Garis putus-putus: tempat ikon agar tidak</text><text x="620" y="430">terlalu mepet ke tepi lingkaran.</text>
