<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 346" width="1200" height="346" role="img" aria-labelledby="t d">
<title id="t">Satu ide bisa menghasilkan enam konten</title>
<desc id="d">Satu ide utama dipecah menjadi Reels, TikTok, carousel, Stories, unggahan Facebook, dan video YouTube Shorts.</desc>
<rect width="1200" height="346" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Satu ide bisa menghasilkan enam konten</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Contoh ide: &quot;tiga kesalahan menyimpan kopi bubuk&quot;</text>
<rect x="40" y="116" width="357" height="172" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="58" y="152" font-size="19" fill="#2457d6" font-weight="700">Video vertikal</text><circle cx="64" cy="179" r="4" fill="#2457d6"/><text x="78" y="184" font-size="16" fill="#13235a">Reels: tiga kesalahan, 30 detik</text><circle cx="64" cy="211" r="4" fill="#2457d6"/><text x="78" y="216" font-size="16" fill="#13235a">TikTok: versi lebih santai</text><circle cx="64" cy="243" r="4" fill="#2457d6"/><text x="78" y="248" font-size="16" fill="#13235a">YouTube Shorts: fokus satu kesalahan</text><rect x="421" y="116" width="357" height="172" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="439" y="152" font-size="19" fill="#2457d6" font-weight="700">Gambar dan teks</text><circle cx="445" cy="179" r="4" fill="#2457d6"/><text x="459" y="184" font-size="16" fill="#13235a">Carousel: satu kesalahan per slide</text><circle cx="445" cy="211" r="4" fill="#2457d6"/><text x="459" y="216" font-size="16" fill="#13235a">Unggahan Facebook: cerita pelanggan</text><circle cx="445" cy="243" r="4" fill="#2457d6"/><text x="459" y="248" font-size="16" fill="#13235a">Caption panjang: alasan di baliknya</text><rect x="802" y="116" width="357" height="172" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="820" y="152" font-size="19" fill="#2457d6" font-weight="700">Interaksi</text><circle cx="826" cy="179" r="4" fill="#2457d6"/><text x="840" y="184" font-size="16" fill="#13235a">Stories: polling kesalahan terbanyak</text><circle cx="826" cy="211" r="4" fill="#2457d6"/><text x="840" y="216" font-size="16" fill="#13235a">Balasan komentar jadi video baru</text><circle cx="826" cy="243" r="4" fill="#2457d6"/><text x="840" y="248" font-size="16" fill="#13235a">Status WhatsApp: tips singkat</text><text x="40" y="326" font-size="16" fill="#4a5680">Daftar ini contoh, bukan kewajiban. Pilih dua atau tiga format yang memang dipakai pembeli Anda.</text>
</g>
</svg>
