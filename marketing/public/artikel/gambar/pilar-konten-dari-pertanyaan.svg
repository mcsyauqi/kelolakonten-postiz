<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 312" width="1200" height="312" role="img" aria-labelledby="t d">
<title id="t">Dari pertanyaan pelanggan menjadi calon pilar</title>
<desc id="d">Alur empat langkah: kumpulkan 30 sampai 50 pertanyaan, kelompokkan menurut kemiripan, beri nama kelompok, lalu tetapkan calon pilar.</desc>
<rect width="1200" height="312" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Dari pertanyaan pelanggan menjadi calon pilar</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Empat langkah memakai data dua bulan terakhir</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2457d6"/></marker></defs><rect x="40" y="120" width="254" height="152" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="56" y="150" font-size="18" fill="#2457d6" font-weight="700">1</text><text x="56" y="176" font-size="18" fill="#13235a" font-weight="700">Kumpulkan</text><text x="56" y="204" font-size="16" fill="#4a5680">30 sampai 50 pertanyaan</text><text x="56" y="225.12" font-size="16" fill="#4a5680">atau keluhan dari dua</text><text x="56" y="246.24" font-size="16" fill="#4a5680">bulan terakhir.</text><line x1="298" y1="196" x2="324" y2="196" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="328" y="120" width="254" height="152" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="344" y="150" font-size="18" fill="#2457d6" font-weight="700">2</text><text x="344" y="176" font-size="18" fill="#13235a" font-weight="700">Kelompokkan</text><text x="344" y="204" font-size="16" fill="#4a5680">Satukan yang mirip: cara</text><text x="344" y="225.12" font-size="16" fill="#4a5680">pakai, harga dan kirim,</text><text x="344" y="246.24" font-size="16" fill="#4a5680">kepercayaan, pilihan.</text><line x1="586" y1="196" x2="612" y2="196" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="616" y="120" width="254" height="152" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="632" y="150" font-size="18" fill="#2457d6" font-weight="700">3</text><text x="632" y="176" font-size="18" fill="#13235a" font-weight="700">Beri nama</text><text x="632" y="204" font-size="16" fill="#4a5680">Pakai bahasa yang dipahami</text><text x="632" y="225.12" font-size="16" fill="#4a5680">tim.</text><line x1="874" y1="196" x2="900" y2="196" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="904" y="120" width="254" height="152" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="920" y="150" font-size="18" fill="#2457d6" font-weight="700">4</text><text x="920" y="176" font-size="18" fill="#13235a" font-weight="700">Tetapkan calon</text><text x="920" y="204" font-size="16" fill="#4a5680">Kelompok terbesar menjadi</text><text x="920" y="225.12" font-size="16" fill="#4a5680">calon pilar.</text>
</g>
</svg>
