<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Komposisi thumbnail: pojok yang tertutup dan ukuran kecil</title><desc id="d">Kiri: bingkai thumbnail 16:9 dengan subjek utama, teks pendek, dan pojok kanan bawah yang tertutup label durasi. Kanan: tampilan daftar video di ponsel tempat thumbnail tampil kecil.</desc><rect width="1200" height="640" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Komposisi thumbnail: pojok yang tertutup dan ukuran kecil</text><rect x="60" y="100" width="640" height="360" rx="10" fill="#ffffff" stroke="#13235a" stroke-width="3"/><rect x="100" y="140" width="300" height="280" rx="10" fill="#e3f4f1" stroke="#1f8a7a" stroke-width="2"/><text x="250" y="290" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#1f8a7a" font-weight="800" text-anchor="middle">subjek utama</text><rect x="430" y="160" width="230" height="70" rx="8" fill="#e8edff" stroke="#2457d6" stroke-width="2"/><text x="545" y="204" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#2457d6" font-weight="800" text-anchor="middle">teks 2 sampai 4 kata</text><rect x="590" y="410" width="92" height="34" rx="6" fill="#13235a"/><text x="636" y="433" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">12:34</text><rect x="530" y="380" width="160" height="72" rx="8" fill="none" stroke="#c2581e" stroke-width="3" stroke-dasharray="8 6"/><text x="610" y="494" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#c2581e" font-weight="700" text-anchor="middle">pojok label durasi</text><rect x="800" y="100" width="330" height="360" rx="22" fill="#ffffff" stroke="#3b4a6b" stroke-width="2"/><rect x="822" y="130" width="150" height="84" rx="6" fill="#e3f4f1" stroke="#1f8a7a" stroke-width="2"/><rect x="986" y="138" width="120" height="12" rx="6" fill="#cdd7ef"/><rect x="986" y="160" width="90" height="12" rx="6" fill="#cdd7ef"/><rect x="822" y="238" width="150" height="84" rx="6" fill="#e8edff" stroke="#cdd7ef" stroke-width="2"/><rect x="986" y="246" width="120" height="12" rx="6" fill="#cdd7ef"/><rect x="986" y="268" width="90" height="12" rx="6" fill="#cdd7ef"/><rect x="822" y="346" width="150" height="84" rx="6" fill="#e8edff" stroke="#cdd7ef" stroke-width="2"/><rect x="986" y="354" width="120" height="12" rx="6" fill="#cdd7ef"/><rect x="986" y="376" width="90" height="12" rx="6" fill="#cdd7ef"/><text x="965" y="495" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">Di daftar hasil HP, thumbnail</text><text x="965" y="517" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">tampil jauh lebih kecil</text><text x="600" y="610" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="700" text-anchor="middle">Taruh subjek dan teks di area lain, lalu cek desain dalam ukuran kecil sebelum diunggah.</text></svg>
