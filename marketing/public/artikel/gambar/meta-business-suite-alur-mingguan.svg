<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d"><title id="t">Alur mingguan tim kecil memakai Meta Business Suite</title><desc id="d">Garis waktu Senin sampai Minggu: Senin menulis draf, Selasa menjadwalkan dengan Opsi penjadwalan, Rabu sampai Jumat membalas di Kotak Masuk, Sabtu membaca insight, Minggu mencatat ide untuk minggu depan</desc><rect width="1200" height="430" fill="#f4f7ff"/><path d="M80 200H1120" stroke="#c9d4f2" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="200" r="22" fill="#2457d6"/><text x="110" y="150" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#2457d6" font-weight="800" text-anchor="middle">Sen</text><rect x="10" y="245" width="200" height="96" rx="14" fill="#fff" stroke="#2457d6" stroke-width="3"/><text x="110" y="285" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="middle">Tulis draf</text><text x="110" y="315" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="600" text-anchor="middle">Selesaikan nanti</text><circle cx="355" cy="200" r="22" fill="#1f8a7a"/><text x="355" y="150" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#1f8a7a" font-weight="800" text-anchor="middle">Sel</text><rect x="255" y="245" width="200" height="96" rx="14" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><text x="355" y="285" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="middle">Jadwalkan</text><text x="355" y="315" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="600" text-anchor="middle">Opsi penjadwalan</text><circle cx="600" cy="200" r="22" fill="#6a4fd1"/><text x="600" y="150" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#6a4fd1" font-weight="800" text-anchor="middle">Rab sampai Jum</text><rect x="500" y="245" width="200" height="96" rx="14" fill="#fff" stroke="#6a4fd1" stroke-width="3"/><text x="600" y="285" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="middle">Balas pesan</text><text x="600" y="315" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="600" text-anchor="middle">Kotak Masuk</text><circle cx="845" cy="200" r="22" fill="#c2581e"/><text x="845" y="150" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#c2581e" font-weight="800" text-anchor="middle">Sab</text><rect x="745" y="245" width="200" height="96" rx="14" fill="#fff" stroke="#c2581e" stroke-width="3"/><text x="845" y="285" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="middle">Baca insight</text><text x="845" y="315" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="600" text-anchor="middle">tab Insight</text><circle cx="1090" cy="200" r="22" fill="#4a5680"/><text x="1090" y="150" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#4a5680" font-weight="800" text-anchor="middle">Min</text><rect x="990" y="245" width="200" height="96" rx="14" fill="#fff" stroke="#4a5680" stroke-width="3"/><text x="1090" y="285" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="middle">Catat ide</text><text x="1090" y="315" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="600" text-anchor="middle">untuk minggu depan</text><text x="40" y="400" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#4a5680" font-weight="400" text-anchor="start">Nama tombol mengikuti Pusat Bantuan Bisnis Meta versi bahasa Indonesia. Pembagian hari adalah contoh, sesuaikan dengan tim.</text></svg>
