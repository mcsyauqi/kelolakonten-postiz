<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="520" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Kerangka carousel edukasi tujuh slide</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Titik awal yang bisa disesuaikan dengan panjang materi</text>
<g font-size="16" fill="#fff">
<rect x="60" y="136" width="140" height="175" rx="12" fill="#13235a"/><text x="76" y="166" font-size="15" font-weight="700">SLIDE 1</text><text x="76" y="200" font-weight="700">Pembuka</text><text x="76" y="232">masalah</text><text x="76" y="254">atau janji</text><text x="76" y="276">hasil</text>
<rect x="216" y="136" width="140" height="175" rx="12" fill="#2457d6"/><text x="232" y="166" font-size="15" font-weight="700">SLIDE 2</text><text x="232" y="200" font-weight="700">Konteks</text><text x="232" y="232">kenapa</text><text x="232" y="254">sering</text><text x="232" y="276">terjadi</text>
<rect x="372" y="136" width="140" height="175" rx="12" fill="#1f8a7a"/><text x="388" y="166" font-size="15" font-weight="700">SLIDE 3</text><text x="388" y="200" font-weight="700">Langkah 1</text><text x="388" y="232">satu poin,</text><text x="388" y="254">satu foto</text>
<rect x="528" y="136" width="140" height="175" rx="12" fill="#1f8a7a"/><text x="544" y="166" font-size="15" font-weight="700">SLIDE 4</text><text x="544" y="200" font-weight="700">Langkah 2</text><text x="544" y="232">satu poin,</text><text x="544" y="254">satu foto</text>
<rect x="684" y="136" width="140" height="175" rx="12" fill="#1f8a7a"/><text x="700" y="166" font-size="15" font-weight="700">SLIDE 5</text><text x="700" y="200" font-weight="700">Langkah 3</text><text x="700" y="232">satu poin,</text><text x="700" y="254">satu foto</text>
<rect x="840" y="136" width="140" height="175" rx="12" fill="#6a4fd1"/><text x="856" y="166" font-size="15" font-weight="700">SLIDE 6</text><text x="856" y="200" font-weight="700">Ringkasan</text><text x="856" y="232">semua</text><text x="856" y="254">langkah</text><text x="856" y="276">di satu slide</text>
<rect x="996" y="136" width="144" height="175" rx="12" fill="#c2581e"/><text x="1012" y="166" font-size="15" font-weight="700">SLIDE 7</text><text x="1012" y="200" font-weight="700">Penutup</text><text x="1012" y="232">satu ajakan</text><text x="1012" y="254">dan nama</text><text x="1012" y="276">akun</text>
</g>
<rect x="372" y="330" width="452" height="44" rx="10" fill="#fff" stroke="#1f8a7a" stroke-width="2"/><text x="598" y="358" font-size="16" fill="#13235a" text-anchor="middle">inti: satu langkah per slide</text>
<rect x="840" y="330" width="140" height="44" rx="10" fill="#fff" stroke="#6a4fd1" stroke-width="2"/><text x="910" y="358" font-size="16" fill="#13235a" text-anchor="middle">alasan disimpan</text>
<text x="60" y="440" font-size="17" fill="#13235a">Teks besar dan sedikit kata di slide 1. Detail yang lebih panjang dipindah ke caption, bukan dijejalkan ke slide.</text>
</svg>
