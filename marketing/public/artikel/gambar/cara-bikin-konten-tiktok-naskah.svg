<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="470" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Struktur naskah tiga bagian</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Contoh untuk toko kaos: "Cara memilih ukuran kaos tanpa mencoba"</text>
<rect x="60" y="130" width="1080" height="44" rx="10" fill="#e3e9fb"/>
<rect x="60" y="130" width="200" height="44" rx="10" fill="#c2581e"/>
<rect x="260" y="130" width="640" height="44" fill="#2457d6"/>
<rect x="900" y="130" width="240" height="44" rx="10" fill="#1f8a7a"/>
<g fill="#fff" font-size="18" font-weight="700" text-anchor="middle"><text x="160" y="159">HOOK</text><text x="580" y="159">ISI</text><text x="1020" y="159">AJAKAN</text></g>
<g font-size="17" fill="#13235a">
<text x="60" y="222" font-weight="700" fill="#c2581e">Bagian pembuka</text>
<text x="60" y="252">"Sering salah beli ukuran kaos online?"</text>
<text x="60" y="280" fill="#3b4a7a">Tunjukkan masalah atau hasil akhir</text>
<text x="60" y="306" fill="#3b4a7a">di detik-detik pertama.</text>
<text x="430" y="222" font-weight="700" fill="#2457d6">Bagian inti</text>
<text x="430" y="252">1. Ambil kaos yang paling pas di lemari</text>
<text x="430" y="280">2. Ukur lebar dada dan panjang badan</text>
<text x="430" y="308">3. Cocokkan dengan tabel ukuran toko</text>
<text x="430" y="336" fill="#3b4a7a">Satu langkah per potongan gambar.</text>
<text x="900" y="222" font-weight="700" fill="#1f8a7a">Penutup</text>
<text x="900" y="252">"Tabel ukuran ada</text>
<text x="900" y="280">di tautan profil."</text>
<text x="900" y="308" fill="#3b4a7a">Satu ajakan saja.</text>
</g>
<rect x="60" y="380" width="1080" height="56" rx="12" fill="#fff" stroke="#c9d4f5" stroke-width="2"/>
<text x="84" y="415" font-size="17" fill="#13235a">Tulis naskah di catatan HP sebelum merekam. Teks layar mengulang poin penting untuk penonton tanpa suara.</text>
</svg>
