<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Alur menghitung ROI tiap bulan</title>
<desc id="d">Lima langkah: tetapkan tujuan, pasang UTM dan kode, kumpulkan nilai, jumlahkan biaya, hitung dan putuskan</desc>
<rect width="1200" height="340" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Alur menghitung ROI tiap bulan</text><text x="40" y="82" font-size="17" fill="#4a5680">Dari tujuan sampai keputusan anggaran</text>
<rect x="30" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="30" y="130" width="208" height="8" rx="4" fill="#2457d6"/><text x="46" y="172" font-size="18" fill="#2457d6" font-weight="700">1. Tujuan</text><text x="46" y="204" font-size="15" fill="#13235a">Penjualan, leads,</text><text x="46" y="228" font-size="15" fill="#13235a">atau chat</text><path d="M242 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/>
<rect x="263" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="263" y="130" width="208" height="8" rx="4" fill="#1f8a7a"/><text x="279" y="172" font-size="18" fill="#1f8a7a" font-weight="700">2. Lacak</text><text x="279" y="204" font-size="15" fill="#13235a">UTM, kode promo,</text><text x="279" y="228" font-size="15" fill="#13235a">pertanyaan kasir</text><path d="M475 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/>
<rect x="496" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="496" y="130" width="208" height="8" rx="4" fill="#6a4fd1"/><text x="512" y="172" font-size="18" fill="#6a4fd1" font-weight="700">3. Nilai</text><text x="512" y="204" font-size="15" fill="#13235a">Laba kotor atau</text><text x="512" y="228" font-size="15" fill="#13235a">nilai per lead</text><path d="M708 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/>
<rect x="729" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="729" y="130" width="208" height="8" rx="4" fill="#c2581e"/><text x="745" y="172" font-size="18" fill="#c2581e" font-weight="700">4. Biaya</text><text x="745" y="204" font-size="15" fill="#13235a">Uang dan jam</text><text x="745" y="228" font-size="15" fill="#13235a">kerja sebulan</text><path d="M941 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/>
<rect x="962" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="962" y="130" width="208" height="8" rx="4" fill="#13235a"/><text x="978" y="172" font-size="18" fill="#13235a" font-weight="700">5. Putuskan</text><text x="978" y="204" font-size="15" fill="#13235a">Naikkan, ubah,</text><text x="978" y="228" font-size="15" fill="#13235a">atau hentikan</text>
<text x="40" y="310" font-size="15" fill="#4a5680">Ilustrasi konsep. Dibuat oleh Kelola Konten.</text>
</g></svg>
