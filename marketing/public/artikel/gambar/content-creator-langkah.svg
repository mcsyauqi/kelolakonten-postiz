<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="540" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">7 langkah memulai jadi content creator</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Kerjakan berurutan; langkah 7 diulang setiap minggu</text>
<g font-size="17" fill="#13235a">
<g><circle cx="92" cy="152" r="24" fill="#2457d6"/><text x="92" y="159" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="132" y="146" font-weight="700" font-size="19">Pilih niche dan audiens</text><text x="132" y="172">Satu topik utama, satu kelompok penonton</text></g>
<g><circle cx="92" cy="252" r="24" fill="#2457d6"/><text x="92" y="259" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="132" y="246" font-weight="700" font-size="19">Pilih satu platform utama</text><text x="132" y="272">Tempat calon penonton Anda paling aktif</text></g>
<g><circle cx="92" cy="352" r="24" fill="#2457d6"/><text x="92" y="359" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="132" y="346" font-weight="700" font-size="19">Rapikan profil</text><text x="132" y="372">Nama, foto, dan bio yang menjelaskan manfaat</text></g>
<g><circle cx="92" cy="452" r="24" fill="#2457d6"/><text x="92" y="459" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="132" y="446" font-weight="700" font-size="19">Tentukan 3 sampai 5 pilar konten</text><text x="132" y="472">Tema besar yang diulang setiap minggu</text></g>
<g><circle cx="652" cy="152" r="24" fill="#1f8a7a"/><text x="652" y="159" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="692" y="146" font-weight="700" font-size="19">Kumpulkan 10 ide pertama</text><text x="692" y="172">Lalu susun rencana tayang 2 minggu</text></g>
<g><circle cx="652" cy="252" r="24" fill="#1f8a7a"/><text x="652" y="259" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="692" y="246" font-weight="700" font-size="19">Produksi dengan alat yang ada</text><text x="692" y="272">Ponsel, cahaya jendela, mikrofon sederhana</text></g>
<g><circle cx="652" cy="352" r="24" fill="#c2581e"/><text x="652" y="359" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="692" y="346" font-weight="700" font-size="19">Tayang rutin dan evaluasi</text><text x="692" y="372">Baca data tiap minggu, ulangi yang berhasil</text></g>
<rect x="632" y="420" width="508" height="84" rx="14" fill="#fff" stroke="#6a4fd1" stroke-width="2"/>
<text x="656" y="455" font-weight="700" fill="#6a4fd1">Patokan sederhana</text>
<text x="656" y="482">Konsisten dulu, baru menambah platform kedua</text>
</g>
</svg>
