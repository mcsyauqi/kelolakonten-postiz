<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="564" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Yang justru merusak engagement atau jangkauan</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Berdasarkan kebijakan Spam Meta dan penjelasan peringkat Reels dari Instagram</text>
<rect x="60" y="130" width="344" height="160" rx="16" fill="#c2581e"/>
<text x="82" y="170" font-size="20" font-weight="700" fill="#fff">Membeli like atau follower</text>
<text x="82" y="202" font-size="15" fill="#fff">Termasuk menjual, membeli,</text>
<text x="82" y="223" font-size="15" fill="#fff">atau menukar keterlibatan</text>
<rect x="428" y="130" width="344" height="160" rx="16" fill="#c2581e"/>
<text x="450" y="170" font-size="20" font-weight="700" fill="#fff">Giveaway berhadiah uang</text>
<text x="450" y="202" font-size="15" fill="#fff">Hadiah tunai atau setara tunai</text>
<text x="450" y="223" font-size="15" fill="#fff">dengan imbalan like atau follow</text>
<rect x="796" y="130" width="344" height="160" rx="16" fill="#c2581e"/>
<text x="818" y="170" font-size="20" font-weight="700" fill="#fff">Konten dikunci like/share</text>
<text x="818" y="202" font-size="15" fill="#fff">Mewajibkan interaksi sebelum</text>
<text x="818" y="223" font-size="15" fill="#fff">konten yang dijanjikan dibuka</text>
<rect x="60" y="314" width="344" height="160" rx="16" fill="#6a4fd1"/>
<text x="82" y="354" font-size="20" font-weight="700" fill="#fff">Reels beresolusi rendah</text>
<text x="82" y="386" font-size="15" fill="#fff">Disebut Instagram sebagai</text>
<text x="82" y="407" font-size="15" fill="#fff">alasan reel kurang terlihat</text>
<rect x="428" y="314" width="344" height="160" rx="16" fill="#6a4fd1"/>
<text x="450" y="354" font-size="20" font-weight="700" fill="#fff">Reels ber-watermark</text>
<text x="450" y="386" font-size="15" fill="#fff">Misalnya hasil unduhan dari</text>
<text x="450" y="407" font-size="15" fill="#fff">aplikasi lain</text>
<rect x="796" y="314" width="344" height="160" rx="16" fill="#6a4fd1"/>
<text x="818" y="354" font-size="20" font-weight="700" fill="#fff">Mengunggah ulang reel</text>
<text x="818" y="386" font-size="15" fill="#fff">Reel yang sudah pernah</text>
<text x="818" y="407" font-size="15" fill="#fff">diposting di Instagram</text>
<text x="60" y="528" font-size="17" fill="#3b4a7a">Oranye: kebijakan Spam Meta. Ungu: alasan reel dibuat kurang terlihat menurut Instagram.</text>
</svg>
