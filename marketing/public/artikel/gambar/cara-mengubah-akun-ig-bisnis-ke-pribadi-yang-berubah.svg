<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="600" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Apa yang berubah setelah kembali ke akun pribadi</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Ringkasan dari halaman bantuan resmi Instagram dan dokumentasi Meta for Developers</text>
<rect x="60" y="130" width="520" height="430" rx="18" fill="#fff" stroke="#c2581e" stroke-width="3"/>
<path d="M60 186 v-38 a18 18 0 0 1 18 -18 h484 a18 18 0 0 1 18 18 v38 z" fill="#c2581e"/>
<text x="88" y="167" font-size="21" font-weight="700" fill="#fff">Hilang atau terlepas</text>
<g font-size="17" fill="#13235a">
<text x="88" y="228">&#215;  Akses iklan dan Meta Ads Manager</text>
<text x="88" y="268">&#215;  Akses ke sebagian alat Meta Business Suite</text>
<text x="88" y="308">&#215;  Facebook Page yang terhubung diputus</text>
<text x="88" y="348">&#215;  Tombol Contact dan label kategori</text>
<text x="88" y="388">&#215;  Professional dashboard dan alat bisnis</text>
<text x="88" y="428">&#215;  Kotak masuk Primary, General, Requests</text>
<text x="88" y="468">&#215;  Koneksi aplikasi pihak ketiga lewat API</text>
<text x="112" y="496" fill="#3b4a7a" font-size="15">Instagram Platform hanya melayani akun profesional</text>
<text x="112" y="520" fill="#3b4a7a" font-size="15">(bisnis atau kreator)</text>
</g>
<rect x="620" y="130" width="520" height="430" rx="18" fill="#fff" stroke="#1f8a7a" stroke-width="3"/>
<path d="M620 186 v-38 a18 18 0 0 1 18 -18 h484 a18 18 0 0 1 18 18 v38 z" fill="#1f8a7a"/>
<text x="648" y="167" font-size="21" font-weight="700" fill="#fff">Masih bisa dipakai</text>
<g font-size="17" fill="#13235a">
<text x="648" y="228">&#10003;  Your dashboard dan insight (akun publik)</text>
<text x="648" y="268">&#10003;  Akun bisa diatur menjadi privat</text>
<text x="648" y="308">&#10003;  Kembali ke akun profesional kapan saja</text>
<text x="648" y="348">&#10003;  Posting, Reels, Story, dan DM tetap jalan</text>
</g>
<rect x="648" y="420" width="464" height="110" rx="12" fill="#f4f7ff" stroke="#c9d4f5" stroke-width="2"/>
<g font-size="15" fill="#3b4a7a"><text x="668" y="454">Akun profesional tidak bisa dibuat privat.</text><text x="668" y="480">Kalau ingin privat, ubah dulu ke akun pribadi,</text><text x="668" y="506">lalu aktifkan Private account.</text></g>
</svg>
