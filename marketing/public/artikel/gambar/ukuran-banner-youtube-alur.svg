<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">Cara mengganti banner di YouTube Studio</title><desc id="d">Enam langkah dari Bantuan YouTube: login ke YouTube Studio, buka Penyesuaian lalu Profil, klik Ubah dan pilih gambar, atur pangkasan di pratinjau, klik Selesai, lalu Publikasikan.</desc><rect width="1200" height="600" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Cara mengganti banner di YouTube Studio</text><rect x="40" y="110" width="330" height="130" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="80" cy="150" r="20" fill="#2457d6"/><text x="80" y="157" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="118" y="160" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="start">Login</text><text x="118" y="194" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">YouTube Studio</text><line x1="374" y1="175" x2="426" y2="175" stroke="#13235a" stroke-width="3"/><path d="M426 175 L413.0 168.0 L413.0 182.0 z" fill="#13235a"/><rect x="430" y="110" width="330" height="130" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="470" cy="150" r="20" fill="#2457d6"/><text x="470" y="157" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="508" y="160" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="start">Penyesuaian</text><text x="508" y="194" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">lalu Profil</text><line x1="764" y1="175" x2="816" y2="175" stroke="#13235a" stroke-width="3"/><path d="M816 175 L803.0 168.0 L803.0 182.0 z" fill="#13235a"/><rect x="820" y="110" width="330" height="130" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="860" cy="150" r="20" fill="#2457d6"/><text x="860" y="157" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="898" y="160" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="start">Ubah</text><text x="898" y="194" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">pilih gambar</text><rect x="40" y="300" width="330" height="130" rx="12" fill="#e3f4f1" stroke="#1f8a7a" stroke-width="3"/><circle cx="80" cy="340" r="20" fill="#1f8a7a"/><text x="80" y="347" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="118" y="350" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="start">Pratinjau</text><text x="118" y="384" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">atur pangkasan</text><line x1="374" y1="365" x2="426" y2="365" stroke="#13235a" stroke-width="3"/><path d="M426 365 L413.0 358.0 L413.0 372.0 z" fill="#13235a"/><rect x="430" y="300" width="330" height="130" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="470" cy="340" r="20" fill="#2457d6"/><text x="470" y="347" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">5</text><text x="508" y="350" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="start">Selesai</text><text x="508" y="384" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">tutup editor</text><line x1="764" y1="365" x2="816" y2="365" stroke="#13235a" stroke-width="3"/><path d="M816 365 L803.0 358.0 L803.0 372.0 z" fill="#13235a"/><rect x="820" y="300" width="330" height="130" rx="12" fill="#ffffff" stroke="#6a4fd1" stroke-width="3"/><circle cx="860" cy="340" r="20" fill="#6a4fd1"/><text x="860" y="347" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">6</text><text x="898" y="350" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="start">Publikasikan</text><text x="898" y="384" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">simpan perubahan</text><line x1="985" y1="244" x2="985" y2="268" stroke="#13235a" stroke-width="3"/><path d="M985 268 L992.0 255.0 L978.0 255.0 z" fill="#13235a"/><path d="M985 244 L985 270 L205 270 L205 294" fill="none" stroke="#13235a" stroke-width="3"/><line x1="205" y1="270" x2="205" y2="298" stroke="#13235a" stroke-width="3"/><path d="M205 298 L212.0 285.0 L198.0 285.0 z" fill="#13235a"/><rect x="40" y="470" width="1120" height="90" rx="12" fill="#ffffff" stroke="#c2581e" stroke-width="2"/><text x="600" y="506" font-family="Figtree, Inter, Arial, sans-serif" font-size="16.5" fill="#13235a" font-weight="700" text-anchor="middle">Banner yang sama dipakai di komputer, ponsel, dan TV, tetapi tampilannya berbeda tiap perangkat.</text><text x="600" y="538" font-family="Figtree, Inter, Arial, sans-serif" font-size="16.5" fill="#c2581e" font-weight="800" text-anchor="middle">Cek pratinjau di langkah 4 sebelum menekan Publikasikan.</text></svg>
