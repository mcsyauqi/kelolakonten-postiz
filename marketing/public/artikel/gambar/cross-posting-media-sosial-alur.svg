<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d"><title id="t">Alur cross posting media sosial dalam empat langkah</title><desc id="d">Buat satu konten induk, sesuaikan per platform, jadwalkan di satu kalender, lalu evaluasi hasil per platform</desc><rect width="1200" height="340" fill="#f4f7ff"/><g font-family="Inter, Arial, sans-serif"><text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Alur cross posting yang aman</text><text x="40" y="82" font-size="17" fill="#4a5680">Satu ide untuk banyak platform, tetapi setiap versi disesuaikan</text><rect x="30" y="120" width="262" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="30" y="120" width="262" height="8" rx="4" fill="#2457d6"/><text x="46" y="162" font-size="19" fill="#2457d6" font-weight="700">1. Konten induk</text><text x="46" y="196" font-size="15" fill="#13235a">Video vertikal bersih,</text><text x="46" y="222" font-size="15" fill="#13235a">tanpa watermark</text><path d="M296 190 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/><rect x="320" y="120" width="262" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="320" y="120" width="262" height="8" rx="4" fill="#1f8a7a"/><text x="336" y="162" font-size="19" fill="#1f8a7a" font-weight="700">2. Sesuaikan</text><text x="336" y="196" font-size="15" fill="#13235a">Caption, hashtag, tag,</text><text x="336" y="222" font-size="15" fill="#13235a">rasio dan durasi</text><path d="M586 190 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/><rect x="610" y="120" width="262" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="610" y="120" width="262" height="8" rx="4" fill="#6a4fd1"/><text x="626" y="162" font-size="19" fill="#6a4fd1" font-weight="700">3. Jadwalkan</text><text x="626" y="196" font-size="15" fill="#13235a">Satu kalender, jam</text><text x="626" y="222" font-size="15" fill="#13235a">berbeda per platform</text><path d="M876 190 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/><rect x="900" y="120" width="262" height="140" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="900" y="120" width="262" height="8" rx="4" fill="#c2581e"/><text x="916" y="162" font-size="19" fill="#c2581e" font-weight="700">4. Evaluasi</text><text x="916" y="196" font-size="15" fill="#13235a">Bandingkan hasil</text><text x="916" y="222" font-size="15" fill="#13235a">per platform</text><text x="40" y="310" font-size="15" fill="#4a5680">Urutan kerja yang disarankan Kelola Konten. Dibuat oleh Kelola Konten.</text></g></svg>
