<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d"><title id="t">Bagian layar yang tertutup antarmuka TikTok</title><desc id="d">Skema layar vertikal: bagian atas tertutup tab, sisi kanan tertutup tombol suka, komentar, dan bagikan, bagian bawah tertutup nama akun, caption, dan musik. Area tengah kiri aman untuk teks dan produk.</desc><rect width="1200" height="760" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Bagian layar yang tertutup antarmuka TikTok</text><rect x="430" y="80" width="340" height="604" rx="26" fill="#ffffff" stroke="#13235a" stroke-width="4"/><rect x="454" y="150" width="230" height="354" rx="10" fill="#e3f3ef" stroke="#1f8a7a" stroke-width="2.5" stroke-dasharray="8 6"/><text x="569" y="327" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#1f8a7a" font-weight="800" text-anchor="middle">Area aman</text><text x="569" y="353" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#1f8a7a" font-weight="600" text-anchor="middle">teks dan produk</text><rect x="698" y="310" width="52" height="250" rx="10" fill="#fbe9e0" stroke="#c2581e" stroke-width="2"/><circle cx="724" cy="342" r="16" fill="#c2581e" opacity="0.8"/><circle cx="724" cy="402" r="16" fill="#c2581e" opacity="0.8"/><circle cx="724" cy="462" r="16" fill="#c2581e" opacity="0.8"/><circle cx="724" cy="522" r="16" fill="#c2581e" opacity="0.8"/><rect x="450" y="524" width="230" height="120" rx="10" fill="#fbe9e0" stroke="#c2581e" stroke-width="2"/><rect x="466" y="544" width="140" height="14" rx="7" fill="#c2581e" opacity="0.8"/><rect x="466" y="570" width="190" height="12" rx="6" fill="#c2581e" opacity="0.5"/><rect x="466" y="592" width="160" height="12" rx="6" fill="#c2581e" opacity="0.5"/><rect x="450" y="98" width="300" height="36" rx="10" fill="#ece7fb" stroke="#6a4fd1" stroke-width="2"/><text x="400" y="122" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#6a4fd1" font-weight="800" text-anchor="end">Bagian atas</text><text x="400" y="144" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="end">tab dan ikon</text><text x="800" y="410" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#c2581e" font-weight="800" text-anchor="start">Sisi kanan</text><text x="800" y="434" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="start">tombol suka, komentar, bagikan</text><text x="400" y="574" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#c2581e" font-weight="800" text-anchor="end">Bagian bawah</text><text x="400" y="598" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="end">nama akun, caption, musik</text><text x="600" y="730" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">Skema konsep, bukan ukuran piksel resmi. TikTok menyediakan berkas zona aman yang bisa diunduh di halaman spesifikasi iklan.</text></svg>
