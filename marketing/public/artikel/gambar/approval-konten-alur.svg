<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Figtree,Segoe UI,Arial,sans-serif">
<rect width="1200" height="520" fill="#f4f7ff"/>
<text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#13235a">Lima tahap approval konten</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2457d6"/></marker></defs>
<g stroke="#2457d6" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M232 200 H262"/><path d="M462 200 H492"/><path d="M692 200 H722"/><path d="M922 200 H952"/></g>
<path d="M822 270 C822 350 592 350 592 275" stroke="#c2581e" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/>
<text x="707" y="372" text-anchor="middle" font-size="17" fill="#c2581e">boleh berputar sampai disetujui</text>
<g text-anchor="middle">
<rect x="40" y="140" width="190" height="125" rx="16" fill="#fff" stroke="#9fb4e8" stroke-width="2"/><text x="135" y="192" font-size="22" font-weight="700" fill="#13235a">1. Draft</text><text x="135" y="225" font-size="16" fill="#4a5578">tidak akan terbit</text>
<rect x="270" y="140" width="190" height="125" rx="16" fill="#2457d6"/><text x="365" y="192" font-size="22" font-weight="700" fill="#fff">2. Preview</text><text x="365" y="225" font-size="16" fill="#dbe6ff">tautan per post</text>
<rect x="500" y="140" width="190" height="125" rx="16" fill="#13235a"/><text x="595" y="192" font-size="22" font-weight="700" fill="#fff">3. Komentar</text><text x="595" y="225" font-size="16" fill="#dbe6ff">menempel di post</text>
<rect x="730" y="140" width="190" height="125" rx="16" fill="#6a4fd1"/><text x="825" y="192" font-size="22" font-weight="700" fill="#fff">4. Revisi</text><text x="825" y="225" font-size="16" fill="#ece6ff">di draft yang sama</text>
<rect x="960" y="140" width="200" height="125" rx="16" fill="#1f8a7a"/><text x="1060" y="192" font-size="22" font-weight="700" fill="#fff">5. Terjadwal</text><text x="1060" y="225" font-size="16" fill="#e0f5f1">dipindah manual</text>
</g>
<text x="600" y="440" text-anchor="middle" font-size="19" fill="#4a5578">Persetujuan bukan status otomatis: tim yang memindahkan draft ke jadwal setelah persetujuan tercatat.</text>
</svg>
