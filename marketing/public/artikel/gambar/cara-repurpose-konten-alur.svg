<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 312" width="1200" height="312" role="img" aria-labelledby="t d">
<title id="t">Lima langkah repurpose konten</title>
<desc id="d">Lima langkah: pilih konten induk, ambil inti pesan, tentukan format, sesuaikan per platform, lalu jadwalkan dan ukur.</desc>
<rect width="1200" height="312" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Lima langkah repurpose konten</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Dipakai sekali seminggu saat menyiapkan konten</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2457d6"/></marker></defs><rect x="40" y="120" width="196" height="152" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="56" y="150" font-size="18" fill="#2457d6" font-weight="700">1</text><text x="56" y="176" font-size="18" fill="#13235a" font-weight="700">Pilih induk</text><text x="56" y="204" font-size="16" fill="#4a5680">Konten yang sudah</text><text x="56" y="225.12" font-size="16" fill="#4a5680">terbukti</text><text x="56" y="246.24" font-size="16" fill="#4a5680">ditanggapi.</text><line x1="240" y1="196" x2="266" y2="196" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="270" y="120" width="196" height="152" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="286" y="150" font-size="18" fill="#2457d6" font-weight="700">2</text><text x="286" y="176" font-size="18" fill="#13235a" font-weight="700">Ambil inti</text><text x="286" y="204" font-size="16" fill="#4a5680">Tulis satu kalimat</text><text x="286" y="225.12" font-size="16" fill="#4a5680">pesan utama.</text><line x1="470" y1="196" x2="496" y2="196" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="500" y="120" width="196" height="152" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="516" y="150" font-size="18" fill="#2457d6" font-weight="700">3</text><text x="516" y="176" font-size="18" fill="#13235a" font-weight="700">Tentukan format</text><text x="516" y="204" font-size="16" fill="#4a5680">Pilih dua atau tiga</text><text x="516" y="225.12" font-size="16" fill="#4a5680">turunan.</text><line x1="700" y1="196" x2="726" y2="196" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="730" y="120" width="196" height="152" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="746" y="150" font-size="18" fill="#2457d6" font-weight="700">4</text><text x="746" y="176" font-size="18" fill="#13235a" font-weight="700">Sesuaikan</text><text x="746" y="204" font-size="16" fill="#4a5680">Ubah rasio, hook,</text><text x="746" y="225.12" font-size="16" fill="#4a5680">dan caption.</text><line x1="930" y1="196" x2="956" y2="196" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="960" y="120" width="196" height="152" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="976" y="150" font-size="18" fill="#2457d6" font-weight="700">5</text><text x="976" y="176" font-size="18" fill="#13235a" font-weight="700">Jadwalkan</text><text x="976" y="204" font-size="16" fill="#4a5680">Beri jeda, lalu</text><text x="976" y="225.12" font-size="16" fill="#4a5680">catat hasilnya.</text>
</g>
</svg>
