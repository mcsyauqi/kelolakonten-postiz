<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="t d"><title id="t">Aturan 5 kali untuk target biaya per hasil</title><desc id="d">Ilustrasi praktik terbaik Meta: kalau memakai strategi tawaran target biaya per hasil, anggaran harian minimal 5 kali target. Contoh rupiah: target Rp20.000 per hasil berarti anggaran harian minimal Rp100.000. Contoh resmi Meta memakai target 5 dolar dan anggaran 25 dolar.</desc><rect width="1200" height="490" fill="#f4f7ff"/><rect x="60" y="90" width="300" height="300" rx="14" fill="#fff" stroke="#1f8a7a" stroke-width="3"/><text x="210" y="140" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#1f8a7a" font-weight="800" text-anchor="middle">Target biaya</text><text x="210" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#1f8a7a" font-weight="800" text-anchor="middle">per hasil</text><circle cx="210" cy="270" r="70" fill="#dff1ee"/><text x="210" y="280" font-family="Figtree, Inter, Arial, sans-serif" font-size="30" fill="#1f8a7a" font-weight="800" text-anchor="middle">Rp20.000</text><text x="450" y="255" font-family="Figtree, Inter, Arial, sans-serif" font-size="54" fill="#c2581e" font-weight="800" text-anchor="middle">x 5</text><rect x="540" y="90" width="600" height="300" rx="14" fill="#fff" stroke="#2457d6" stroke-width="3"/><text x="840" y="140" font-family="Figtree, Inter, Arial, sans-serif" font-size="24" fill="#2457d6" font-weight="800" text-anchor="middle">Anggaran harian minimal</text><rect x="580" y="190" width="92" height="130" rx="12" fill="#e8eefc"/><circle cx="626" cy="240" r="24" fill="#2457d6" opacity="0.45"/><text x="626" y="300" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#2457d6" font-weight="700" text-anchor="middle">Rp20 rb</text><rect x="688" y="190" width="92" height="130" rx="12" fill="#e8eefc"/><circle cx="734" cy="240" r="24" fill="#2457d6" opacity="0.5700000000000001"/><text x="734" y="300" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#2457d6" font-weight="700" text-anchor="middle">Rp20 rb</text><rect x="796" y="190" width="92" height="130" rx="12" fill="#e8eefc"/><circle cx="842" cy="240" r="24" fill="#2457d6" opacity="0.69"/><text x="842" y="300" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#2457d6" font-weight="700" text-anchor="middle">Rp20 rb</text><rect x="904" y="190" width="92" height="130" rx="12" fill="#e8eefc"/><circle cx="950" cy="240" r="24" fill="#2457d6" opacity="0.81"/><text x="950" y="300" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#2457d6" font-weight="700" text-anchor="middle">Rp20 rb</text><rect x="1012" y="190" width="92" height="130" rx="12" fill="#e8eefc"/><circle cx="1058" cy="240" r="24" fill="#2457d6" opacity="0.9299999999999999"/><text x="1058" y="300" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#2457d6" font-weight="700" text-anchor="middle">Rp20 rb</text><text x="840" y="365" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="middle">= Rp100.000 per hari</text><text x="600" y="450" font-family="Figtree, Inter, Arial, sans-serif" font-size="18" fill="#3b4a6b" font-weight="600" text-anchor="middle">Contoh rupiah buatan kami. Contoh resmi Meta: target $5, anggaran harian minimal $25.</text></svg>
