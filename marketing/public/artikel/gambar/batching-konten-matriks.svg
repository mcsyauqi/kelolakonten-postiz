<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">Matriks pilar konten dan format untuk satu batch</title><desc id="d">Tabel empat pilar konten (edukasi, demonstrasi, cerita pelanggan, penawaran) terhadap tiga format (foto tunggal, carousel, video pendek), dengan sel yang dipilih untuk satu batch.</desc>
<rect width="1200" height="600" fill="#FBFCFE"/>
<text x="60" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#172338">Pilih sel, bukan isi semua kotak</text>
