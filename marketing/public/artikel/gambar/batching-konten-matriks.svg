<rect x="420" y="395" width="220" height="80" rx="10" fill="#1E5BD8" stroke="none"/><rect x="660" y="395" width="220" height="80" rx="10" fill="#1E5BD8" stroke="none"/><rect x="900" y="395" width="220" height="80" rx="10"/>
