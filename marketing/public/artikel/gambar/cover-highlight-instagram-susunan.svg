<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="500" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Urutan highlight yang mengikuti pertanyaan pembeli</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Contoh untuk toko hijab online, dibaca dari kiri ke kanan</text>
<g text-anchor="middle">
<g transform="translate(150,210)"><circle r="56" fill="#13235a"/><text y="8" font-size="20" font-weight="700" fill="#fff">1</text><text y="92" font-size="18" font-weight="700" fill="#13235a">Katalog</text><text y="118" font-size="15" fill="#3b4a7a">"Jual apa saja?"</text></g>
<g transform="translate(375,210)"><circle r="56" fill="#2457d6"/><text y="8" font-size="20" font-weight="700" fill="#fff">2</text><text y="92" font-size="18" font-weight="700" fill="#13235a">Ukuran dan bahan</text><text y="118" font-size="15" fill="#3b4a7a">"Cocok untuk saya?"</text></g>
<g transform="translate(600,210)"><circle r="56" fill="#1f8a7a"/><text y="8" font-size="20" font-weight="700" fill="#fff">3</text><text y="92" font-size="18" font-weight="700" fill="#13235a">Testimoni</text><text y="118" font-size="15" fill="#3b4a7a">"Orang lain puas?"</text></g>
<g transform="translate(825,210)"><circle r="56" fill="#6a4fd1"/><text y="8" font-size="20" font-weight="700" fill="#fff">4</text><text y="92" font-size="18" font-weight="700" fill="#13235a">Cara order</text><text y="118" font-size="15" fill="#3b4a7a">"Belinya bagaimana?"</text></g>
<g transform="translate(1050,210)"><circle r="56" fill="#c2581e"/><text y="8" font-size="20" font-weight="700" fill="#fff">5</text><text y="92" font-size="18" font-weight="700" fill="#13235a">Promo</text><text y="118" font-size="15" fill="#3b4a7a">"Ada potongan?"</text></g>
</g>
<g stroke="#13235a" stroke-width="2.5"><line x1="212" y1="210" x2="313" y2="210"/><line x1="437" y1="210" x2="538" y2="210"/><line x1="662" y1="210" x2="763" y2="210"/><line x1="887" y1="210" x2="988" y2="210"/></g>
<rect x="60" y="380" width="1080" height="80" rx="14" fill="#fff" stroke="#c9d4f5" stroke-width="2"/>
<text x="84" y="414" font-size="17" fill="#13235a">Urutkan dari pertanyaan yang paling sering masuk lewat DM dan komentar, supaya jawaban</text>
<text x="84" y="440" font-size="17" fill="#13235a">terpenting terlihat lebih dulu. Setelah itu, cek tampilan profil dari akun lain.</text>
</svg>
