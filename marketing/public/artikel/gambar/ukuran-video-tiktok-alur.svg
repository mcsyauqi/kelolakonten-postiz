<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">Enam langkah dari rekam sampai jadwal tanpa video terpotong</title><desc id="d">Alur rekam vertikal, atur proyek 1080x1920 px 30 FPS, ekspor MP4 H.264, cek durasi dan ukuran berkas, pratinjau di HP agar teks tidak tertutup tombol, lalu jadwalkan.</desc><rect width="1200" height="470" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Enam langkah dari rekam sampai jadwal tanpa video terpotong</text><line x1="110" y1="200" x2="1090" y2="200" stroke="#2457d6" stroke-width="4"/><circle cx="110" cy="200" r="26" fill="#1f8a7a"/><text x="110" y="208" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><rect x="18" y="250" width="184" height="118" rx="12" fill="#ffffff" stroke="#1f8a7a" stroke-width="2.5"/><text x="110" y="292" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#1f8a7a" font-weight="800" text-anchor="middle">Rekam vertikal</text><text x="110" y="326" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">HP tegak</text><text x="110" y="348" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">9:16</text><circle cx="306" cy="200" r="26" fill="#6a4fd1"/><text x="306" y="208" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><rect x="214" y="250" width="184" height="118" rx="12" fill="#ffffff" stroke="#6a4fd1" stroke-width="2.5"/><text x="306" y="292" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#6a4fd1" font-weight="800" text-anchor="middle">Atur proyek</text><text x="306" y="326" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">1080 x 1920 px</text><text x="306" y="348" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">30 FPS</text><circle cx="502" cy="200" r="26" fill="#1f8a7a"/><text x="502" y="208" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><rect x="410" y="250" width="184" height="118" rx="12" fill="#ffffff" stroke="#1f8a7a" stroke-width="2.5"/><text x="502" y="292" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#1f8a7a" font-weight="800" text-anchor="middle">Ekspor</text><text x="502" y="326" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">MP4</text><text x="502" y="348" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">H.264</text><circle cx="698" cy="200" r="26" fill="#6a4fd1"/><text x="698" y="208" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><rect x="606" y="250" width="184" height="118" rx="12" fill="#ffffff" stroke="#6a4fd1" stroke-width="2.5"/><text x="698" y="292" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#6a4fd1" font-weight="800" text-anchor="middle">Cek berkas</text><text x="698" y="326" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">durasi</text><text x="698" y="348" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">ukuran</text><circle cx="894" cy="200" r="26" fill="#c2581e"/><text x="894" y="208" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle">5</text><rect x="802" y="250" width="184" height="118" rx="12" fill="#ffffff" stroke="#c2581e" stroke-width="2.5"/><text x="894" y="292" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#c2581e" font-weight="800" text-anchor="middle">Pratinjau di HP</text><text x="894" y="326" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">teks tidak tertutup tombol</text><circle cx="1090" cy="200" r="26" fill="#6a4fd1"/><text x="1090" y="208" font-family="Figtree, Inter, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle">6</text><rect x="998" y="250" width="184" height="118" rx="12" fill="#ffffff" stroke="#6a4fd1" stroke-width="2.5"/><text x="1090" y="292" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#6a4fd1" font-weight="800" text-anchor="middle">Jadwalkan</text><text x="1090" y="326" font-family="Figtree, Inter, Arial, sans-serif" font-size="14" fill="#3b4a6b" font-weight="600" text-anchor="middle">unggah atau antrekan</text><text x="600" y="130" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#3b4a6b" font-weight="600" text-anchor="middle">Pengaturan contoh yang berada di dalam batas resmi TikTok</text><text x="600" y="430" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#c2581e" font-weight="800" text-anchor="middle">Langkah 5 paling sering dilewati: tombol, caption, dan nama akun menutupi bagian bawah dan kanan layar.</text></svg>
