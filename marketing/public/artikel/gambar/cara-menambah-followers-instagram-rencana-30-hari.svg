<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 312" width="1200" height="312" role="img" aria-labelledby="t d">
<title id="t">Rencana 30 hari menambah followers</title>
<desc id="d">Empat minggu: minggu pertama merapikan profil dan menentukan pilar, minggu kedua rutin Reels dan carousel, minggu ketiga kolaborasi dan balas komentar, minggu keempat membaca Insight dan mengulang yang berhasil.</desc>
<rect width="1200" height="312" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Rencana 30 hari yang bisa diukur</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Saran praktis Kelola Konten, sesuaikan dengan kapasitas tim</text>
<rect x="40" y="110" width="265" height="168" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
<rect x="40" y="110" width="8" height="168" rx="4" fill="#2457d6"/>
<text x="64" y="144" font-size="18" fill="#2457d6" font-weight="700">Minggu 1</text>
<text x="64" y="172" font-size="17" fill="#13235a" font-weight="700">Rapikan fondasi</text>
<text x="64" y="204" font-size="16" fill="#4a5680">Bio, nama, sorotan,</text>
<text x="64" y="226" font-size="16" fill="#4a5680">3 pilar konten, catat</text>
<text x="64" y="248" font-size="16" fill="#4a5680">angka awal followers.</text>
<rect x="325" y="110" width="265" height="168" rx="12" fill="#ffffff" stroke="#1f8a7a" stroke-width="2"/>
<rect x="325" y="110" width="8" height="168" rx="4" fill="#1f8a7a"/>
<text x="349" y="144" font-size="18" fill="#1f8a7a" font-weight="700">Minggu 2</text>
<text x="349" y="172" font-size="17" fill="#13235a" font-weight="700">Rutin tayang</text>
<text x="349" y="204" font-size="16" fill="#4a5680">3 sampai 4 unggahan:</text>
<text x="349" y="226" font-size="16" fill="#4a5680">Reels untuk ditemukan,</text>
<text x="349" y="248" font-size="16" fill="#4a5680">carousel untuk disimpan.</text>
<rect x="610" y="110" width="265" height="168" rx="12" fill="#ffffff" stroke="#6a4fd1" stroke-width="2"/>
<rect x="610" y="110" width="8" height="168" rx="4" fill="#6a4fd1"/>
<text x="634" y="144" font-size="18" fill="#6a4fd1" font-weight="700">Minggu 3</text>
<text x="634" y="172" font-size="17" fill="#13235a" font-weight="700">Jangkau orang baru</text>
<text x="634" y="204" font-size="16" fill="#4a5680">Kolaborasi satu akun,</text>
<text x="634" y="226" font-size="16" fill="#4a5680">balas semua komentar,</text>
<text x="634" y="248" font-size="16" fill="#4a5680">ajak pelanggan menandai.</text>
<rect x="895" y="110" width="265" height="168" rx="12" fill="#ffffff" stroke="#c2581e" stroke-width="2"/>
<rect x="895" y="110" width="8" height="168" rx="4" fill="#c2581e"/>
<text x="919" y="144" font-size="18" fill="#c2581e" font-weight="700">Minggu 4</text>
<text x="919" y="172" font-size="17" fill="#13235a" font-weight="700">Baca dan ulangi</text>
<text x="919" y="204" font-size="16" fill="#4a5680">Lihat konten pembawa</text>
<text x="919" y="226" font-size="16" fill="#4a5680">followers di Insight,</text>
<text x="919" y="248" font-size="16" fill="#4a5680">buat versi barunya.</text>
</g>
</svg>
