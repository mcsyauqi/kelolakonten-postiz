<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 456" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="456" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Isi content planner satu halaman</text>
<rect x="60" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="100" width="10" height="145" rx="5" fill="#2457d6"/>
<text font-size="20" font-weight="700" fill="#2457d6"><tspan x="88" y="140">Tujuan bulan ini</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="179">Satu kalimat hasil yang ingin</tspan><tspan x="88" y="202">dicapai.</tspan></text>
<rect x="429.3333333333333" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="429.3333333333333" y="100" width="10" height="145" rx="5" fill="#1f8a7a"/>
<text font-size="20" font-weight="700" fill="#1f8a7a"><tspan x="457.3333333333333" y="140">Pilar konten</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="457.3333333333333" y="179">Tiga sampai lima kategori yang</tspan><tspan x="457.3333333333333" y="202">bisa diproduksi.</tspan></text>
<rect x="798.6666666666666" y="100" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="798.6666666666666" y="100" width="10" height="145" rx="5" fill="#6a4fd1"/>
<text font-size="20" font-weight="700" fill="#6a4fd1"><tspan x="826.6666666666666" y="140">Kapasitas mingguan</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="826.6666666666666" y="179">Jam kerja tersedia dan jumlah</tspan><tspan x="826.6666666666666" y="202">konten per format.</tspan></text>
<rect x="60" y="273" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="273" width="10" height="145" rx="5" fill="#13235a"/>
<text font-size="20" font-weight="700" fill="#13235a"><tspan x="88" y="313">Kanal utama</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="352">Tempat audiens paling aktif,</tspan><tspan x="88" y="375">bukan semua kanal sekaligus.</tspan></text>
<rect x="429.3333333333333" y="273" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="429.3333333333333" y="273" width="10" height="145" rx="5" fill="#c2581e"/>
<text font-size="20" font-weight="700" fill="#c2581e"><tspan x="457.3333333333333" y="313">Metrik keberhasilan</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="457.3333333333333" y="352">Angka yang dibaca di akhir bulan,</tspan><tspan x="457.3333333333333" y="375">sesuai tujuan.</tspan></text>
<rect x="798.6666666666666" y="273" width="341.3333333333333" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="798.6666666666666" y="273" width="10" height="145" rx="5" fill="#7a849e"/>
<text font-size="20" font-weight="700" fill="#7a849e"><tspan x="826.6666666666666" y="313">Tanggal evaluasi</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="826.6666666666666" y="352">Hari dan jam review, ditulis</tspan><tspan x="826.6666666666666" y="375">sejak awal.</tspan></text>
</svg>
