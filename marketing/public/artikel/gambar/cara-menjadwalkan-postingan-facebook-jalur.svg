<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d"><title id="t">Tiga jalur resmi menjadwalkan postingan Facebook</title><desc id="d">Meta Business Suite di komputer untuk Page, aplikasi Facebook di ponsel untuk Page dan profil mode profesional, serta jadwal posting di grup untuk admin dan moderator</desc><rect width="1200" height="380" fill="#f4f7ff"/><g font-family="Inter, Arial, sans-serif"><text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Tiga jalur resmi menjadwalkan postingan Facebook</text><text x="40" y="82" font-size="17" fill="#4a5680">Pilih sesuai tempat Anda memposting dan perangkat yang dipakai</text><rect x="30" y="120" width="360" height="190" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="30" y="120" width="360" height="8" rx="4" fill="#2457d6"/><text x="46" y="162" font-size="19" fill="#2457d6" font-weight="700">1. Meta Business Suite</text><text x="46" y="196" font-size="15" fill="#13235a">Untuk Page, dari komputer</text><text x="46" y="222" font-size="15" fill="#13235a">Rentang 20 menit sampai 29 hari</text><text x="46" y="248" font-size="15" fill="#13235a">Kelola di Planner: edit, ubah</text><text x="46" y="274" font-size="15" fill="#13235a">jadwal, duplikat, hapus</text><rect x="420" y="120" width="360" height="190" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="420" y="120" width="360" height="8" rx="4" fill="#1f8a7a"/><text x="436" y="162" font-size="19" fill="#1f8a7a" font-weight="700">2. Aplikasi Facebook</text><text x="436" y="196" font-size="15" fill="#13235a">Page atau profil mode profesional</text><text x="436" y="222" font-size="15" fill="#13235a">Next, lalu Schedule for later</text><text x="436" y="248" font-size="15" fill="#13235a">Lihat di Manage posts; untuk</text><text x="436" y="274" font-size="15" fill="#13235a">mengubah: hapus lalu buat ulang</text><rect x="810" y="120" width="360" height="190" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="810" y="120" width="360" height="8" rx="4" fill="#c2581e"/><text x="826" y="162" font-size="19" fill="#c2581e" font-weight="700">3. Grup Facebook</text><text x="826" y="196" font-size="15" fill="#13235a">Khusus admin dan moderator</text><text x="826" y="222" font-size="15" fill="#13235a">Ikon kalender di sebelah Post</text><text x="826" y="248" font-size="15" fill="#13235a">Admin bisa membuat posting</text><text x="826" y="274" font-size="15" fill="#13235a">berulang lewat Admin Assist</text><text x="40" y="350" font-size="15" fill="#4a5680">Sumber: Facebook Help Centre dan Meta Business Help Centre, dicek 17 November 2026. Dibuat oleh Kelola Konten.</text></g></svg>
