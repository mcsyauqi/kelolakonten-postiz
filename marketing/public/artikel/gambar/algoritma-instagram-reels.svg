<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="600" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Daftar periksa reel sebelum diunggah</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Jenis reel yang menurut Instagram dibuat kurang terlihat, ditulis sebagai cek</text>
<g font-size="19" fill="#13235a">
<rect x="60" y="126" width="640" height="62" rx="12" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><rect x="80" y="143" width="28" height="28" rx="6" fill="#1f8a7a"/><path d="M87 157 l6 7 l11 -13" stroke="#fff" stroke-width="3.5" fill="none"/><text x="126" y="164">Resolusi tajam, tidak buram atau pecah</text>
<rect x="60" y="198" width="640" height="62" rx="12" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><rect x="80" y="215" width="28" height="28" rx="6" fill="#1f8a7a"/><path d="M87 229 l6 7 l11 -13" stroke="#fff" stroke-width="3.5" fill="none"/><text x="126" y="236">Tanpa watermark dari aplikasi lain</text>
<rect x="60" y="270" width="640" height="62" rx="12" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><rect x="80" y="287" width="28" height="28" rx="6" fill="#1f8a7a"/><path d="M87 301 l6 7 l11 -13" stroke="#fff" stroke-width="3.5" fill="none"/><text x="126" y="308">Ada suara, tidak dibisukan</text>
<rect x="60" y="342" width="640" height="62" rx="12" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><rect x="80" y="359" width="28" height="28" rx="6" fill="#1f8a7a"/><path d="M87 373 l6 7 l11 -13" stroke="#fff" stroke-width="3.5" fill="none"/><text x="126" y="380">Tanpa bingkai (border) di sekeliling video</text>
<rect x="60" y="414" width="640" height="62" rx="12" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><rect x="80" y="431" width="28" height="28" rx="6" fill="#1f8a7a"/><path d="M87 445 l6 7 l11 -13" stroke="#fff" stroke-width="3.5" fill="none"/><text x="126" y="452">Tidak didominasi teks</text>
<rect x="60" y="486" width="640" height="62" rx="12" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><rect x="80" y="503" width="28" height="28" rx="6" fill="#1f8a7a"/><path d="M87 517 l6 7 l11 -13" stroke="#fff" stroke-width="3.5" fill="none"/><text x="126" y="524">Bukan unggahan ulang reel yang sudah ada</text>
</g>
<rect x="740" y="126" width="400" height="422" rx="18" fill="#c2581e"/>
<text x="768" y="172" font-size="21" font-weight="700" fill="#fff">Empat prediksi terpenting</text>
<text x="768" y="200" font-size="21" font-weight="700" fill="#fff">di Reels</text>
<g font-size="18" fill="#fff4ec">
<circle cx="784" cy="252" r="16" fill="#fff"/><text x="784" y="258" text-anchor="middle" font-weight="700" fill="#c2581e">1</text><text x="812" y="258">dibagikan ulang</text>
<circle cx="784" cy="310" r="16" fill="#fff"/><text x="784" y="316" text-anchor="middle" font-weight="700" fill="#c2581e">2</text><text x="812" y="316">ditonton sampai habis</text>
<circle cx="784" cy="368" r="16" fill="#fff"/><text x="784" y="374" text-anchor="middle" font-weight="700" fill="#c2581e">3</text><text x="812" y="374">disukai</text>
<circle cx="784" cy="426" r="16" fill="#fff"/><text x="784" y="432" text-anchor="middle" font-weight="700" fill="#c2581e">4</text><text x="812" y="432">membuka halaman audio</text>
<text x="768" y="492">Halaman audio dipakai sebagai</text><text x="768" y="516">tanda penonton ingin ikut membuat.</text>
</g>
</svg>
