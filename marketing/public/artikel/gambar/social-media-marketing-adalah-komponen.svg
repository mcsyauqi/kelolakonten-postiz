<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="440" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Lima komponen social media marketing</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Semuanya saling terhubung; data analitik kembali memperbaiki strategi</text>
<g font-size="16" fill="#fff">
<rect x="60" y="130" width="196" height="200" rx="18" fill="#13235a"/><text x="80" y="172" font-size="21" font-weight="700">Strategi</text><text x="80" y="206">Tujuan, audiens,</text><text x="80" y="230">platform, dan</text><text x="80" y="254">pilar konten.</text>
<rect x="284" y="130" width="196" height="200" rx="18" fill="#2457d6"/><text x="304" y="172" font-size="21" font-weight="700">Konten</text><text x="304" y="206">Ide, naskah, foto,</text><text x="304" y="230">video, caption,</text><text x="304" y="254">dan jadwal.</text>
<rect x="508" y="130" width="196" height="200" rx="18" fill="#1f8a7a"/><text x="528" y="172" font-size="21" font-weight="700">Komunitas</text><text x="528" y="206">Membalas komentar,</text><text x="528" y="230">DM, dan mention</text><text x="528" y="254">dengan cepat.</text>
<rect x="732" y="130" width="196" height="200" rx="18" fill="#6a4fd1"/><text x="752" y="172" font-size="21" font-weight="700">Iklan</text><text x="752" y="206">Boost atau iklan</text><text x="752" y="230">untuk konten yang</text><text x="752" y="254">sudah terbukti.</text>
<rect x="956" y="130" width="184" height="200" rx="18" fill="#c2581e"/><text x="976" y="172" font-size="21" font-weight="700">Analitik</text><text x="976" y="206">Membaca angka,</text><text x="976" y="230">lalu memutuskan</text><text x="976" y="254">langkah berikut.</text>
</g>
<path d="M1048 340 V388 H158 V340" fill="none" stroke="#13235a" stroke-width="3" stroke-dasharray="8 6"/>
