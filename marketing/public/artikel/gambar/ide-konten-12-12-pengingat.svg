<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 334" width="1200" height="334" role="img" aria-labelledby="t d">
<title id="t">Cara kerja posting dengan pengingat di Instagram</title>
<desc id="d">Alur pengingat acara Instagram: posting dibuat paling cepat 3 bulan dan paling lambat 1 jam sebelum acara, lalu orang yang menekan ikon lonceng menerima notifikasi 24 jam sebelum, 15 menit sebelum, dan saat acara dimulai.</desc>
<rect width="1200" height="334" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Cara kerja posting dengan pengingat di Instagram</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Sesuai Pusat Bantuan Instagram, khusus akun profesional</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2457d6"/></marker></defs><rect x="40" y="120" width="196" height="174" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="56" y="150" font-size="18" fill="#2457d6" font-weight="700">1</text><text x="56" y="176" font-size="18" fill="#13235a" font-weight="700">Buat posting</text><text x="56" y="204" font-size="16" fill="#4a5680">Paling cepat 3</text><text x="56" y="225.12" font-size="16" fill="#4a5680">bulan, paling</text><text x="56" y="246.24" font-size="16" fill="#4a5680">lambat 1 jam</text><text x="56" y="267.36" font-size="16" fill="#4a5680">sebelum acara.</text><line x1="240" y1="207" x2="266" y2="207" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="270" y="120" width="196" height="174" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="286" y="150" font-size="18" fill="#2457d6" font-weight="700">2</text><text x="286" y="176" font-size="18" fill="#13235a" font-weight="700">Pengikut menekan</text><text x="286" y="199.76" font-size="18" fill="#13235a" font-weight="700">lonceng</text><text x="286" y="228" font-size="16" fill="#4a5680">Mereka memilih</text><text x="286" y="249.12" font-size="16" fill="#4a5680">untuk diingatkan.</text><line x1="470" y1="207" x2="496" y2="207" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="500" y="120" width="196" height="174" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="516" y="150" font-size="18" fill="#2457d6" font-weight="700">3</text><text x="516" y="176" font-size="18" fill="#13235a" font-weight="700">24 jam sebelum</text><text x="516" y="204" font-size="16" fill="#4a5680">Notifikasi di</text><text x="516" y="225.12" font-size="16" fill="#4a5680">aktivitas.</text><line x1="700" y1="207" x2="726" y2="207" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="730" y="120" width="196" height="174" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="746" y="150" font-size="18" fill="#2457d6" font-weight="700">4</text><text x="746" y="176" font-size="18" fill="#13235a" font-weight="700">15 menit sebelum</text><text x="746" y="204" font-size="16" fill="#4a5680">Notifikasi</text><text x="746" y="225.12" font-size="16" fill="#4a5680">aktivitas dan push.</text><line x1="930" y1="207" x2="956" y2="207" stroke="#2457d6" stroke-width="2.5" marker-end="url(#a)"/><rect x="960" y="120" width="196" height="174" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="976" y="150" font-size="18" fill="#2457d6" font-weight="700">5</text><text x="976" y="176" font-size="18" fill="#13235a" font-weight="700">Saat acara mulai</text><text x="976" y="204" font-size="16" fill="#4a5680">Notifikasi</text><text x="976" y="225.12" font-size="16" fill="#4a5680">aktivitas dan push.</text>
</g>
