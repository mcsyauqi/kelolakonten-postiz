<text x="82" y="228" font-size="15" fill="#fff">Masalah atau hasil</text>
<text x="82" y="249" font-size="15" fill="#fff">yang membuat orang</text>
<text x="82" y="270" font-size="15" fill="#fff">mengetuk</text>
