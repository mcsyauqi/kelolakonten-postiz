<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="560" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Cek akurasi sebelum konten edukasi terbit</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Diturunkan dari pertanyaan Siapa, Bagaimana, Kenapa di pedoman konten Google</text>
<g font-size="18" fill="#13235a">
<rect x="60" y="130" width="530" height="110" rx="14" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><circle cx="100" cy="185" r="20" fill="#2457d6"/><text x="100" y="191" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="136" y="176" font-weight="700">Siapa yang membuat?</text><text x="136" y="204" font-size="16" fill="#3b4a7a">Berpengalaman langsung dengan topiknya</text>
<rect x="610" y="130" width="530" height="110" rx="14" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><circle cx="650" cy="185" r="20" fill="#2457d6"/><text x="650" y="191" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="686" y="176" font-weight="700">Klaim punya sumber?</text><text x="686" y="204" font-size="16" fill="#3b4a7a">Angka dan aturan bisa dicek pembaca</text>
<rect x="60" y="256" width="530" height="110" rx="14" fill="#fff" stroke="#c2581e" stroke-width="2"/><circle cx="100" cy="311" r="20" fill="#c2581e"/><text x="100" y="317" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="136" y="302" font-weight="700">Topik sensitif dicek ahli?</text><text x="136" y="330" font-size="16" fill="#3b4a7a">Kesehatan, keuangan, hukum, keselamatan</text>
<rect x="610" y="256" width="530" height="110" rx="14" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><circle cx="650" cy="311" r="20" fill="#2457d6"/><text x="650" y="317" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="686" y="302" font-weight="700">Foto pelanggan sudah diizinkan?</text><text x="686" y="330" font-size="16" fill="#3b4a7a">Izin tertulis, termasuk untuk unggah ulang</text>
<rect x="60" y="382" width="530" height="110" rx="14" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><circle cx="100" cy="437" r="20" fill="#2457d6"/><text x="100" y="443" text-anchor="middle" fill="#fff" font-weight="700">5</text><text x="136" y="428" font-weight="700">Tanpa janji hasil pasti?</text><text x="136" y="456" font-size="16" fill="#3b4a7a">"Bisa membantu", bukan "pasti berhasil"</text>
<rect x="610" y="382" width="530" height="110" rx="14" fill="#fff" stroke="#c9d3f0" stroke-width="2"/><circle cx="650" cy="437" r="20" fill="#2457d6"/><text x="650" y="443" text-anchor="middle" fill="#fff" font-weight="700">6</text><text x="686" y="428" font-weight="700">Batasannya ditulis?</text><text x="686" y="456" font-size="16" fill="#3b4a7a">Kapan cara ini tidak cocok dipakai</text>
</g>
<text x="60" y="530" font-size="17" fill="#13235a">Satu jawaban "belum" sudah cukup alasan untuk menahan konten sampai diperbaiki.</text>
</svg>
