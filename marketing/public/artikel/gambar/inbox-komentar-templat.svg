<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 509" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="509" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Empat templat balasan komentar yang aman</text>
<rect x="60" y="100" width="526" height="168" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="100" width="10" height="168" rx="5" fill="#2457d6"/>
<text font-size="20" font-weight="700" fill="#2457d6"><tspan x="88" y="140">Pertanyaan harga</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="179">Terima kasih sudah bertanya. Detail harga dan pilihan</tspan><tspan x="88" y="202">paket kami kirim lewat WhatsApp di bio ya, supaya bisa</tspan><tspan x="88" y="225">disesuaikan kebutuhan Kakak.</tspan></text>
<rect x="614" y="100" width="526" height="168" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="614" y="100" width="10" height="168" rx="5" fill="#c2581e"/>
<text font-size="20" font-weight="700" fill="#c2581e"><tspan x="642" y="140">Keluhan pesanan</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="642" y="179">Mohon maaf atas kendalanya. Boleh kirim nomor pesanan</tspan><tspan x="642" y="202">lewat DM? Tim kami cek hari ini dan kabari langsung.</tspan></text>
<rect x="60" y="296" width="526" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="60" y="296" width="10" height="145" rx="5" fill="#6a4fd1"/>
<text font-size="20" font-weight="700" fill="#6a4fd1"><tspan x="88" y="336">Pertanyaan stok</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="88" y="375">Untuk stok terbaru, kami cek dulu ya. Kabar pastinya</tspan><tspan x="88" y="398">kami balas di sini atau lewat DM.</tspan></text>
<rect x="614" y="296" width="526" height="145" rx="16" fill="#fff" stroke="#d7def0" stroke-width="1.5"/><rect x="614" y="296" width="10" height="145" rx="5" fill="#1f8a7a"/>
<text font-size="20" font-weight="700" fill="#1f8a7a"><tspan x="642" y="336">Pujian</tspan></text>
<text font-size="17" fill="#3a466b"><tspan x="642" y="375">Terima kasih banyak, senang sekali mendengarnya.</tspan><tspan x="642" y="398">Sampai jumpa di kunjungan berikutnya.</tspan></text>
<text x="60" y="485" font-size="17" fill="#4a5578">Templat tidak menjanjikan harga atau waktu yang belum pasti, dan tidak meminta data pribadi di kolom publik.</text>
</svg>
