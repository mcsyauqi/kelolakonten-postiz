<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d">
<title id="t">Revisi di file baru dan revisi di draft yang sama</title>
<desc id="d">Perbandingan revisi lewat file baru dengan revisi pada draft yang sama: tautan tetap, komentar lama tetap berkonteks, dan klien selalu melihat versi terbaru.</desc>
<rect width="1200" height="450" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Revisi di file baru dan revisi di draft yang sama</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Satu draft membuat versi terbaru selalu jelas</text>
<rect x="40" y="116" width="548" height="44" rx="8" fill="#c2581e"/><rect x="612" y="116" width="548" height="44" rx="8" fill="#2457d6"/><text x="58" y="145" font-size="18" fill="#ffffff" font-weight="700">File baru tiap revisi</text><text x="630" y="145" font-size="18" fill="#ffffff" font-weight="700">Revisi di draft yang sama</text><rect x="40" y="172" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="172" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="195" font-size="16" fill="#13235a">Setiap perubahan dikirim sebagai file baru</text><text x="630" y="195" font-size="16" fill="#13235a">Perubahan langsung di draft yang sama</text><rect x="40" y="234" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="234" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="257" font-size="16" fill="#13235a">Tautan berganti, klien bingung versi terbaru</text><text x="630" y="257" font-size="16" fill="#13235a">Tautan preview tetap sama</text><rect x="40" y="296" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="296" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="319" font-size="16" fill="#13235a">Komentar lama kehilangan konteks</text><text x="630" y="319" font-size="16" fill="#13235a">Komentar lama masih terlihat konteksnya</text><rect x="40" y="358" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="358" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="381" font-size="16" fill="#13235a">Revisi kecil dan ganti konsep tercampur</text><text x="630" y="381" font-size="16" fill="#13235a">Ganti konsep dibahas sebagai konten baru</text>
</g>
</svg>
