<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="420" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Menghitung frekuensi dari dua angka</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Contoh rekaan satu bulan akun toko kue</text>
<rect x="60" y="136" width="300" height="150" rx="18" fill="#c2581e"/>
<text x="210" y="196" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Impression</text>
<text x="210" y="244" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">12.000</text>
<text x="400" y="228" font-size="46" font-weight="700" fill="#13235a">:</text>
<rect x="460" y="136" width="300" height="150" rx="18" fill="#1f8a7a"/>
<text x="610" y="196" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Reach</text>
<text x="610" y="244" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">4.000</text>
<text x="798" y="228" font-size="46" font-weight="700" fill="#13235a">=</text>
<rect x="860" y="136" width="280" height="150" rx="18" fill="#2457d6"/>
<text x="1000" y="196" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Frekuensi</text>
<text x="1000" y="244" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">3,0</text>
<text x="60" y="340" font-size="18" fill="#13235a">Artinya: rata-rata tiap akun yang terjangkau melihat konten akun ini tiga kali dalam sebulan.</text>
<text x="60" y="372" font-size="17" fill="#3b4a7a">Rata-rata menyembunyikan sebaran: sebagian akun bisa melihat sekali, sebagian lain berkali-kali.</text>
</svg>
