<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="410" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Siklus uji hook dalam empat minggu</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Ubah satu hal per putaran supaya hasilnya bisa dibaca</text>
<rect x="60" y="130" width="252" height="190" rx="16" fill="#13235a"/>
<text x="82" y="170" font-size="20" font-weight="700" fill="#fff">Minggu 1</text>
<text x="82" y="202" font-size="15" fill="#fff">Tulis tiga versi hook</text>
<text x="82" y="223" font-size="15" fill="#fff">untuk satu topik yang</text>
<text x="82" y="244" font-size="15" fill="#fff">sama. Isi video tetap,</text>
<text x="82" y="265" font-size="15" fill="#fff">hanya pembuka berbeda.</text>
<rect x="336" y="130" width="252" height="190" rx="16" fill="#2457d6"/>
<text x="358" y="170" font-size="20" font-weight="700" fill="#fff">Minggu 2</text>
<text x="358" y="202" font-size="15" fill="#fff">Posting bergiliran di</text>
<text x="358" y="223" font-size="15" fill="#fff">jam yang mirip. Catat</text>
<text x="358" y="244" font-size="15" fill="#fff">jenis hook di kalender</text>
<text x="358" y="265" font-size="15" fill="#fff">konten.</text>
<rect x="612" y="130" width="252" height="190" rx="16" fill="#1f8a7a"/>
<text x="634" y="170" font-size="20" font-weight="700" fill="#fff">Minggu 3</text>
<text x="634" y="202" font-size="15" fill="#fff">Bandingkan retensi awal,</text>
<text x="634" y="223" font-size="15" fill="#fff">rata-rata durasi tonton,</text>
<text x="634" y="244" font-size="15" fill="#fff">simpan, dan bagikan</text>
<text x="634" y="265" font-size="15" fill="#fff">di insight.</text>
<rect x="888" y="130" width="252" height="190" rx="16" fill="#6a4fd1"/>
<text x="910" y="170" font-size="20" font-weight="700" fill="#fff">Minggu 4</text>
<text x="910" y="202" font-size="15" fill="#fff">Simpan pola pemenang</text>
<text x="910" y="223" font-size="15" fill="#fff">ke bank hook, lalu</text>
<text x="910" y="244" font-size="15" fill="#fff">uji jenis berikutnya</text>
<text x="910" y="265" font-size="15" fill="#fff">di topik lain.</text>
<text x="60" y="374" font-size="17" fill="#3b4a7a">Satu video bukan bukti. Ambil keputusan dari pola beberapa video dengan topik dan jam yang setara.</text>
</svg>
