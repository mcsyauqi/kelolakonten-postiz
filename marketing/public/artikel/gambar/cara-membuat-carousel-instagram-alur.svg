<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">Urutan produksi carousel</title>
<desc id="d">Empat kotak: tulis dulu, rancang templat, isi slide, cek di ponsel.</desc>
<rect width="1200" height="330" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Urutan produksi carousel</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep alur kerja Kelola Konten</text>
<rect x="40" y="130" width="260" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="162" font-size="18" font-weight="700" fill="#2457d6">Tulis dulu</text><text x="58" y="190" font-size="15" fill="#13235a">Satu kalimat per slide</text><text x="58" y="212" font-size="15" fill="#13235a">di dokumen teks</text><line x1="300" y1="195" x2="323" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="323,195 314.0,199.3 314.0,190.7" fill="#4a5680"/><rect x="325" y="130" width="260" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="343" y="162" font-size="18" font-weight="700" fill="#6a4fd1">Rancang templat</text><text x="343" y="190" font-size="15" fill="#13235a">Satu ukuran, satu font,</text><text x="343" y="212" font-size="15" fill="#13235a">posisi teks tetap</text><line x1="585" y1="195" x2="608" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="608,195 599.0,199.3 599.0,190.7" fill="#4a5680"/><rect x="610" y="130" width="260" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="628" y="162" font-size="18" font-weight="700" fill="#1f8a7a">Isi slide</text><text x="628" y="190" font-size="15" fill="#13235a">Teks besar, satu ide,</text><text x="628" y="212" font-size="15" fill="#13235a">visual pendukung</text><line x1="870" y1="195" x2="893" y2="195" stroke="#4a5680" stroke-width="2"/><polygon points="893,195 884.0,199.3 884.0,190.7" fill="#4a5680"/><rect x="895" y="130" width="260" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="913" y="162" font-size="18" font-weight="700" fill="#c2581e">Cek di ponsel</text><text x="913" y="190" font-size="15" fill="#13235a">Baca tanpa zoom,</text><text x="913" y="212" font-size="15" fill="#13235a">urutan benar</text><text x="40" y="300" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Teks ditulis lebih dulu supaya desain mengikuti isi, bukan sebaliknya.</text>
</g>
</svg>
