<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d"><title id="t">Ukuran banner YouTube: kanvas dan area aman</title><desc id="d">Kanvas banner 2048 x 1152 piksel berasio 16:9 digambar skala setengah, dengan kotak area aman 1235 x 338 piksel di tengah untuk teks dan logo, serta catatan rekomendasi 2560 x 1440 piksel dan batas berkas 6 MB.</desc><rect width="1200" height="740" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Ukuran banner YouTube: kanvas dan area aman</text><rect x="88" y="100" width="1024" height="576" rx="6" fill="#e8edff" stroke="#2457d6" stroke-width="3"/><circle cx="228" cy="240" r="70" fill="#6a4fd1" opacity="0.18"/><circle cx="962" cy="546" r="95" fill="#1f8a7a" opacity="0.16"/><rect x="291.25" y="303.5" width="617.5" height="169" rx="6" fill="#ffffff" stroke="#c2581e" stroke-width="3" stroke-dasharray="10 7"/><text x="600" y="365.5" font-family="Figtree, Inter, Arial, sans-serif" font-size="24" fill="#c2581e" font-weight="800" text-anchor="middle">Area aman teks dan logo</text><text x="600" y="401.5" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#13235a" font-weight="800" text-anchor="middle">1235 x 338 piksel</text><text x="600" y="435.5" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">sekitar 60% lebar dan 29% tinggi kanvas</text><text x="108" y="136" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#2457d6" font-weight="800" text-anchor="start">Kanvas minimum 2048 x 1152 piksel (16:9)</text><text x="108" y="654" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#13235a" font-weight="700" text-anchor="start">Rekomendasi, terutama untuk TV: 2560 x 1440 piksel. Ukuran berkas 6 MB atau kurang.</text><text x="600" y="716" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">Angka dari Bantuan YouTube. Posisi area aman di tengah adalah praktik template, cek di pratinjau pemangkasan Studio.</text></svg>
