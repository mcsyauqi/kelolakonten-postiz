<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Struktur video jualan yang disarankan TikTok</title>
<desc id="d">Struktur video jualan: hook dalam 6 detik pertama, proposisi dalam 3 detik pertama, keunggulan produk, teks 5 sampai 10 kata per detik, ajakan bertindak</desc>
<rect width="1200" height="340" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Struktur video jualan yang disarankan TikTok</text><text x="40" y="82" font-size="17" fill="#4a5680">Hook di awal, keunggulan di tengah, ajakan jelas di akhir</text>
<rect x="30" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="30" y="130" width="208" height="8" rx="4" fill="#2457d6"/><text x="46" y="172" font-size="18" fill="#2457d6" font-weight="700">Hook</text><text x="46" y="204" font-size="15" fill="#13235a">Rebut perhatian di</text><text x="46" y="228" font-size="15" fill="#13235a">6 detik pertama</text><path d="M242 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/>
<rect x="263" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="263" y="130" width="208" height="8" rx="4" fill="#1f8a7a"/><text x="279" y="172" font-size="18" fill="#1f8a7a" font-weight="700">Proposisi</text><text x="279" y="204" font-size="15" fill="#13235a">Sebut produknya di</text><text x="279" y="228" font-size="15" fill="#13235a">3 detik pertama</text><path d="M475 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/>
<rect x="496" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="496" y="130" width="208" height="8" rx="4" fill="#6a4fd1"/><text x="512" y="172" font-size="18" fill="#6a4fd1" font-weight="700">Keunggulan</text><text x="512" y="204" font-size="15" fill="#13235a">Tunjukkan 1 sampai 2</text><text x="512" y="228" font-size="15" fill="#13235a">alasan membeli</text><path d="M708 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/>
<rect x="729" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="729" y="130" width="208" height="8" rx="4" fill="#c2581e"/><text x="745" y="172" font-size="18" fill="#c2581e" font-weight="700">Teks layar</text><text x="745" y="204" font-size="15" fill="#13235a">5 sampai 10 kata</text><text x="745" y="228" font-size="15" fill="#13235a">per detik</text><path d="M941 195 h17 m-7 -6 l7 6 l-7 6" stroke="#4a5680" stroke-width="2" fill="none"/>
<rect x="962" y="130" width="208" height="130" rx="10" fill="#ffffff" stroke="#c9d4f2"/><rect x="962" y="130" width="208" height="8" rx="4" fill="#13235a"/><text x="978" y="172" font-size="18" fill="#13235a" font-weight="700">Ajakan</text><text x="978" y="204" font-size="15" fill="#13235a">Klik keranjang,</text><text x="978" y="228" font-size="15" fill="#13235a">cek link, atau chat</text>
<text x="40" y="310" font-size="15" fill="#4a5680">Disusun dari panduan Creative best practices TikTok for Business. Dibuat oleh Kelola Konten.</text>
