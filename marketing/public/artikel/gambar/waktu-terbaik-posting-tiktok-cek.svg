<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Checklist sebelum menjadwalkan video TikTok</title>
<desc id="d">Lima hal yang dicek sebelum menjadwalkan: jenis akun, zona waktu, rentang 15 menit sampai 10 hari, caption final, dan pencatatan slot uji</desc>
<rect width="1200" height="420" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Checklist sebelum menjadwalkan video TikTok</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ringkasan dari Pusat Bantuan TikTok dan praktik uji waktu posting</text>
<rect x="40" y="110" width="1120" height="46" rx="8" fill="#ffffff" stroke="#c9d4f2"/><rect x="56" y="122" width="22" height="22" rx="4" fill="#1f8a7a"/><polyline points="61,133 66,139 74,127" fill="none" stroke="#ffffff" stroke-width="3"/><text x="96" y="139" font-size="18" font-weight="700" fill="#13235a">Akun bisnis atau 10.000+ pengikut</text><text x="560" y="139" font-size="16" fill="#4a5680">syarat jadwal di TikTok desktop web</text>
<rect x="40" y="166" width="1120" height="46" rx="8" fill="#ffffff" stroke="#c9d4f2"/><rect x="56" y="178" width="22" height="22" rx="4" fill="#1f8a7a"/><polyline points="61,189 66,195 74,183" fill="none" stroke="#ffffff" stroke-width="3"/><text x="96" y="195" font-size="18" font-weight="700" fill="#13235a">Zona waktu komputer = WIB</text><text x="560" y="195" font-size="16" fill="#4a5680">jadwal mengikuti pengaturan komputer</text>
<rect x="40" y="222" width="1120" height="46" rx="8" fill="#ffffff" stroke="#c9d4f2"/><rect x="56" y="234" width="22" height="22" rx="4" fill="#1f8a7a"/><polyline points="61,245 66,251 74,239" fill="none" stroke="#ffffff" stroke-width="3"/><text x="96" y="251" font-size="18" font-weight="700" fill="#13235a">Jarak 15 menit sampai 10 hari</text><text x="560" y="251" font-size="16" fill="#4a5680">batas jadwal dari Pusat Bantuan TikTok</text>
<rect x="40" y="278" width="1120" height="46" rx="8" fill="#ffffff" stroke="#c9d4f2"/><rect x="56" y="290" width="22" height="22" rx="4" fill="#1f8a7a"/><polyline points="61,301 66,307 74,295" fill="none" stroke="#ffffff" stroke-width="3"/><text x="96" y="307" font-size="18" font-weight="700" fill="#13235a">Caption dan sampul final</text><text x="560" y="307" font-size="16" fill="#4a5680">postingan terjadwal tidak bisa diedit</text>
<rect x="40" y="334" width="1120" height="46" rx="8" fill="#ffffff" stroke="#c9d4f2"/><rect x="56" y="346" width="22" height="22" rx="4" fill="#1f8a7a"/><polyline points="61,357 66,363 74,351" fill="none" stroke="#ffffff" stroke-width="3"/><text x="96" y="363" font-size="18" font-weight="700" fill="#13235a">Catat slot di lembar uji</text><text x="560" y="363" font-size="16" fill="#4a5680">tanggal, jam, jenis konten, views 24 jam</text>
<text x="40" y="400" font-size="15" fill="#4a5680">Ilustrasi konsep. Dibuat oleh Kelola Konten.</text>
</g></svg>
