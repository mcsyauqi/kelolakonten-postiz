<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 422" width="1200" height="422" role="img" aria-labelledby="t d">
<title id="t">Kalender konten 3 minggu menuju 12.12</title>
<desc id="d">Empat kolom: minggu pertama pemanasan, minggu kedua edukasi dan bukti, minggu ketiga hitung mundur, dan hari H 12 Desember untuk pembaruan langsung.</desc>
<rect width="1200" height="422" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Kalender konten 3 minggu menuju 12.12</text>
<text x="40" y="82" font-size="17" fill="#4a5680">21 November sampai 12 Desember 2026, setiap minggu punya tugas berbeda</text>
<rect x="40" y="116" width="262" height="248" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="58" y="152" font-size="19" fill="#2457d6" font-weight="700">21 sampai 27 Nov</text><circle cx="64" cy="179" r="4" fill="#2457d6"/><text x="78" y="184" font-size="16" fill="#13235a">Tahap pemanasan</text><circle cx="64" cy="211" r="4" fill="#2457d6"/><text x="78" y="216" font-size="16" fill="#13235a">Teaser tanpa membuka</text><text x="78" y="237.12" font-size="16" fill="#13235a">harga</text><circle cx="64" cy="265" r="4" fill="#2457d6"/><text x="78" y="270" font-size="16" fill="#13235a">Polling produk incaran</text><circle cx="64" cy="297" r="4" fill="#2457d6"/><text x="78" y="302" font-size="16" fill="#13235a">Ajak simpan postingan</text><rect x="326" y="116" width="262" height="248" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="344" y="152" font-size="19" fill="#2457d6" font-weight="700">28 Nov sampai 4 Des</text><circle cx="350" cy="179" r="4" fill="#2457d6"/><text x="364" y="184" font-size="16" fill="#13235a">Tahap edukasi dan bukti</text><circle cx="350" cy="211" r="4" fill="#2457d6"/><text x="364" y="216" font-size="16" fill="#13235a">Edukasi cara memilih</text><text x="364" y="237.12" font-size="16" fill="#13235a">produk</text><circle cx="350" cy="265" r="4" fill="#2457d6"/><text x="364" y="270" font-size="16" fill="#13235a">Ulasan dan bukti</text><text x="364" y="291.12" font-size="16" fill="#13235a">pelanggan</text><circle cx="350" cy="319" r="4" fill="#2457d6"/><text x="364" y="324" font-size="16" fill="#13235a">Bundling diperkenalkan</text><rect x="612" y="116" width="262" height="248" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="630" y="152" font-size="19" fill="#2457d6" font-weight="700">5 sampai 11 Des</text><circle cx="636" cy="179" r="4" fill="#2457d6"/><text x="650" y="184" font-size="16" fill="#13235a">Tahap hitung mundur</text><circle cx="636" cy="211" r="4" fill="#2457d6"/><text x="650" y="216" font-size="16" fill="#13235a">Detail promo dan syarat</text><circle cx="636" cy="243" r="4" fill="#2457d6"/><text x="650" y="248" font-size="16" fill="#13235a">Posting dengan pengingat</text><circle cx="636" cy="275" r="4" fill="#2457d6"/><text x="650" y="280" font-size="16" fill="#13235a">Hitung mundur di Stories</text><rect x="898" y="116" width="262" height="248" rx="12" fill="#e8eefc" stroke="#2457d6" stroke-width="2"/><text x="916" y="152" font-size="19" fill="#2457d6" font-weight="700">Sabtu, 12 Des</text><circle cx="922" cy="179" r="4" fill="#2457d6"/><text x="936" y="184" font-size="16" fill="#13235a">Hari H</text><circle cx="922" cy="211" r="4" fill="#2457d6"/><text x="936" y="216" font-size="16" fill="#13235a">Pembaruan stok berkala</text><circle cx="922" cy="243" r="4" fill="#2457d6"/><text x="936" y="248" font-size="16" fill="#13235a">Siaran live jam ramai</text><circle cx="922" cy="275" r="4" fill="#2457d6"/><text x="936" y="280" font-size="16" fill="#13235a">Balas chat lebih cepat</text><text x="40" y="402" font-size="16" fill="#4a5680">Tanggal mengikuti kalender 2026. Geser seluruh kolom kalau promo toko Anda dimulai lebih awal.</text>
</g>
</svg>
