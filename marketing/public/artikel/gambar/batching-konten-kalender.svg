<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d"><title id="t">Status hasil batch di kalender</title><desc id="d">Kalender satu minggu dengan tiga status: draft menunggu review, terjadwal, dan slot fleksibel.</desc>
<rect width="1200" height="620" fill="#FBFCFE"/>
<text x="60" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#172338">Hasil batch masuk kalender sebagai draft dulu</text>
<text x="60" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#454C5C">Status berubah menjadi terjadwal hanya setelah review selesai</text>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="60" y="140" width="1080" height="400" rx="16" fill="#fff" stroke="#E1E5EC"/>
<g font-size="18" font-weight="700" fill="#172338" text-anchor="middle"><text x="137" y="180">Sen</text><text x="291" y="180">Sel</text><text x="445" y="180">Rab</text><text x="599" y="180">Kam</text><text x="753" y="180">Jum</text><text x="907" y="180">Sab</text><text x="1061" y="180">Min</text></g>
<path d="M214 150V340M368 150V340M522 150V340M676 150V340M830 150V340M984 150V340M70 200H1130M70 340H1130" stroke="#E1E5EC"/>
<g font-size="15">
<rect x="72" y="220" width="130" height="90" rx="8" fill="#DCE6FB"/><text x="82" y="246" font-weight="700" fill="#172338">Terjadwal</text><text x="82" y="270" fill="#454C5C">Edukasi</text><text x="82" y="292" fill="#454C5C">10.00</text>
<rect x="226" y="220" width="130" height="90" rx="8" fill="#fff" stroke="#1E5BD8" stroke-width="2" stroke-dasharray="7 5"/><text x="236" y="246" font-weight="700" fill="#1E5BD8">Draft</text><text x="236" y="270" fill="#454C5C">Demo</text><text x="236" y="292" fill="#454C5C">tunggu review</text>
<rect x="380" y="220" width="130" height="90" rx="8" fill="#fff" stroke="#676E7B" stroke-dasharray="4 4"/><text x="390" y="258" fill="#676E7B">Slot fleksibel</text>
<rect x="534" y="220" width="130" height="90" rx="8" fill="#DCE6FB"/><text x="544" y="246" font-weight="700" fill="#172338">Terjadwal</text><text x="544" y="270" fill="#454C5C">Cerita</text><text x="544" y="292" fill="#454C5C">19.00</text>
<rect x="688" y="220" width="130" height="90" rx="8" fill="#fff" stroke="#1E5BD8" stroke-width="2" stroke-dasharray="7 5"/><text x="698" y="246" font-weight="700" fill="#1E5BD8">Draft</text><text x="698" y="270" fill="#454C5C">Penawaran</text><text x="698" y="292" fill="#454C5C">cek harga</text>
<rect x="842" y="220" width="130" height="90" rx="8" fill="#DCE6FB"/><text x="852" y="246" font-weight="700" fill="#172338">Terjadwal</text><text x="852" y="270" fill="#454C5C">Demo</text><text x="852" y="292" fill="#454C5C">11.00</text>
<rect x="996" y="220" width="130" height="90" rx="8" fill="#fff" stroke="#676E7B" stroke-dasharray="4 4"/><text x="1006" y="258" fill="#676E7B">Slot fleksibel</text>
</g>
<g font-size="16" fill="#454C5C">
<text x="90" y="380" font-weight="700" fill="#172338">Keterangan</text>
<rect x="90" y="400" width="26" height="20" rx="4" fill="#DCE6FB"/><text x="128" y="416">Terjadwal: lolos review, jam terbit sudah dipasang</text>
<rect x="90" y="436" width="26" height="20" rx="4" fill="#fff" stroke="#1E5BD8" stroke-width="2" stroke-dasharray="5 3"/><text x="128" y="452">Draft: tidak terbit sampai dipindah ke terjadwal</text>
<rect x="90" y="472" width="26" height="20" rx="4" fill="#fff" stroke="#676E7B" stroke-dasharray="4 4"/><text x="128" y="488">Slot fleksibel: sengaja kosong untuk pertanyaan pelanggan atau perubahan stok</text>
</g></g>
<text x="60" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#676E7B">Ilustrasi alur kerja. Nama status di aplikasi bisa berbeda.</text>
</svg>
