<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-labelledby="t d"><title id="t">Biaya per bulan untuk sekitar 10 kanal</title><desc id="d">Perbandingan biaya per bulan untuk sekitar 10 kanal media sosial menurut halaman harga resmi yang dicek 25 November 2026: Mixpost Spark cloud US$29 (11 kanal, 1 pengguna, bulanan), Postiz Team cloud US$39 (10 kanal, bulanan), Buffer Essentials US$60 (10 kanal x US$6, bulanan), Hootsuite Standard US$99 (10 akun, per pengguna, ditagih tahunan), dan Buffer Team US$120 (10 kanal x US$12, bulanan).</desc><rect width="1200" height="530" fill="#f4f7ff"/><text x="40" y="84" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Mixpost Spark (cloud)</text><text x="40" y="110" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="start">11 kanal, 1 pengguna, bayar bulanan</text><rect x="360" y="64" width="142.76923076923077" height="46" rx="10" fill="#1f8a7a"/><text x="516.7692307692307" y="96" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#1f8a7a" font-weight="800" text-anchor="start">US$29 / bulan</text><text x="40" y="168" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Postiz Team (cloud)</text><text x="40" y="194" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="start">10 kanal, anggota tim tak terbatas, bulanan</text><rect x="360" y="148" width="192" height="46" rx="10" fill="#1f8a7a"/><text x="566" y="180" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#1f8a7a" font-weight="800" text-anchor="start">US$39 / bulan</text><text x="40" y="252" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Buffer Essentials</text><text x="40" y="278" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="start">10 kanal x US$6, 1 pengguna, bulanan</text><rect x="360" y="232" width="295.3846153846154" height="46" rx="10" fill="#2457d6"/><text x="669.3846153846155" y="264" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#2457d6" font-weight="800" text-anchor="start">US$60 / bulan</text><text x="40" y="336" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Hootsuite Standard</text><text x="40" y="362" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="start">10 akun, per pengguna, ditagih tahunan</text><rect x="360" y="316" width="487.3846153846154" height="46" rx="10" fill="#6a4fd1"/><text x="861.3846153846155" y="348" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#6a4fd1" font-weight="800" text-anchor="start">US$99 / bulan</text><text x="40" y="420" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="start">Buffer Team</text><text x="40" y="446" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="start">10 kanal x US$12, tim tak terbatas, bulanan</text><rect x="360" y="400" width="590.7692307692308" height="46" rx="10" fill="#2457d6"/><text x="964.7692307692308" y="432" font-family="Figtree, Inter, Arial, sans-serif" font-size="22" fill="#2457d6" font-weight="800" text-anchor="start">US$120 / bulan</text><text x="40" y="500" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#3b4a6b" font-weight="600" text-anchor="start">Harga resmi dicek 25 November 2026, sebelum pajak. Self-host Postiz atau Mixpost Lite: lisensi gratis, biaya berupa sewa server.</text></svg>
