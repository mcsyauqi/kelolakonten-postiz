<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="560" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Lima langkah pengurutan Feed Instagram</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Menurut penjelasan resmi Instagram; sinyal dan prediksi terus ditambah atau dihapus</text>
<g font-size="20" font-weight="700" fill="#fff">
<rect x="60" y="134" width="204" height="250" rx="16" fill="#2457d6"/><text x="80" y="174">1. Kandidat</text>
<rect x="278" y="134" width="204" height="250" rx="16" fill="#1f8a7a"/><text x="298" y="174">2. Sinyal</text>
<rect x="496" y="134" width="204" height="250" rx="16" fill="#6a4fd1"/><text x="516" y="174">3. Prediksi</text>
<rect x="714" y="134" width="204" height="250" rx="16" fill="#c2581e"/><text x="734" y="174">4. Urutkan</text>
<rect x="932" y="134" width="208" height="250" rx="16" fill="#13235a"/><text x="952" y="174">5. Seimbangkan</text>
</g>
<g font-size="16" fill="#fff">
<text x="80" y="212">posting terbaru dari</text><text x="80" y="236">akun yang diikuti</text><text x="80" y="268">+ posting akun lain</text><text x="80" y="292">yang diperkirakan</text><text x="80" y="316">menarik bagi Anda</text>
<text x="298" y="212">jumlahnya ribuan:</text><text x="298" y="236">waktu posting, ponsel</text><text x="298" y="260">atau web, kebiasaan</text><text x="298" y="284">suka video, format</text><text x="298" y="308">favorit (foto/video)</text>
<text x="516" y="212">sekitar selusin</text><text x="516" y="236">tebakan interaksi,</text><text x="516" y="260">misalnya berhenti</text><text x="516" y="284">beberapa detik,</text><text x="516" y="308">komentar, bagikan</text>
<text x="734" y="212">makin besar peluang</text><text x="734" y="236">dan makin berat</text><text x="734" y="260">bobot tindakannya,</text><text x="734" y="284">makin tinggi posisi</text><text x="734" y="308">posting di Feed</text>
<text x="952" y="212">hindari terlalu</text><text x="952" y="236">banyak posting dari</text><text x="952" y="260">satu akun berturut-</text><text x="952" y="284">turut atau terlalu</text><text x="952" y="308">banyak rekomendasi</text>
</g>
<rect x="60" y="414" width="1080" height="96" rx="16" fill="#fff" stroke="#c9d3f0" stroke-width="2"/>
<text x="84" y="452" font-size="19" font-weight="700" fill="#13235a">Lima interaksi yang paling diperhatikan di Feed</text>
<text x="84" y="484" font-size="17" fill="#3b4a7a">berhenti beberapa detik  ·  komentar  ·  suka  ·  bagikan  ·  ketuk foto profil pembuat</text>
</svg>
