<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="600" fill="#f4f7ff"/>
<text x="40" y="58" font-size="28" font-weight="700" fill="#13235a">Bagian yang tampil di petak grid profil 3:4</text>
<text x="40" y="92" font-size="18" fill="#3b4a7a">Area bergaris = terpotong di thumbnail profil. Posting aslinya tetap utuh saat dibuka.</text>
<defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f4f7ff"/><line x1="0" y1="0" x2="0" y2="12" stroke="#c2581e" stroke-width="5" opacity=".55"/></pattern></defs>
<!-- 1,91:1 : gambar 382x200, petak 150x200 di tengah -->
<rect x="40" y="170" width="382" height="200" fill="url(#h)" stroke="#13235a" stroke-width="2"/>
<rect x="156" y="170" width="150" height="200" fill="#c2581e" stroke="#13235a" stroke-width="3"/>
<!-- 1:1 : 200x200, petak 150x200 -->
<rect x="470" y="170" width="200" height="200" fill="url(#h)" stroke="#13235a" stroke-width="2"/>
<rect x="495" y="170" width="150" height="200" fill="#1f8a7a" stroke="#13235a" stroke-width="3"/>
<!-- 4:5 : 160x200, petak 150x200 -->
<rect x="720" y="170" width="160" height="200" fill="url(#h)" stroke="#13235a" stroke-width="2"/>
<rect x="725" y="170" width="150" height="200" fill="#2457d6" stroke="#13235a" stroke-width="3"/>
<!-- 9:16 : 150x267, petak 150x200 -->
<rect x="950" y="136" width="150" height="267" fill="url(#h)" stroke="#13235a" stroke-width="2"/>
<rect x="950" y="170" width="150" height="200" fill="#6a4fd1" stroke="#13235a" stroke-width="3"/>
<g font-size="22" font-weight="700" fill="#fff" text-anchor="middle"><text x="231" y="278">tampil</text><text x="570" y="278">tampil</text><text x="800" y="278">tampil</text><text x="1025" y="278">tampil</text></g>
<g font-size="20" font-weight="700" fill="#13235a" text-anchor="middle"><text x="231" y="440">Lanskap 1,91:1</text><text x="570" y="440">Persegi 1:1</text><text x="800" y="440">Potret 4:5</text><text x="1025" y="440">Vertikal 9:16</text></g>
<g font-size="17" fill="#3b4a7a" text-anchor="middle">
<text x="231" y="468">kiri dan kanan</text><text x="231" y="490">banyak terpotong</text>
<text x="570" y="468">kiri dan kanan</text><text x="570" y="490">terpotong sedikit</text>
<text x="800" y="468">hampir utuh,</text><text x="800" y="490">tepi samping tipis</text>
<text x="1025" y="468">atas dan bawah</text><text x="1025" y="490">terpotong</text>
</g>
<text x="40" y="560" font-size="17" fill="#13235a">Perkiraan potongan tengah untuk mengisi petak 3:4. Simpan teks dan wajah di tengah supaya aman di semua tampilan.</text>
</svg>
