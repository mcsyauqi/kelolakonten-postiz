<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"><title id="t">Enam hal yang disesuaikan sebelum cross posting</title><desc id="d">Rasio dan durasi, file bersih tanpa watermark, caption, hashtag dan keyword, tag akun, serta ajakan bertindak dicek ulang untuk setiap platform</desc><rect width="1200" height="420" fill="#f4f7ff"/><g font-family="Inter, Arial, sans-serif"><text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Enam hal yang dicek ulang per platform</text><text x="40" y="82" font-size="17" fill="#4a5680">Kontennya sama, kemasannya berbeda</text><rect x="40" y="110" width="545" height="74" rx="10" fill="#fff" stroke="#c9d4f2"/><circle cx="74" cy="147" r="16" fill="#2457d6"/><text x="69" y="153" font-size="16" fill="#fff" font-weight="700">1</text><text x="104" y="141" font-size="16" fill="#13235a" font-weight="700">Rasio dan durasi</text><text x="104" y="166" font-size="15" fill="#4a5680">Vertikal 9x16; cek batas durasi tiap platform</text><rect x="615" y="110" width="545" height="74" rx="10" fill="#fff" stroke="#c9d4f2"/><circle cx="649" cy="147" r="16" fill="#1f8a7a"/><text x="644" y="153" font-size="16" fill="#fff" font-weight="700">2</text><text x="679" y="141" font-size="16" fill="#13235a" font-weight="700">File bersih</text><text x="679" y="166" font-size="15" fill="#4a5680">Unggah file asli, bukan unduhan berwatermark</text><rect x="40" y="200" width="545" height="74" rx="10" fill="#fff" stroke="#c9d4f2"/><circle cx="74" cy="237" r="16" fill="#6a4fd1"/><text x="69" y="243" font-size="16" fill="#fff" font-weight="700">3</text><text x="104" y="231" font-size="16" fill="#13235a" font-weight="700">Caption</text><text x="104" y="256" font-size="15" fill="#4a5680">Panjang dan gaya bahasa sesuai kebiasaan platform</text><rect x="615" y="200" width="545" height="74" rx="10" fill="#fff" stroke="#c9d4f2"/><circle cx="649" cy="237" r="16" fill="#c2581e"/><text x="644" y="243" font-size="16" fill="#fff" font-weight="700">4</text><text x="679" y="231" font-size="16" fill="#13235a" font-weight="700">Hashtag dan keyword</text><text x="679" y="256" font-size="15" fill="#4a5680">Ditaruh di caption, sesuai pencarian platform</text><rect x="40" y="290" width="545" height="74" rx="10" fill="#fff" stroke="#c9d4f2"/><circle cx="74" cy="327" r="16" fill="#13235a"/><text x="69" y="333" font-size="16" fill="#fff" font-weight="700">5</text><text x="104" y="321" font-size="16" fill="#13235a" font-weight="700">Tag dan mention</text><text x="104" y="346" font-size="15" fill="#4a5680">Username mitra bisa berbeda di tiap platform</text><rect x="615" y="290" width="545" height="74" rx="10" fill="#fff" stroke="#c9d4f2"/><circle cx="649" cy="327" r="16" fill="#2457d6"/><text x="644" y="333" font-size="16" fill="#fff" font-weight="700">6</text><text x="679" y="321" font-size="16" fill="#13235a" font-weight="700">Ajakan bertindak</text><text x="679" y="346" font-size="15" fill="#4a5680">Link bio, tombol, atau DM sesuai fitur platform</text><text x="40" y="400" font-size="15" fill="#4a5680">Daftar periksa Kelola Konten. Dibuat oleh Kelola Konten.</text></g></svg>
