<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-labelledby="t d"><title id="t">Cara mengganti thumbnail di YouTube Studio</title><desc id="d">Lima langkah: login ke YouTube Studio, buka menu Konten, pilih video, klik Upload file di bagian Thumbnail, lalu simpan; dengan perbedaan jalur untuk video biasa dan Shorts.</desc><rect width="1200" height="530" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Cara mengganti thumbnail di YouTube Studio</text><rect x="40" y="130" width="190" height="130" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="74" cy="164" r="18" fill="#2457d6"/><text x="74" y="170" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="135" y="214" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="middle">Login</text><text x="135" y="240" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">YouTube Studio</text><line x1="232" y1="195" x2="268" y2="195" stroke="#13235a" stroke-width="3"/><path d="M268 195 L255.0 188.0 L255.0 202.0 z" fill="#13235a"/><rect x="270" y="130" width="190" height="130" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="304" cy="164" r="18" fill="#2457d6"/><text x="304" y="170" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="365" y="214" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="middle">Konten</text><text x="365" y="240" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">menu kiri</text><line x1="462" y1="195" x2="498" y2="195" stroke="#13235a" stroke-width="3"/><path d="M498 195 L485.0 188.0 L485.0 202.0 z" fill="#13235a"/><rect x="500" y="130" width="190" height="130" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="534" cy="164" r="18" fill="#2457d6"/><text x="534" y="170" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="595" y="214" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="middle">Pilih video</text><text x="595" y="240" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">buka detail</text><line x1="692" y1="195" x2="728" y2="195" stroke="#13235a" stroke-width="3"/><path d="M728 195 L715.0 188.0 L715.0 202.0 z" fill="#13235a"/><rect x="730" y="130" width="190" height="130" rx="12" fill="#e3f4f1" stroke="#1f8a7a" stroke-width="3"/><circle cx="764" cy="164" r="18" fill="#1f8a7a"/><text x="764" y="170" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="825" y="214" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="middle">Thumbnail</text><text x="825" y="240" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">Upload file</text><line x1="922" y1="195" x2="958" y2="195" stroke="#13235a" stroke-width="3"/><path d="M958 195 L945.0 188.0 L945.0 202.0 z" fill="#13235a"/><rect x="960" y="130" width="190" height="130" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><circle cx="994" cy="164" r="18" fill="#2457d6"/><text x="994" y="170" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="800" text-anchor="middle">5</text><text x="1055" y="214" font-family="Figtree, Inter, Arial, sans-serif" font-size="21" fill="#13235a" font-weight="800" text-anchor="middle">Simpan</text><text x="1055" y="240" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">tunggu tampil</text><rect x="40" y="320" width="540" height="120" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="64" y="356" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#2457d6" font-weight="800" text-anchor="start">Video biasa</text><text x="64" y="386" font-family="Figtree, Inter, Arial, sans-serif" font-size="15.5" fill="#13235a" font-weight="600" text-anchor="start">Konten, buka video, lalu di bagian Thumbnail</text><text x="64" y="412" font-family="Figtree, Inter, Arial, sans-serif" font-size="15.5" fill="#13235a" font-weight="600" text-anchor="start">pilih Upload file atau Dapatkan saran</text><rect x="620" y="320" width="540" height="120" rx="12" fill="#ffffff" stroke="#1f8a7a" stroke-width="2"/><text x="644" y="356" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#1f8a7a" font-weight="800" text-anchor="start">Shorts</text><text x="644" y="386" font-family="Figtree, Inter, Arial, sans-serif" font-size="15.5" fill="#13235a" font-weight="600" text-anchor="start">Konten, tab Shorts, lalu Upload file</text><text x="644" y="412" font-family="Figtree, Inter, Arial, sans-serif" font-size="15.5" fill="#13235a" font-weight="600" text-anchor="start">rasio yang direkomendasikan 9:16</text><text x="600" y="495" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#c2581e" font-weight="700" text-anchor="middle">Unggah thumbnail sendiri butuh akun terverifikasi. Perubahan bisa butuh waktu sebelum tampil.</text></svg>
