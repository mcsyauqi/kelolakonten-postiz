<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="460" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Satu postingan, tiga akun, lima kali tampil</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Contoh rekaan: reach menghitung akunnya, impression menghitung tayangnya</text>
<rect x="60" y="140" width="250" height="220" rx="18" fill="#2457d6"/>
<text x="185" y="240" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Postingan</text>
<text x="185" y="272" font-size="16" fill="#fff" text-anchor="middle">carousel promo</text>
<path d="M310 250 L420 171 M310 250 L420 250 M310 250 L420 329" stroke="#6a4fd1" stroke-width="3" fill="none"/>
<g font-size="17" fill="#13235a">
<rect x="420" y="140" width="330" height="62" rx="12" fill="#fff" stroke="#c9d3f2"/>
<text x="440" y="178">Akun A melihat 1 kali</text>
<rect x="420" y="219" width="330" height="62" rx="12" fill="#fff" stroke="#c9d3f2"/>
<text x="440" y="257">Akun B melihat 3 kali</text>
<rect x="420" y="298" width="330" height="62" rx="12" fill="#fff" stroke="#c9d3f2"/>
<text x="440" y="336">Akun C melihat 1 kali</text>
</g>
<rect x="830" y="140" width="310" height="100" rx="16" fill="#1f8a7a"/>
<text x="852" y="182" font-size="20" font-weight="700" fill="#fff">Reach = 3</text>
<text x="852" y="214" font-size="16" fill="#fff">akun unik, dihitung sekali</text>
<rect x="830" y="260" width="310" height="100" rx="16" fill="#c2581e"/>
<text x="852" y="302" font-size="20" font-weight="700" fill="#fff">Impression = 5</text>
<text x="852" y="334" font-size="16" fill="#fff">1 + 3 + 1 kali tampil</text>
<text x="60" y="420" font-size="17" fill="#3b4a7a">Frekuensi rata-rata = 5 : 3 = 1,67 kali per akun. Impression tidak pernah lebih kecil dari reach.</text>
</svg>
