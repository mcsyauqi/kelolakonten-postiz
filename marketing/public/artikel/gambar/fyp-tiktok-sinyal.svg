<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="440" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Sinyal kuat dan sinyal lemah</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Contoh yang disebut TikTok sendiri, ditambah turunan praktis untuk akun bisnis</text>
<rect x="60" y="130" width="528" height="220" rx="16" fill="#13235a"/>
<text x="82" y="170" font-size="20" font-weight="700" fill="#fff">Sinyal kuat (bobot lebih besar)</text>
<text x="82" y="202" font-size="15" fill="#fff">Contoh TikTok: penonton menonton video yang lebih</text>
<text x="82" y="223" font-size="15" fill="#fff">panjang dari awal sampai akhir.</text>
<text x="82" y="244" font-size="15" fill="#fff">Turunan praktis: video ditonton tuntas, ditonton</text>
<text x="82" y="265" font-size="15" fill="#fff">ulang, dibagikan, atau memicu komentar bermakna.</text>
<rect x="612" y="130" width="528" height="220" rx="16" fill="#c2581e"/>
<text x="634" y="170" font-size="20" font-weight="700" fill="#fff">Sinyal lemah (bobot lebih kecil)</text>
<text x="634" y="202" font-size="15" fill="#fff">Contoh TikTok: penonton dan kreator berada di</text>
<text x="634" y="223" font-size="15" fill="#fff">negara yang sama.</text>
<text x="634" y="244" font-size="15" fill="#fff">Turunan praktis: hal yang tidak dipilih aktif oleh</text>
<text x="634" y="265" font-size="15" fill="#fff">penonton, sehingga tidak banyak mengubah urutan.</text>
<text x="60" y="404" font-size="17" fill="#3b4a7a">Membuat orang menonton sampai habis lebih berguna daripada mengutak-atik hal teknis kecil.</text>
</svg>
