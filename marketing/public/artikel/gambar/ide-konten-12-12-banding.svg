<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-labelledby="t d">
<title id="t">Hanya posting diskon dan konten bertahap berbeda hasilnya</title>
<desc id="d">Perbandingan: toko yang hanya memposting diskon di hari H dibanding toko yang membangun konten bertahap selama tiga minggu.</desc>
<rect width="1200" height="512" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Hanya posting diskon dan konten bertahap berbeda hasilnya</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Yang dibangun bukan cuma harga, tetapi alasan untuk menunggu</text>
<rect x="40" y="116" width="548" height="44" rx="8" fill="#c2581e"/><rect x="612" y="116" width="548" height="44" rx="8" fill="#2457d6"/><text x="58" y="145" font-size="18" fill="#ffffff" font-weight="700">Hanya posting diskon di hari H</text><text x="630" y="145" font-size="18" fill="#ffffff" font-weight="700">Konten bertahap 3 minggu</text><rect x="40" y="172" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="172" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="195" font-size="16" fill="#13235a">Pengikut baru tahu promo pada hari itu</text><text x="630" y="195" font-size="16" fill="#13235a">Pengikut sudah menandai produk incaran</text><rect x="40" y="234" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="234" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="257" font-size="16" fill="#13235a">Pertanyaan menumpuk di chat saat ramai</text><text x="630" y="257" font-size="16" fill="#13235a">Pertanyaan umum sudah dijawab lewat konten</text><rect x="40" y="296" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="296" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="319" font-size="16" fill="#13235a">Satu unggahan memikul semua pesan</text><text x="630" y="319" font-size="16" fill="#13235a">Pesan dibagi: teaser, bukti, detail, pengingat</text><rect x="40" y="358" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="358" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="381" font-size="16" fill="#13235a">Tidak ada data untuk dievaluasi</text><text x="630" y="381" font-size="16" fill="#13235a">Ada data simpan, klik, dan chat per minggu</text><rect x="40" y="420" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="420" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="443" font-size="16" fill="#13235a">Tim panik menyiapkan konten mendadak</text><text x="630" y="443" font-size="16" fill="#13235a">Konten sudah dijadwalkan, tim fokus melayani</text>
</g>
</svg>
