<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Figtree,Segoe UI,Arial,sans-serif">
<rect width="1200" height="630" fill="#f4f7ff"/>
<rect x="300" y="40" width="600" height="90" rx="18" fill="#13235a"/>
<text x="600" y="78" text-anchor="middle" font-size="20" fill="#a9c2ff">LAPIS 1: TUJUAN BISNIS</text>
<text x="600" y="110" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Lebih banyak pembeli kembali</text>
<g stroke="#2457d6" stroke-width="3" fill="none"><path d="M600 130 V170 M165 170 H1035 M165 170 V200 M455 170 V200 M745 170 V200 M1035 170 V200"/></g>
<text x="40" y="158" font-size="18" fill="#2457d6" font-weight="700">LAPIS 2: PILAR</text>
