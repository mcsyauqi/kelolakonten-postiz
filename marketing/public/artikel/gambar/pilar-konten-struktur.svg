<rect x="50" y="200" width="230" height="110" rx="16" fill="#2457d6"/><text x="165" y="248">Edukasi</text><text x="165" y="278" font-size="18" font-weight="400">cara pakai, tips</text>
<rect x="340" y="200" width="230" height="110" rx="16" fill="#1f8a7a"/><text x="455" y="248">Cerita produk</text><text x="455" y="278" font-size="18" font-weight="400">proses, pemasok</text>
<rect x="630" y="200" width="230" height="110" rx="16" fill="#6a4fd1"/><text x="745" y="248">Bukti</text><text x="745" y="278" font-size="18" font-weight="400">ulasan berizin</text>
<rect x="920" y="200" width="230" height="110" rx="16" fill="#c2581e"/><text x="1035" y="248">Promo</text><text x="1035" y="278" font-size="18" font-weight="400">menu baru, restock</text>
</g>
<text x="40" y="360" font-size="18" fill="#2457d6" font-weight="700">LAPIS 3: FORMAT (BOLEH BERGANTI)</text>
<g font-size="18" fill="#13235a" text-anchor="middle">
<g fill="#fff" stroke="#c9d6f5" stroke-width="2">
<rect x="50" y="380" width="230" height="56" rx="12"/><rect x="50" y="446" width="230" height="56" rx="12"/>
<rect x="340" y="380" width="230" height="56" rx="12"/><rect x="340" y="446" width="230" height="56" rx="12"/>
<rect x="630" y="380" width="230" height="56" rx="12"/><rect x="630" y="446" width="230" height="56" rx="12"/>
<rect x="920" y="380" width="230" height="56" rx="12"/><rect x="920" y="446" width="230" height="56" rx="12"/></g>
<text x="165" y="414">Carousel langkah</text><text x="165" y="480">Video 30 detik</text>
<text x="455" y="414">Video proses</text><text x="455" y="480">Foto di balik layar</text>
<text x="745" y="414">Kutipan ulasan</text><text x="745" y="480">Sebelum dan sesudah</text>
<text x="1035" y="414">Foto produk</text><text x="1035" y="480">Story hitung mundur</text>
