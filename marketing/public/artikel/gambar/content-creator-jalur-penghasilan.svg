<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="560" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Lima jalur penghasilan content creator</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Syarat program platform diambil dari halaman bantuan resmi, diakses 28 Oktober 2026</text>
<g font-size="17" fill="#13235a">
<rect x="60" y="124" width="1080" height="72" rx="14" fill="#fff" stroke="#c2581e" stroke-width="2"/><rect x="60" y="124" width="290" height="72" rx="14" fill="#c2581e"/><rect x="330" y="124" width="20" height="72" fill="#c2581e"/>
<text x="80" y="167" font-size="19" font-weight="700" fill="#fff">YouTube Partner Program</text>
<text x="374" y="154">1.000 subscriber + 4.000 jam tonton (12 bulan terakhir), atau</text><text x="374" y="180">1.000 subscriber + 10 juta tayangan Shorts (90 hari terakhir)</text>
<rect x="60" y="210" width="1080" height="72" rx="14" fill="#fff" stroke="#13235a" stroke-width="2"/><rect x="60" y="210" width="290" height="72" rx="14" fill="#13235a"/><rect x="330" y="210" width="20" height="72" fill="#13235a"/>
<text x="80" y="253" font-size="19" font-weight="700" fill="#fff">TikTok Creator Rewards</text>
<text x="374" y="240">Minimal 18 tahun, 10.000 pengikut, 100.000 tayangan dalam 30 hari,</text><text x="374" y="266">video minimal 1 menit, dan hanya di negara tempat program tersedia</text>
<rect x="60" y="296" width="1080" height="72" rx="14" fill="#fff" stroke="#6a4fd1" stroke-width="2"/><rect x="60" y="296" width="290" height="72" rx="14" fill="#6a4fd1"/><rect x="330" y="296" width="20" height="72" fill="#6a4fd1"/>
<text x="80" y="339" font-size="19" font-weight="700" fill="#fff">Konten bermerek</text>
<text x="374" y="326">Dibayar merek (uang atau barang gratis); di Instagram dan Facebook wajib</text><text x="374" y="352">memakai alat konten bermerek dan menandai mitra bisnisnya</text>
<rect x="60" y="382" width="1080" height="72" rx="14" fill="#fff" stroke="#2457d6" stroke-width="2"/><rect x="60" y="382" width="290" height="72" rx="14" fill="#2457d6"/><rect x="330" y="382" width="20" height="72" fill="#2457d6"/>
<text x="80" y="425" font-size="19" font-weight="700" fill="#fff">Afiliasi</text>
<text x="374" y="412">Komisi dari penjualan lewat tautan khusus kreator;</text><text x="374" y="438">syarat dan besaran komisi berbeda di tiap program</text>
<rect x="60" y="468" width="1080" height="72" rx="14" fill="#fff" stroke="#1f8a7a" stroke-width="2"/><rect x="60" y="468" width="290" height="72" rx="14" fill="#1f8a7a"/><rect x="330" y="468" width="20" height="72" fill="#1f8a7a"/>
<text x="80" y="511" font-size="19" font-weight="700" fill="#fff">Produk dan jasa sendiri</text>
<text x="374" y="498">Jual produk, kelas, atau jasa ke audiens sendiri;</text><text x="374" y="524">tidak perlu menunggu ambang pengikut dari platform</text>
</g>
</svg>
