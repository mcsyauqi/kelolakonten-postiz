<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="t d">
<title id="t">Empat jenis hashtag untuk akun bisnis</title>
<desc id="d">Empat kolom jenis hashtag: merek, produk, lokal, komunitas, dengan contoh</desc>
<rect width="1200" height="390" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Empat jenis hashtag untuk akun bisnis</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Susun lima tagar dari empat jenis berbeda</text>
<rect x="40" y="120" width="260" height="160" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="152" font-size="18" font-weight="700" fill="#2457d6">Merek</text><text x="58" y="180" font-size="15" fill="#13235a">#namausahaanda</text><text x="58" y="202" font-size="15" fill="#13235a">satu, dipakai di</text><text x="58" y="224" font-size="15" fill="#13235a">semua postingan</text><rect x="325" y="120" width="260" height="160" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="343" y="152" font-size="18" font-weight="700" fill="#1f8a7a">Produk</text><text x="343" y="180" font-size="15" fill="#13235a">#kuekering</text><text x="343" y="202" font-size="15" fill="#13235a">#nastar</text><text x="343" y="224" font-size="15" fill="#13235a">apa yang dijual</text><rect x="610" y="120" width="260" height="160" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="628" y="152" font-size="18" font-weight="700" fill="#c2581e">Lokal</text><text x="628" y="180" font-size="15" fill="#13235a">#kulinerjogja</text><text x="628" y="202" font-size="15" fill="#13235a">kota atau daerah</text><text x="628" y="224" font-size="15" fill="#13235a">jangkauan kirim</text><rect x="895" y="120" width="260" height="160" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="913" y="152" font-size="18" font-weight="700" fill="#6a4fd1">Komunitas</text><text x="913" y="180" font-size="15" fill="#13235a">#umkmindonesia</text><text x="913" y="202" font-size="15" fill="#13235a">kelompok atau</text><text x="913" y="224" font-size="15" fill="#13235a">kampanye</text><text x="40" y="330" font-size="17" fill="#13235a" font-weight="700" text-anchor="start">Total maksimal 5 tagar per postingan. Ambil 1 merek + 2 produk + 1 lokal + 1 komunitas.</text><text x="40" y="360" font-size="15" fill="#4a5680" font-weight="400" text-anchor="start">Contoh tagar hanya ilustrasi. Pilih yang benar-benar sesuai isi postingan.</text>
</g>
</svg>
