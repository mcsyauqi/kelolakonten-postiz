<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d">
<title id="t">Tiga cara mengisi link bio Instagram</title>
<desc id="d">Tiga kotak berdampingan: satu tautan langsung, hingga lima tautan bawaan Instagram, dan halaman link in bio berisi banyak tombol.</desc>
<rect width="1200" height="370" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Tiga cara mengisi link bio Instagram</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep; ketiganya bisa dipakai bergantian sesuai musim kampanye</text>
<rect x="40" y="120" width="350" height="170" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="58" y="152" font-size="18" font-weight="700" fill="#1f8a7a">1. Satu tautan langsung</text><text x="58" y="180" font-size="15" fill="#13235a">Bio menunjuk satu halaman:</text><text x="58" y="202" font-size="15" fill="#13235a">katalog, WhatsApp, atau</text><text x="58" y="224" font-size="15" fill="#13235a">promo yang sedang jalan.</text><text x="58" y="246" font-size="15" fill="#13235a">Paling sederhana, satu klik.</text><rect x="420" y="120" width="350" height="170" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="438" y="152" font-size="18" font-weight="700" fill="#2457d6">2. Hingga 5 tautan bawaan</text><text x="438" y="180" font-size="15" fill="#13235a">Ditambah lewat Edit profil,</text><text x="438" y="202" font-size="15" fill="#13235a">Tautan. Tautan pertama</text><text x="438" y="224" font-size="15" fill="#13235a">tampil, sisanya muncul</text><text x="438" y="246" font-size="15" fill="#13235a">setelah pengunjung mengetuk.</text><rect x="800" y="120" width="350" height="170" rx="10" fill="#ffffff" stroke="#c9d4f2"/><text x="818" y="152" font-size="18" font-weight="700" fill="#6a4fd1">3. Halaman link in bio</text><text x="818" y="180" font-size="15" fill="#13235a">Satu halaman berisi banyak</text><text x="818" y="202" font-size="15" fill="#13235a">tombol: buatan sendiri di</text><text x="818" y="224" font-size="15" fill="#13235a">situs Anda atau layanan</text><text x="818" y="246" font-size="15" fill="#13235a">pihak ketiga.</text><text x="40" y="340" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Pilih berdasarkan jumlah tujuan yang benar-benar aktif, bukan berdasarkan berapa banyak tombol yang bisa dipasang.</text>
</g>
</svg>
