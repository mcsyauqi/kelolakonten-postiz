<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="Figtree,Inter,Segoe UI,Arial,sans-serif">
<rect width="1200" height="410" fill="#f4f7ff"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#13235a">Anatomi video pendek yang ditonton sampai habis</text>
<text x="60" y="96" font-size="18" fill="#3b4a7a">Hook membuka janji, isi menepatinya, penutup memberi langkah berikutnya</text>
<rect x="60" y="130" width="252" height="190" rx="16" fill="#13235a"/>
<text x="82" y="170" font-size="20" font-weight="700" fill="#fff">1. Hook</text>
<text x="82" y="196" font-size="20" font-weight="700" fill="#fff">detik pertama</text>
<text x="82" y="228" font-size="15" fill="#fff">Visual, teks layar, dan</text>
<text x="82" y="249" font-size="15" fill="#fff">kalimat pertama yang</text>
<text x="82" y="270" font-size="15" fill="#fff">membuat orang berhenti</text>
<text x="82" y="291" font-size="15" fill="#fff">menggulir</text>
<rect x="336" y="130" width="252" height="190" rx="16" fill="#2457d6"/>
<text x="358" y="170" font-size="20" font-weight="700" fill="#fff">2. Janji</text>
<text x="358" y="196" font-size="20" font-weight="700" fill="#fff">yang jelas</text>
<text x="358" y="228" font-size="15" fill="#fff">Penonton tahu apa yang</text>
<text x="358" y="249" font-size="15" fill="#fff">akan didapat kalau</text>
<text x="358" y="270" font-size="15" fill="#fff">menonton sampai akhir</text>
<rect x="612" y="130" width="252" height="190" rx="16" fill="#1f8a7a"/>
<text x="634" y="170" font-size="20" font-weight="700" fill="#fff">3. Isi yang</text>
<text x="634" y="196" font-size="20" font-weight="700" fill="#fff">menepati janji</text>
<text x="634" y="228" font-size="15" fill="#fff">Langkah, bukti, atau</text>
<text x="634" y="249" font-size="15" fill="#fff">cerita, tanpa basa-basi</text>
<text x="634" y="270" font-size="15" fill="#fff">dan tanpa mengulang</text>
<rect x="888" y="130" width="252" height="190" rx="16" fill="#6a4fd1"/>
<text x="910" y="170" font-size="20" font-weight="700" fill="#fff">4. Penutup</text>
<text x="910" y="196" font-size="20" font-weight="700" fill="#fff">dan ajakan</text>
<text x="910" y="228" font-size="15" fill="#fff">Satu ajakan: simpan,</text>
<text x="910" y="249" font-size="15" fill="#fff">komentar, kunjungi</text>
<text x="910" y="270" font-size="15" fill="#fff">profil, atau tanya</text>
<text x="60" y="374" font-size="17" fill="#3b4a7a">Hook yang menjanjikan sesuatu yang tidak ditepati isi membuat penonton pergi di tengah video.</text>
</svg>
