<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
<title id="t">Rasio foto yang dipertahankan Instagram</title>
<desc id="d">Empat persegi panjang dengan skala sama: 1,91:1, 1:1, 4:5, dan 3:4 pada lebar 1080 piksel.</desc>
<rect width="1200" height="500" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Rasio foto yang dipertahankan Instagram</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Angka dari Pusat Bantuan Instagram; semua slide dalam satu carousel memakai orientasi yang sama</text>
<rect x="80" y="286.8" width="216" height="113.2" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="188" y="432" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Lanskap 1,91:1</text><text x="188" y="456" font-size="15" fill="#2457d6" font-weight="600" text-anchor="middle">1080 x 566 piksel</text><text x="188" y="478" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Paling pendek di layar</text><rect x="360" y="184" width="216" height="216" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="468" y="432" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Persegi 1:1</text><text x="468" y="456" font-size="15" fill="#2457d6" font-weight="600" text-anchor="middle">1080 x 1080 piksel</text><text x="468" y="478" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Aman untuk grid lama</text><rect x="640" y="130" width="216" height="270" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="748" y="432" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Potret 4:5</text><text x="748" y="456" font-size="15" fill="#2457d6" font-weight="600" text-anchor="middle">1080 x 1350 piksel</text><text x="748" y="478" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Lebih tinggi di kabar</text><rect x="920" y="112" width="216" height="288" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><text x="1028" y="432" font-size="18" fill="#13235a" font-weight="700" text-anchor="middle">Potret 3:4</text><text x="1028" y="456" font-size="15" fill="#2457d6" font-weight="600" text-anchor="middle">1080 x 1440 piksel</text><text x="1028" y="478" font-size="14" fill="#4a5680" font-weight="400" text-anchor="middle">Batas tertinggi foto</text>
</g>
</svg>
