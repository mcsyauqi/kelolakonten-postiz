<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-labelledby="t d">
<title id="t">Repost mentah dan repurpose berbeda</title>
<desc id="d">Perbandingan repost mentah dengan repurpose: repost memakai file dan caption yang sama, repurpose mengubah hook, rasio, caption, dan sudut pandang.</desc>
<rect width="1200" height="512" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Repost mentah dan repurpose berbeda</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Yang dinilai pembaca dan platform adalah nilai tambahnya</text>
<rect x="40" y="116" width="548" height="44" rx="8" fill="#c2581e"/><rect x="612" y="116" width="548" height="44" rx="8" fill="#2457d6"/><text x="58" y="145" font-size="18" fill="#ffffff" font-weight="700">Repost mentah</text><text x="630" y="145" font-size="18" fill="#ffffff" font-weight="700">Repurpose</text><rect x="40" y="172" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="172" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="195" font-size="16" fill="#13235a">File sama, ada watermark aplikasi lain</text><text x="630" y="195" font-size="16" fill="#13235a">Ekspor bersih dari file asli</text><rect x="40" y="234" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="234" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="257" font-size="16" fill="#13235a">Rasio dipaksakan, teks terpotong</text><text x="630" y="257" font-size="16" fill="#13235a">Rasio dan posisi teks disesuaikan</text><rect x="40" y="296" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="296" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="319" font-size="16" fill="#13235a">Caption disalin persis</text><text x="630" y="319" font-size="16" fill="#13235a">Caption ditulis ulang per platform</text><rect x="40" y="358" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="358" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="381" font-size="16" fill="#13235a">Hook tidak berubah</text><text x="630" y="381" font-size="16" fill="#13235a">Hook baru sesuai kebiasaan penonton</text><rect x="40" y="420" width="548" height="54" rx="8" fill="#e8eefc"/><rect x="612" y="420" width="548" height="54" rx="8" fill="#ffffff"/><text x="58" y="443" font-size="16" fill="#13235a">Tidak ada informasi baru</text><text x="630" y="443" font-size="16" fill="#13235a">Ada contoh, data, atau sudut pandang baru</text>
</g>
</svg>
