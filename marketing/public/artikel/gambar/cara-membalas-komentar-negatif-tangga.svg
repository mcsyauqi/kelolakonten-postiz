<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" width="1200" height="505" role="img" aria-labelledby="t d">
<title id="t">Tangga tindakan untuk komentar negatif</title>
<desc id="d">Enam anak tangga dari kiri ke kanan: balas, sembunyikan, batasi, hapus, blokir, dan matikan komentar, dengan contoh kapan dipakai.</desc>
<rect width="1200" height="505" fill="#f4f7ff"/>
<g font-family="Inter, Arial, sans-serif">
<text x="40" y="50" font-size="26" fill="#13235a" font-weight="700">Tangga tindakan untuk komentar negatif</text>
<text x="40" y="82" font-size="17" fill="#4a5680">Ilustrasi konsep; pilih tindakan paling ringan yang menyelesaikan masalah</text>
<rect x="40" y="290" width="172" height="130" rx="8" fill="#ffffff" stroke="#c9d4f2"/><text x="126" y="324" font-size="17" fill="#1f8a7a" font-weight="700" text-anchor="middle">Balas</text><text x="126" y="350" font-size="13" fill="#13235a" font-weight="400" text-anchor="middle">Keluhan sah</text><rect x="228" y="256" width="172" height="164" rx="8" fill="#ffffff" stroke="#c9d4f2"/><text x="314" y="290" font-size="17" fill="#2457d6" font-weight="700" text-anchor="middle">Sembunyikan</text><text x="314" y="316" font-size="13" fill="#13235a" font-weight="400" text-anchor="middle">Kasar, spam</text><rect x="416" y="222" width="172" height="198" rx="8" fill="#ffffff" stroke="#c9d4f2"/><text x="502" y="256" font-size="17" fill="#6a4fd1" font-weight="700" text-anchor="middle">Batasi</text><text x="502" y="282" font-size="13" fill="#13235a" font-weight="400" text-anchor="middle">Akun yang terus mengusik</text><rect x="604" y="188" width="172" height="232" rx="8" fill="#ffffff" stroke="#c9d4f2"/><text x="690" y="222" font-size="17" fill="#c2581e" font-weight="700" text-anchor="middle">Hapus</text><text x="690" y="248" font-size="13" fill="#13235a" font-weight="400" text-anchor="middle">Melanggar aturan</text><rect x="792" y="154" width="172" height="266" rx="8" fill="#ffffff" stroke="#c9d4f2"/><text x="878" y="188" font-size="17" fill="#13235a" font-weight="700" text-anchor="middle">Blokir</text><text x="878" y="214" font-size="13" fill="#13235a" font-weight="400" text-anchor="middle">Serangan berulang</text><rect x="980" y="120" width="172" height="300" rx="8" fill="#ffffff" stroke="#c9d4f2"/><text x="1066" y="154" font-size="17" fill="#c2581e" font-weight="700" text-anchor="middle">Matikan komentar</text><text x="1066" y="180" font-size="13" fill="#13235a" font-weight="400" text-anchor="middle">Postingan diserbu</text><line x1="60" y1="445" x2="1140" y2="445" stroke="#4a5680" stroke-width="2"/><polygon points="1140,445 1131.0,449.3 1131.0,440.7" fill="#4a5680"/><text x="40" y="478" font-size="16" fill="#4a5680" font-weight="400" text-anchor="start">Makin ke kanan makin keras dampaknya bagi percakapan. Mulai dari anak tangga paling rendah yang cukup.</text>
</g>
</svg>
