<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Batas berkas video: unggahan biasa dan iklan berbeda</title><desc id="d">Perbandingan batas durasi, ukuran berkas, format, resolusi, frame rate, dan bitrate antara unggahan lewat Content Posting API TikTok dan iklan In-Feed Non-Spark, menurut dokumentasi resmi TikTok yang dicek 26 November 2026.</desc><rect width="1200" height="630" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Batas berkas video: unggahan biasa dan iklan berbeda</text><rect x="330" y="80" width="410" height="56" rx="12" fill="#1f8a7a" stroke="#1f8a7a" stroke-width="2"/><text x="535" y="116" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="800" text-anchor="middle">Unggahan biasa lewat API</text><rect x="760" y="80" width="400" height="56" rx="12" fill="#2457d6" stroke="#2457d6" stroke-width="2"/><text x="960" y="116" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="800" text-anchor="middle">Iklan In-Feed Non-Spark</text><text x="40" y="190" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Durasi</text><rect x="330" y="150" width="410" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="350" y="186" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">3 menit; sebagian akun 5 atau 10 menit</text><rect x="760" y="150" width="400" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="780" y="186" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">Sampai 10 menit</text><text x="40" y="260" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Ukuran berkas</text><rect x="330" y="220" width="410" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="350" y="256" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">Maksimal 4 GB</text><rect x="760" y="220" width="400" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="780" y="256" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">Maksimal 500 MB</text><text x="40" y="330" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Format</text><rect x="330" y="290" width="410" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="350" y="326" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">MP4 (disarankan), WebM, MOV</text><rect x="760" y="290" width="400" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="780" y="326" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">.mp4, .mov, .mpeg, .3gp, .avi</text><text x="40" y="400" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Resolusi</text><rect x="330" y="360" width="410" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="350" y="396" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">Sisi 360 sampai 4096 px</text><rect x="760" y="360" width="400" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="780" y="396" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">9:16 min. 540 x 960 px</text><text x="40" y="470" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Frame rate</text><rect x="330" y="430" width="410" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="350" y="466" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">23 sampai 60 FPS</text><rect x="760" y="430" width="400" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="780" y="466" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="start">Tidak disebut</text><text x="40" y="540" font-family="Figtree, Inter, Arial, sans-serif" font-size="19" fill="#13235a" font-weight="800" text-anchor="start">Bitrate</text><rect x="330" y="500" width="410" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="350" y="536" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="start">Tidak disebut</text><rect x="760" y="500" width="400" height="58" rx="12" fill="#ffffff" stroke="#cdd7ef" stroke-width="1.5"/><text x="780" y="536" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#13235a" font-weight="600" text-anchor="start">Minimal 516 kbps</text><text x="600" y="600" font-family="Figtree, Inter, Arial, sans-serif" font-size="16" fill="#1f8a7a" font-weight="800" text-anchor="middle">Pakai batas yang lebih ketat dari dua kolom ini, maka satu berkas aman untuk konten organik maupun iklan.</text></svg>
