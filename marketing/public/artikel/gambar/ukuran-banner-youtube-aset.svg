<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d"><title id="t">Tiga aset branding channel YouTube dan syaratnya</title><desc id="d">Tiga kartu: foto profil (JPG, GIF, BMP, atau PNG, maksimal 15 MB, dirender 98 x 98 piksel), banner (minimal 2048 x 1152, rekomendasi 2560 x 1440, area aman 1235 x 338, 6 MB), dan watermark video (minimal 150 x 150, persegi, kurang dari 1 MB).</desc><rect width="1200" height="650" fill="#f4f7ff"/><text x="40" y="52" font-family="Figtree, Inter, Arial, sans-serif" font-size="26" fill="#13235a" font-weight="800" text-anchor="start">Tiga aset branding channel YouTube dan syaratnya</text><rect x="40" y="100" width="350" height="470" rx="16" fill="#ffffff" stroke="#6a4fd1" stroke-width="3"/><circle cx="215" cy="220" r="62" fill="#6a4fd1" opacity="0.22" stroke="#6a4fd1" stroke-width="3"/><circle cx="215" cy="206" r="20" fill="#6a4fd1"/><path d="M179 260 C 185 226, 245 226, 251 260" fill="#6a4fd1"/><text x="215" y="340" font-family="Figtree, Inter, Arial, sans-serif" font-size="24" fill="#6a4fd1" font-weight="800" text-anchor="middle">Foto profil</text><circle cx="78" cy="390" r="6" fill="#6a4fd1"/><text x="96" y="396" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">JPG, GIF, BMP, atau PNG</text><circle cx="78" cy="434" r="6" fill="#6a4fd1"/><text x="96" y="440" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">bukan GIF animasi</text><circle cx="78" cy="478" r="6" fill="#6a4fd1"/><text x="96" y="484" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">maksimal 15 MB</text><circle cx="78" cy="522" r="6" fill="#6a4fd1"/><text x="96" y="528" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">dirender 98 x 98 piksel</text><rect x="420" y="100" width="350" height="470" rx="16" fill="#ffffff" stroke="#2457d6" stroke-width="3"/><rect x="455" y="180" width="280" height="80" rx="6" fill="#2457d6" opacity="0.18" stroke="#2457d6" stroke-width="3"/><rect x="511" y="208" width="168" height="24" rx="4" fill="#ffffff" stroke="#c2581e" stroke-width="2" stroke-dasharray="6 4"/><text x="595" y="340" font-family="Figtree, Inter, Arial, sans-serif" font-size="24" fill="#2457d6" font-weight="800" text-anchor="middle">Banner channel</text><circle cx="458" cy="390" r="6" fill="#2457d6"/><text x="476" y="396" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">minimal 2048 x 1152 px</text><circle cx="458" cy="434" r="6" fill="#2457d6"/><text x="476" y="440" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">rekomendasi 2560 x 1440 px</text><circle cx="458" cy="478" r="6" fill="#2457d6"/><text x="476" y="484" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">area aman 1235 x 338 px</text><circle cx="458" cy="522" r="6" fill="#2457d6"/><text x="476" y="528" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">6 MB atau kurang</text><rect x="800" y="100" width="350" height="470" rx="16" fill="#ffffff" stroke="#1f8a7a" stroke-width="3"/><rect x="929" y="174" width="92" height="92" rx="10" fill="#1f8a7a" opacity="0.22" stroke="#1f8a7a" stroke-width="3"/><path d="M963 202 L995 220 L963 238 Z" fill="#1f8a7a"/><text x="975" y="340" font-family="Figtree, Inter, Arial, sans-serif" font-size="24" fill="#1f8a7a" font-weight="800" text-anchor="middle">Watermark video</text><circle cx="838" cy="390" r="6" fill="#1f8a7a"/><text x="856" y="396" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">minimal 150 x 150 px</text><circle cx="838" cy="434" r="6" fill="#1f8a7a"/><text x="856" y="440" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">gambar persegi</text><circle cx="838" cy="478" r="6" fill="#1f8a7a"/><text x="856" y="484" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">kurang dari 1 MB</text><circle cx="838" cy="522" r="6" fill="#1f8a7a"/><text x="856" y="528" font-family="Figtree, Inter, Arial, sans-serif" font-size="17" fill="#13235a" font-weight="600" text-anchor="start">tampil di pemutar lanskap</text><text x="600" y="620" font-family="Figtree, Inter, Arial, sans-serif" font-size="15" fill="#3b4a6b" font-weight="600" text-anchor="middle">Semua angka dari halaman Bantuan YouTube tentang branding channel, dicek November 2026.</text></svg>
